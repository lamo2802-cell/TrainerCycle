<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainerCycle — TrainerStrength</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root{
    --bg: #10141A; --panel: #171D25; --panel-2: #1D242D; --line: #2A323D;
    --text: #E7ECF2; --text-dim: #8C97A6; --accent: #45D6C4; --danger: #E5484D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; }
  .app{ display:flex; min-height:100vh; flex-wrap:wrap; }
  .sidebar{ width:300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); padding:60px 20px 20px; }
  .main{ flex:1; min-width:340px; padding:24px 28px; max-width:820px; }
  @media (min-width:701px){ .sidebar{ min-height:100vh; } }
  @media (max-width:700px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--line); }
    .main{ max-width:100%; min-width:0; }
  }
  .app.sidebar-collapsed .sidebar{ display:none; }
  .app.sidebar-collapsed .main{ max-width:1100px; margin:0 auto; }
  .top-actions{ position:fixed; top:14px; left:14px; z-index:50; display:flex; gap:8px; }
  .icon-btn{
    width:38px; height:38px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  .top-logo-link{ display:flex; }
  .top-logo{ height:38px; width:auto; border-radius:8px; display:block; }

  h1{ font-size:19px; margin:0; letter-spacing:-0.01em; }
  .sub{ color:var(--text-dim); font-size:12.5px; margin:2px 0 20px; }
  .nav-links{ display:flex; gap:10px; margin:-14px 0 20px; font-size:12.5px; }
  .nav-links a{ color:var(--accent); text-decoration:none; }
  .nav-links span{ color:var(--text-dim); }

  .block{ margin-bottom:24px; }
  .block-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  select{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 9px; font-size:13.5px; width:100%; }
  button{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 13px; font-size:13px; cursor:pointer; width:100%; margin-bottom:8px; }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:#08211E; border-color:var(--accent); font-weight:600; }
  button.danger{ color:var(--danger); }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  .exercise-list{ font-size:12.5px; }
  .exercise-list-row{ padding:6px 0; border-top:1px solid var(--line); color:var(--text-dim); }
  .exercise-list-row:first-child{ border-top:none; }
  .exercise-list-row.current{ color:var(--accent); font-weight:600; }

  .dash{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .metric{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; text-align:center; }
  .metric .val{ font-family:var(--mono); font-size:26px; font-weight:600; }
  .metric .lbl{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }

  .stage{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px; text-align:center; margin-bottom:16px;
  }
  .stage-figure{ width:100%; max-width:220px; margin:0 auto 12px; }
  .positions-row{ display:flex; gap:14px; justify-content:center; margin-bottom:14px; }
  .position-box{ flex:1; max-width:130px; }
  .position-box svg{ width:100%; display:block; }
  .position-label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
  .stage-name{ font-size:22px; font-weight:600; margin-bottom:4px; }
  .stage-target{ font-family:var(--mono); font-size:16px; color:var(--accent); margin-bottom:4px; }
  .stage-notes{ font-size:12.5px; color:var(--text-dim); margin-bottom:16px; }
  .stage-rest-count{ font-family:var(--mono); font-size:48px; font-weight:600; color:var(--accent); margin-bottom:8px; }
  .stage-action button{ width:auto; padding:14px 28px; font-size:16px; margin:0 6px; }

  .next-step{ font-size:12.5px; color:var(--text-dim); text-align:center; margin-bottom:20px; }
  .next-step b{ color:var(--text); }

  .controls{
    display:flex; gap:10px; margin-bottom:10px;
    position:sticky; bottom:0; background:var(--bg);
    padding:10px 0 4px; z-index:10; border-top:1px solid var(--line);
  }
  .controls button{ width:auto; flex:1; margin-bottom:0; }

  .celebrate-overlay{ position:fixed; inset:0; background:rgba(16,20,26,0.94); z-index:200; display:flex; align-items:center; justify-content:center; }
  .celebrate-overlay canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .celebrate-content{ position:relative; z-index:2; text-align:center; padding:0 20px; }
  .celebrate-title{ font-size:clamp(28px,6vw,48px); font-weight:700; color:var(--accent); margin-bottom:10px; }
  .celebrate-subtitle{ font-size:14px; color:var(--text-dim); margin-bottom:26px; font-family:var(--mono); }
  .celebrate-content button{ width:auto; padding:12px 32px; font-size:15px; }
</style>
</head>
<body>
<div class="top-actions">
  <a href="index.html" class="top-logo-link" aria-label="TrainerCycle home"><img src="wordmark.svg" class="top-logo" alt="TrainerCycle"></a>
  <button class="icon-btn" id="sidebarToggle" aria-label="Toggle menu">☰</button>
  <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">⛶</button>
</div>

<div class="app">
  <div class="sidebar">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px;">
      <img src="logo.svg" alt="TrainerCycle" width="34" height="34" style="border-radius:8px;">
      <h1>Trainer<span style="color:var(--accent);">Cycle</span></h1>
    </div>
    <p class="sub">TrainerStrength Session</p>
    <div class="nav-links"><a href="builder.html">Builder</a><span>·</span><a href="live.html">Live Ride</a></div>

    <div class="block">
      <div class="block-title">Workout</div>
      <select id="workoutSelect"><option value="">Choose a workout…</option></select>
    </div>

    <div class="block">
      <div class="block-title">Exercises</div>
      <div class="exercise-list" id="exerciseList"></div>
    </div>
  </div>

  <div class="main">
    <div class="dash">
      <div class="metric"><div class="val" id="mProgress">0 / 0</div><div class="lbl">Sets complete</div></div>
      <div class="metric"><div class="val" id="mElapsed">0:00</div><div class="lbl">Elapsed</div></div>
    </div>

    <div class="stage">
      <div class="stage-figure" id="stageFigure"></div>
      <div class="positions-row" id="positionsRow"></div>
      <div class="stage-name" id="stageName">Choose a workout to begin</div>
      <div class="stage-target" id="stageTarget"></div>
      <div class="stage-notes" id="stageNotes"></div>
      <div class="stage-rest-count" id="stageRestCount" style="display:none;"></div>
      <div class="stage-action" id="stageAction"></div>
    </div>

    <div class="next-step" id="nextStepInfo">—</div>

    <div class="controls">
      <button class="primary" id="startBtn">Start</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button class="danger" id="stopBtn" disabled>Stop</button>
    </div>
  </div>
</div>

<div class="celebrate-overlay" id="celebrateOverlay" style="display:none;">
  <canvas id="celebrateCanvas"></canvas>
  <div class="celebrate-content">
    <div class="celebrate-title" id="celebrateTitle">Workout Complete!</div>
    <div class="celebrate-subtitle" id="celebrateSubtitle"></div>
    <button class="primary" id="celebrateCloseBtn">Nice</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient(

(function(){
  // ---- original stick-figure illustrations (no third-party images) ----
  const FIGURES = {

    },

      svg: '<svg viewBox="0 0 160 160"><rect x="55" y="126" width="14" height="24" rx="5" fill="#8C97A6"/><rect x="91" y="126" width="14" height="24" rx="5" fill="#8C97A6"/><g class="dl-torso" style="transform-box:fill-box; transform-origin:bottom center;"><circle cx="80" cy="60" r="13" fill="none" stroke="#E7ECF2" stroke-width="4"/><rect x="72" y="74" width="16" height="52" rx="6" fill="#45D6C4"/></g></svg>',

    },
    bicep_curl: {
      svg: '<svg viewBox="0 0 160 160"><circle cx="80" cy="30" r="13" fill="none" stroke="#E7ECF2" stroke-width="4"/><rect x="72" y="44" width="16" height="60" rx="6" fill="#45D6C4"/><rect x="60" y="104" width="14" height="46" rx="5" fill="#8C97A6"/><rect x="86" y="104" width="14" height="46" rx="5" fill="#8C97A6"/><g class="bc-hand"><circle cx="100" cy="100" r="9" fill="#F08A3C"/></g></svg>',
      css: '.bc-hand{animation:bcCurl 1.4s ease-in-out infinite;} @keyframes bcCurl{50%{transform:translateY(-55px) translateX(-10px);}}',
      endCss: '.bc-hand{transform:translateY(-55px) translateX(-10px);}'
    },
    shoulder_press: {
      svg: '<svg viewBox="0 0 160 160"><circle cx="80" cy="34" r="13" fill="none" stroke="#E7ECF2" stroke-width="4"/><rect x="72" y="48" width="16" height="56" rx="6" fill="#45D6C4"/><rect x="60" y="104" width="14" height="42" rx="5" fill="#8C97A6"/><rect x="86" y="104" width="14" height="42" rx="5" fill="#8C97A6"/><g class="sp-arms"><circle cx="60" cy="80" r="9" fill="#F08A3C"/><circle cx="100" cy="80" r="9" fill="#F08A3C"/></g></svg>',
      css: '.sp-arms{animation:spPress 1.6s ease-in-out infinite;} @keyframes spPress{50%{transform:translateY(-58px);}}',
      endCss: '.sp-arms{transform:translateY(-58px);}'
    },
    situp: {
      svg: '<svg viewBox="0 0 160 160"><rect x="50" y="130" width="60" height="12" rx="5" fill="#8C97A6"/><g class="su-torso" style="transform-box:fill-box; transform-origin:bottom center;"><circle cx="80" cy="100" r="13" fill="none" stroke="#E7ECF2" stroke-width="4"/><rect x="72" y="60" width="16" height="46" rx="6" fill="#45D6C4" transform="rotate(90 80 106)"/></g></svg>',
      css: '.su-torso{animation:suCurl 1.6s ease-in-out infinite;} @keyframes suCurl{50%{transform:rotate(-75deg) translate(20px,-10px);}}',
      endCss: '.su-torso{transform:rotate(-75deg) translate(20px,-10px);}'
    },
    jumping_jack: {
      svg: '<svg viewBox="0 0 160 160"><circle cx="80" cy="30" r="13" fill="none" stroke="#E7ECF2" stroke-width="4"/><rect x="72" y="44" width="16" height="50" rx="6" fill="#45D6C4"/><g class="jj-armL"><rect x="40" y="46" width="12" height="42" rx="5" fill="#8C97A6"/></g><g class="jj-armR"><rect x="108" y="46" width="12" height="42" rx="5" fill="#8C97A6"/></g><g class="jj-legL"><rect x="60" y="94" width="14" height="48" rx="5" fill="#8C97A6"/></g><g class="jj-legR"><rect x="86" y="94" width="14" height="48" rx="5" fill="#8C97A6"/></g></svg>',
      css: '.jj-armL{animation:jjArmL 1.1s ease-in-out infinite; transform-origin:top right;} .jj-armR{animation:jjArmR 1.1s ease-in-out infinite; transform-origin:top left;} .jj-legL{animation:jjLegL 1.1s ease-in-out infinite; transform-origin:top;} .jj-legR{animation:jjLegR 1.1s ease-in-out infinite; transform-origin:top;} @keyframes jjArmL{50%{transform:rotate(-35deg);}} @keyframes jjArmR{50%{transform:rotate(35deg);}} @keyframes jjLegL{50%{transform:translateX(-16px);}} @keyframes jjLegR{50%{transform:translateX(16px);}}',
      endCss: '.jj-armL{transform:rotate(-35deg); transform-origin:top right;} .jj-armR{transform:rotate(35deg); transform-origin:top left;} .jj-legL{transform:translateX(-16px); transform-origin:top;} .jj-legR{transform:translateX(16px); transform-origin:top;}'
    },
    glute_bridge: {
      svg: '<svg viewBox="0 0 160 160"><circle cx="40" cy="120" r="13" fill="none" stroke="#E7ECF2" stroke-width="4"/><rect x="46" y="114" width="60" height="12" rx="6" fill="#8C97A6"/><g class="gb-hips"><rect x="98" y="100" width="14" height="30" rx="5" fill="#45D6C4"/></g><rect x="106" y="126" width="14" height="30" rx="5" fill="#8C97A6"/></svg>',
      css: '.gb-hips{animation:gbLift 1.6s ease-in-out infinite; transform-origin:bottom;} @keyframes gbLift{50%{transform:translateY(-18px);}}',
      endCss: '.gb-hips{transform:translateY(-18px); transform-origin:bottom;}'
    },
    mountain_climber: {
      svg: '<svg viewBox="0 0 160 160"><circle cx="30" cy="70" r="13" fill="none" stroke="#E7ECF2" stroke-width="4"/><rect x="42" y="64" width="70" height="12" rx="6" fill="#45D6C4"/><g class="mc-legA"><rect x="108" y="60" width="12" height="40" rx="5" fill="#8C97A6"/></g><g class="mc-legB"><rect x="108" y="60" width="12" height="40" rx="5" fill="#F08A3C"/></g><rect x="30" y="60" width="12" height="40" rx="5" fill="#8C97A6" transform="rotate(-20 36 80)"/></svg>',

      endCss: '.mc-legA{transform:rotate(-55deg) translateX(-10px); transform-origin:top;} .mc-legB{transform:rotate(15deg); transform-origin:top;}'

  };
  function renderFigure(key, container){
    const f = FIGURES[key];
    if (!f){ container.innerHTML = '<div style="padding:40px 0; color:var(--text-dim); font-size:13px;">No illustration yet for this exercise.</div>'; return; }
    container.innerHTML = '<style>'+f.css+'</style>'+f.svg;
  }
  function renderPositions(key, container){
    const f = FIGURES[key];
    if (!f){ container.innerHTML = ''; return; }
    if (f.hold){
      container.innerHTML = '<div class="position-box"><div>'+f.svg+'</div><div class="position-label">Hold position</div></div>';
      return;
    }
    if (!f.endCss){ container.innerHTML = ''; return; }
    container.innerHTML =
      '<div class="position-box"><div>'+f.svg+'</div><div class="position-label">Start</div></div>' +
      '<div class="position-box"><div><style>'+f.endCss+'</style>'+f.svg+'</div><div class="position-label">Finish</div></div>';
  }

  function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }

  let library = [];
  let flat = []; // flattened {type:'work'|'rest', ...}
  let idx = -1;
  let running = false;
  let tickHandle = null;
  let elapsedSec = 0;
  let restRemaining = 0;
  let totalSets = 0;

  async function loadData(){
    try {
      const { data } = await supabase.from('strength_workouts').select('id,name,exercises').order('created_at',{ascending:false});
      library = data || [];
    } catch(e){ library = []; }
    const sel = document.getElementById('workoutSelect');
    library.forEach(w=>{
      const o = document.createElement('option'); o.value = w.id; o.textContent = w.name; sel.appendChild(o);
    });
  }

  function flatten(exercises){
    const out = [];
    exercises.forEach((ex, exIdx) => {
      for (let s=1; s<=ex.sets; s++){
        out.push({ type:'work', ex, exIdx, setNum:s, totalSets:ex.sets });
        const isVeryLast = (exIdx===exercises.length-1) && (s===ex.sets);
        if (!isVeryLast) out.push({ type:'rest', duration: ex.restSeconds||60, ex, exIdx, nextSetNum:s+1 });
      }
    });
    return out;
  }

  document.getElementById('workoutSelect').addEventListener('change', (e)=>{
    const w = library.find(x=>x.id===e.target.value);
    flat = w ? flatten(w.exercises) : [];
    idx = -1;
    totalSets = w ? w.exercises.reduce((a,ex)=>a+ex.sets,0) : 0;
    renderExerciseList(w);
    renderStage();
  });

  function renderExerciseList(w){
    const el = document.getElementById('exerciseList');
    if (!w){ el.innerHTML = ''; return; }
    el.innerHTML = w.exercises.map((ex,i)=>{
      const cur = flat[idx] && flat[idx].exIdx===i;
      return '<div class="exercise-list-row'+(cur?' current':'')+'">'+ex.name+' · '+ex.sets+'x'+ex.reps+'</div>';
    }).join('');
  }

  function completedSetsCount(){
    let n = 0;
    for (let i=0;i<idx;i++) if (flat[i] && flat[i].type==='work') n++;
    if (flat[idx] && flat[idx].type==='rest') n++; // rest step means its preceding work set is done
    return n;
  }

  function renderStage(){
    document.getElementById('mProgress').textContent = completedSetsCount() + ' / ' + totalSets;
    document.getElementById('mElapsed').textContent = fmtDur(elapsedSec);

    const entry = flat[idx];
    const stageAction = document.getElementById('stageAction');
    const restEl = document.getElementById('stageRestCount');

    if (!entry){
      document.getElementById('stageName').textContent = flat.length ? 'Ready to start' : 'Choose a workout to begin';
      document.getElementById('stageTarget').textContent = '';
      document.getElementById('stageNotes').textContent = '';
      document.getElementById('nextStepInfo').innerHTML = flat.length ? ('First: <b>'+flat[0].ex.name+'</b> · '+flat[0].ex.sets+'x'+flat[0].ex.reps) : '—';
      restEl.style.display = 'none';
      stageAction.innerHTML = '';
      renderFigure('', document.getElementById('stageFigure'));
      renderPositions('', document.getElementById('positionsRow'));
      return;
    }

    if (entry.type === 'work'){
      renderFigure(entry.ex.key, document.getElementById('stageFigure'));
      renderPositions(entry.ex.key, document.getElementById('positionsRow'));
      document.getElementById('stageName').textContent = entry.ex.name;
      document.getElementById('stageTarget').textContent = 'Set ' + entry.setNum + ' of ' + entry.totalSets + ' · ' + entry.ex.reps + ' reps';
      document.getElementById('stageNotes').textContent = entry.ex.notes || '';
      restEl.style.display = 'none';
      stageAction.innerHTML = '<button class="primary" id="setCompleteBtn">Set complete ✓</button>';
      document.getElementById('setCompleteBtn').addEventListener('click', advance);
    } else {
      document.getElementById('stageName').textContent = 'Rest';
      document.getElementById('stageTarget').textContent = '';
      document.getElementById('stageNotes').textContent = 'Next: ' + entry.ex.name + ' · set ' + entry.nextSetNum + ' of ' + entry.ex.sets;
      renderFigure('', document.getElementById('stageFigure'));
      renderPositions('', document.getElementById('positionsRow'));
      restEl.style.display = 'block';
      restEl.textContent = fmtDur(restRemaining);
      stageAction.innerHTML = '<button id="skipRestBtn">Skip rest</button>';
      document.getElementById('skipRestBtn').addEventListener('click', advance);
    }

    const next = flat[idx+1];
    document.getElementById('nextStepInfo').innerHTML = next
      ? ('Next: <b>' + (next.type==='work' ? next.ex.name+' (set '+next.setNum+')' : 'Rest') + '</b>')
      : 'Last step — finish and stop when ready.';

    // refresh sidebar exercise highlight
    const w = library.find(x=>x.exercises && flat.length && x.exercises[entry.exIdx] === entry.ex);
    renderExerciseList(w);
  }

  function advance(){
    idx += 1;
    if (idx >= flat.length){ stopSession(true); return; }
    if (flat[idx].type === 'rest') restRemaining = flat[idx].duration;
    renderStage();
  }

  function tick(){
    if (!running) return;
    elapsedSec += 1;
    if (flat[idx] && flat[idx].type === 'rest'){
      restRemaining -= 1;
      if (restRemaining <= 0){ advance(); return; }
    }
    renderStage();
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    running = true;
    if (idx === -1 && flat.length) advance();
    tickHandle = setInterval(tick, 1000);
    document.getElementById('startBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('workoutSelect').disabled = true;
  });
  document.getElementById('pauseBtn').addEventListener('click', ()=>{
    running = false;
    clearInterval(tickHandle);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = 'Resume';
    document.getElementById('pauseBtn').disabled = true;
  });
  function stopSession(completed){
    running = false;
    clearInterval(tickHandle);
    const finalElapsed = elapsedSec;
    const finalSets = totalSets;
    idx = -1; elapsedSec = 0;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('workoutSelect').disabled = false;
    renderStage();
    if (completed) showCelebration('Workout Complete!', fmtDur(finalElapsed) + ' · ' + finalSets + ' sets done');
  }
  document.getElementById('stopBtn').addEventListener('click', ()=>stopSession(false));

  // ---- celebration (fireworks) ----
  let fwCanvas, fwCtx, fwParticles=[], fwRunning=false, fwRaf=null, fwLaunchTimer=null;
  const FW_COLORS = ['#45D6C4','#4C8BF5','#3DBE7A','#E8B93D','#F08A3C','#E5484D','#B14AED','#FFFFFF'];
  function resizeFw(){ if (fwCanvas){ fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; } }
  function launchBurst(){
    const x = Math.random()*fwCanvas.width*0.8 + fwCanvas.width*0.1;
    const y = Math.random()*fwCanvas.height*0.4 + fwCanvas.height*0.15;
    const color = FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
    const count = 44;
    for (let i=0;i<count;i++){
      const angle = (Math.PI*2*i)/count + Math.random()*0.2;
      const speed = 2 + Math.random()*3;
      fwParticles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:1, decay:0.012+Math.random()*0.01, color });
    }
  }
  function fwLoop(){
    if (!fwRunning) return;
    fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
    fwParticles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life-=p.decay; });
    fwParticles = fwParticles.filter(p=>p.life>0);
    fwParticles.forEach(p=>{
      fwCtx.globalAlpha = Math.max(0,p.life);
      fwCtx.fillStyle = p.color;
      fwCtx.beginPath(); fwCtx.arc(p.x,p.y,2.5,0,Math.PI*2); fwCtx.fill();
    });
    fwCtx.globalAlpha = 1;
    fwRaf = requestAnimationFrame(fwLoop);
  }
  function startFireworks(){
    fwCanvas = document.getElementById('celebrateCanvas');
    fwCtx = fwCanvas.getContext('2d');
    resizeFw();
    window.addEventListener('resize', resizeFw);
    fwParticles = [];
    fwRunning = true;
    launchBurst();
    fwLaunchTimer = setInterval(launchBurst, 500);
    fwRaf = requestAnimationFrame(fwLoop);
    setTimeout(()=>{ clearInterval(fwLaunchTimer); }, 6000);
  }
  function stopFireworks(){
    fwRunning = false;
    clearInterval(fwLaunchTimer);
    if (fwRaf) cancelAnimationFrame(fwRaf);
    window.removeEventListener('resize', resizeFw);
  }
  function showCelebration(title, subtitle){
    document.getElementById('celebrateTitle').textContent = title;
    document.getElementById('celebrateSubtitle').textContent = subtitle || '';
    document.getElementById('celebrateOverlay').style.display = 'flex';
    startFireworks();
  }
  function hideCelebration(){
    document.getElementById('celebrateOverlay').style.display = 'none';
    stopFireworks();
  }
  document.getElementById('celebrateCloseBtn').addEventListener('click', hideCelebration);

  // ---- sidebar collapse ----
  const appRoot = document.querySelector('.app');
  const sidebarToggle = document.getElementById('sidebarToggle');
  function applyCollapsed(collapsed){
    appRoot.classList.toggle('sidebar-collapsed', collapsed);
    sidebarToggle.textContent = collapsed ? '☰' : '✕';
    try { localStorage.setItem('tc_sidebar_collapsed', collapsed ? '1' : '0'); } catch(e){}
  }
  sidebarToggle.addEventListener('click', ()=> applyCollapsed(!appRoot.classList.contains('sidebar-collapsed')));
  let initCollapsed = false;
  try { initCollapsed = localStorage.getItem('tc_sidebar_collapsed') === '1'; } catch(e){}
  applyCollapsed(initCollapsed);

  // ---- fullscreen toggle ----
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  fullscreenToggle.addEventListener('click', ()=>{
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', ()=>{
    fullscreenToggle.textContent = document.fullscreenElement ? '⤢' : '⛶';
  });

  loadData();
  renderStage();
})();
</script>
</body>
</html>
