<style>
  :root{
    --bg: #10141A; --panel: #171D25; --panel-2: #1D242D; --line: #2A323D;
    --text: #E7ECF2; --text-dim: #8C97A6; --accent: #45D6C4;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --z-recovery: #5A6472; --z-endurance: #4C8BF5; --z-tempo: #3DBE7A;
    --z-threshold: #E8B93D; --z-vo2: #F08A3C; --z-anaerobic: #E5484D; --z-neuro: #B14AED;
  }
  *{box-sizing:border-box;}

  .page-banner{
    height:260px; border-radius:10px; margin-bottom:20px; background-size:cover; background-position:center 40%;
    position:relative; overflow:hidden;
  }
  @media (max-width:600px){ .page-banner{ height:180px; } }
  .page-banner::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,13,17,0) 0%, rgba(10,13,17,0) 65%, var(--bg) 100%);
  }
  :root{ --topbar-h: calc(80px + env(safe-area-inset-top, 0px)); }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; }
  .app{ position:relative; min-height:100vh; }
  .sidebar{
    position:fixed; top:var(--topbar-h); left:0; bottom:0; width:340px; max-width:85vw;
    background:var(--panel); border-right:1px solid var(--line);
    padding:20px; overflow-y:auto; z-index:60;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar{ transform:translateX(0); }
  .sidebar-backdrop{
    position:fixed; top:var(--topbar-h); left:0; right:0; bottom:0; background:rgba(0,0,0,.5);
    z-index:55; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar-backdrop{ opacity:1; pointer-events:auto; }
  .main{ padding:calc(96px + env(safe-area-inset-top, 0px)) 28px 24px; max-width:min(1700px, 97vw); margin:0 auto; }
  .top-bar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:50;
    display:flex; align-items:center; padding:0 14px; padding-top:env(safe-area-inset-top, 0px);
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .icon-btn{
    width:38px; height:38px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  html.standalone #fullscreenToggle{ display:none; }
  .top-bar-logo-link{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; }
  .top-logo{ height:60px; width:auto; border-radius:8px; display:block; }
  .top-bar-spacer{ flex:1; }

  .sub{ color:var(--text-dim); font-size:12.5px; margin:2px 0 20px; }
  .block{ margin-bottom:24px; }
  .block-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .page-nav{ display:flex; flex-direction:column; gap:2px; }
  .page-nav a{ padding:10px 10px; border-radius:6px; color:var(--text-dim); text-decoration:none; font-size:16px; }
  .page-nav a:hover{ background:var(--panel-2); color:var(--text); }
  .page-nav a.active{ background:var(--panel-2); color:var(--accent); font-weight:600; }

  button{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:#08211E; border-color:var(--accent); font-weight:600; }
  button.primary:hover{ filter:brightness(1.08); }
  a{ color:var(--accent); text-decoration:none; }

  /* Series colours for the fitness chart, checked for colour-blind separation on the panel colour. */
  :root{ --s-fitness:#239E90; --s-fatigue:#CC6A22; --s-form:#8A7BEB; }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .page-head h1{ font-size:24px; margin:0; }
  .page-head .plan-line{ color:var(--text-dim); font-size:13px; margin-top:4px; }
  .page-head .plan-line b{ color:var(--text); }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
  .panel-link{ text-transform:none; letter-spacing:0; font-size:13px; color:var(--accent); text-decoration:none; }
  .panel-link:hover{ text-decoration:underline; }
  .panel-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; display:flex; justify-content:space-between; gap:10px; align-items:center; }

  /* ---- fitness ---- */
  .fit-tiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  .fit-tile{ background:var(--panel-2); border-radius:10px; padding:10px 12px; }
  .fit-tile .lbl{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px; }
  .fit-tile .lbl i{ width:10px; height:3px; border-radius:2px; display:inline-block; }
  .fit-tile .val{ font-family:var(--mono); font-size:26px; font-weight:600; margin-top:2px; }
  .fit-tile .note{ font-size:12px; color:var(--text-dim); }
  @media (max-width:600px){
    .fit-tiles{ grid-template-columns:repeat(2, minmax(0,1fr)); } .fit-tile .val{ font-size:22px; }
  }

  /* ---- calendar ---- */
  .cal-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .cal-bar .cal-title{ font-size:17px; font-weight:600; margin-right:auto; }
  .cal-bar button{ min-height:36px; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button{ border:none; border-radius:0; background:var(--panel-2); }
  .seg button.on{ background:var(--accent); color:#08211E; font-weight:600; }
  .cal-hint{ font-size:12px; color:var(--text-dim); margin:-4px 0 10px; }

  .month{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)) 92px; gap:4px; }
  .month .dow{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; }
  .day{ background:var(--panel-2); border:1px solid transparent; border-radius:8px; min-height:104px; padding:6px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .day.other{ opacity:.45; }
  .day.today{ border-color:var(--accent); }
  .day.drop-ok{ border-color:var(--accent); border-style:dashed; background:color-mix(in srgb, var(--accent) 10%, var(--panel-2)); }
  .day .dnum{ font-size:12px; color:var(--text-dim); font-family:var(--mono); }
  .day.today .dnum{ color:var(--accent); font-weight:700; }
  .wk-total{ border-radius:8px; padding:6px 8px; font-size:12px; color:var(--text-dim); display:flex; flex-direction:column; justify-content:center; gap:2px; font-family:var(--mono); }
  .wk-total b{ color:var(--text); font-size:15px; }

  .chip{ display:block; width:100%; text-align:left; border-radius:6px; padding:5px 7px; font-size:12px; line-height:1.3; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; min-width:0; }
  .chip .nm{ display:flex; align-items:center; gap:5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip .nm span{ overflow:hidden; text-overflow:ellipsis; }
  .chip .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .chip .mt{ color:var(--text-dim); font-family:var(--mono); font-size:11px; }
  .chip.planned[draggable=true]{ cursor:grab; }
  .chip.done{ border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); background:color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  .chip.done .tick{ color:var(--accent); }
  .run-desc{ font-size:13.5px; color:var(--text-dim); line-height:1.5; margin:10px 0 0; }
  .chip.missed{ opacity:.6; }
  .chip.missed .nm span{ text-decoration:line-through; }
  .chip.dragging{ opacity:.35; }
  .chip .mv{ color:var(--text-dim); font-weight:400; margin-left:auto; flex-shrink:0; font-size:11px; }
  .move-days{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; margin-bottom:10px; }
  .move-days button{ margin:0; padding:6px 0; min-height:44px; display:flex; flex-direction:column; align-items:center; gap:1px; font-size:12px; line-height:1.2; }
  .move-days button b{ font-family:var(--mono); font-size:14px; }
  .move-days button.on{ border-color:var(--accent); color:var(--accent); }
  .move-days button i{ width:5px; height:5px; border-radius:50%; background:var(--text-dim); }
  .move-days button:disabled{ opacity:.35; cursor:default; }
  .move-lbl{ font-size:12.5px; color:var(--text-dim); margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
  .move-lbl button{ margin:0; min-height:0; padding:2px 8px; font-size:12px; }

  .week-list{ display:flex; flex-direction:column; gap:6px; }
  .week-list .day{ min-height:0; flex-direction:row; align-items:flex-start; gap:10px; padding:10px; }
  .week-list .day .dnum{ width:58px; flex-shrink:0; font-size:12.5px; padding-top:4px; }
  .week-list .day .items{ flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .day.holiday{ background:linear-gradient(0deg, rgba(56,189,248,.07), rgba(56,189,248,.07)), var(--panel-2); }
  .hol-pill{ display:block; width:100%; text-align:left; margin:0; padding:2px 7px; border-radius:5px; border:0; background:rgba(56,189,248,.18); color:#7DD3FC;
    font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .hol-pill.cont{ background:rgba(56,189,248,.10); }
  .hol-pill:hover{ border-color:transparent; background:rgba(56,189,248,.26); }
  .note-pill{ display:block; width:100%; text-align:left; margin:0; padding:3px 7px; border-radius:5px; border:0; border-left:3px solid #E8B93D; background:rgba(232,185,61,.12); color:#F2D58A;
    font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .note-pill:hover{ border-color:#E8B93D; background:rgba(232,185,61,.2); }
  .chip.single{ border-style:dashed; }
  .day{ cursor:pointer; position:relative; }
  .day .dnum{ display:flex; align-items:center; justify-content:space-between; }
  .day-add{ width:22px; height:22px; min-height:0 !important; padding:0; border-radius:6px; font-size:15px; line-height:1; color:var(--text-dim); background:transparent; border:1px solid transparent; opacity:0; }
  .day:hover .day-add, .day-add:focus-visible{ opacity:1; border-color:var(--line); }
  .week-list .day-add{ opacity:1; width:30px; height:30px; border-color:var(--line); flex-shrink:0; align-self:flex-start; }
  @media (max-width:760px){ .month .day-add{ display:none; } }
  .week-list .day .rest{ font-size:12.5px; color:var(--text-dim); font-style:italic; padding-top:4px; }
  .week-list .chip{ padding:8px 10px; font-size:13px; }
  .week-sum{ display:flex; gap:18px; font-size:12.5px; color:var(--text-dim); margin-bottom:10px; font-family:var(--mono); }
  .week-sum b{ color:var(--text); }

  @media (max-width:760px){
    .month{ grid-template-columns:repeat(7, minmax(0,1fr)); gap:3px; }
    .month .wk-total, .month .dow.wk{ display:none; }
    .day{ min-height:64px; padding:4px; }
    .month .chip{ padding:3px 4px; }
    .month .chip .mt, .month .chip .nm span:not(.tick){ display:none; }
    .cal-bar .cal-title{ flex-basis:100%; }
  }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:150; display:none; align-items:center; justify-content:center; padding:16px; }
  .sheet{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; width:min(420px, 100%); }
  .sheet h3{ margin:0 0 4px; font-size:17px; }
  .sheet .sub2{ color:var(--text-dim); font-size:12.5px; margin-bottom:14px; }
  .sheet .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .sheet input[type=date]{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px 9px; font-size:14px; color-scheme:dark; }
  .sheet button{ min-height:38px; padding:8px 14px; }
  .sheet .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .empty-note{ color:var(--text-dim); font-size:13px; }
</style>
</head>

<script type="module">
import { createSupabaseClient, requireAuth, renderSidebarUserBadge, requireSubscription } from './auth.js?v=19';
import { notify, ask, showSheet } from './sheet.js?v=3';
import { isoDate, parseIso, addDays, daysBetween, todayIso, planSessions, loadFollowState, loadDoneDays, saveMoves, plannedTss, moveEntry, isSkipped, skipEntry, saveSkips } from './plan-schedule.js?v=6';
import { loadSeries, formLabel } from './training-load.js?v=2';
import { applySwaps, undoSwap } from './adapt.js?v=5';
import { runSession, plannedRunTss, openRunLog, fmtKm, setRunPace, RUN_PACE_KEY } from './run.js?v=7';
import { loadHolidays, applyHolidays, holidayOn, openHolidaySheet, holidayLabel } from './holidays.js?v=3';
import { composeFollowed, loadPlanRow } from './run-plans.js?v=4';
import { openExportSheet } from './export.js?v=3';
import { sessionInfo, SPORT_COLOR } from './plan-kit.js?v=4';
import { openSwimLog, setSwimCss, SWIM_CSS_KEY, fmtMetres } from './swim.js?v=2';
import { feedEvents, syncCalendarFeed } from './calfeed.js?v=5';
import { loadDiary, diarySessions, diaryHref, notesOn, openDayAdd, openNoteSheet, openPlanSheet, openActivityLog, saveDiary } from './diary.js?v=2';
const supabase = createSupabaseClient();

(async function(){
  const user = await requireAuth(supabase);
  renderSidebarUserBadge(supabase, user, document.querySelector('.sidebar'));
  await requireSubscription(supabase, user);

  const ZONE_COLOURS = { recovery:'var(--z-recovery)', endurance:'var(--z-endurance)', tempo:'var(--z-tempo)', sweet_spot:'var(--z-threshold)',
    threshold:'var(--z-threshold)', over_under:'var(--z-vo2)', vo2max:'var(--z-vo2)', anaerobic:'var(--z-anaerobic)', test:'var(--z-neuro)', strength:'var(--text-dim)', run:'#C084FC', swim:SPORT_COLOR.swim, race:SPORT_COLOR.race };
  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fmtMins(sec){ const m = Math.round((sec||0)/60); return m >= 60 ? Math.floor(m/60)+'h'+(m%60 ? String(m%60).padStart(2,'0') : '') : m+'m'; }
  function longDate(iso){ const d = parseIso(iso); return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }); }
  function mondayOf(iso){ const d = parseIso(iso); return addDays(iso, -((d.getDay()+6)%7)); }

  // ---- data ----
  let ftp = 250, runPace = null;
  let follow = { planId:null, startedAt:null, cursorDay:0, moves:{}, skips:{} };
  let plan = null, planRaw = null;
  let doneDays = new Map();
  let holidays = [];
  let diary = [];        // notes and single planned workouts (diary.js)
  const workouts = {};   // id -> { name, category, steps, duration_sec }
  let rides = [];        // completed rides, newest window
  const ridesByDate = new Map(); // 'YYYY-MM-DD' -> [ride]

  async function loadAll(){
    const sinceIso = new Date(Date.now() - 400*86400000).toISOString();
    const [ftpRes, st, wRes, sRes, rRes, hol, dy] = await Promise.all([
      supabase.from('settings').select('value').eq('key','ftp').eq('user_id', user.id).maybeSingle(),
      loadFollowState(supabase, user.id),
      supabase.from('workouts').select('id,name,category,steps,duration_sec'),
      supabase.from('strength_workouts').select('id,name,exercises'),
      supabase.from('completed_rides').select('id,workout_name,category,started_at,duration_sec,tss,plan_id,plan_day_index,sport,distance_m')
        .eq('user_id', user.id).gte('started_at', sinceIso).order('started_at', { ascending:true }),
      loadHolidays(supabase, user.id),
      loadDiary(supabase, user.id),
      supabase.from('settings').select('value').eq('key', RUN_PACE_KEY).eq('user_id', user.id).maybeSingle().then(r => { runPace = Number(r.data && r.data.value && r.data.value.v) || null; setRunPace(runPace); }, ()=>{}),
      supabase.from('settings').select('value').eq('key', SWIM_CSS_KEY).eq('user_id', user.id).maybeSingle().then(r => { setSwimCss(r.data && r.data.value && r.data.value.v); }, ()=>{})
    ]);
    holidays = hol;
    diary = dy;
    if (ftpRes.data && ftpRes.data.value && typeof ftpRes.data.value.v === 'number') ftp = ftpRes.data.value.v;
    follow = st;
    (wRes.data||[]).forEach(w=>{ workouts[w.id] = w; });
    (sRes.data||[]).forEach(w=>{ workouts[w.id] = { name:w.name, category:'strength', exercises:w.exercises }; });
    rides = rRes.data || [];
    indexRides();
    if (follow.planId && follow.startedAt){
      planRaw = await loadPlanRow(supabase, follow);
      rebuildPlan();
      if (plan) doneDays = await loadDoneDays(supabase, user.id, plan.id, follow.startedAt);
    }
  }
  function indexRides(){
    ridesByDate.clear();
    rides.forEach(r=>{
      const d = isoDate(new Date(r.started_at));
      if (!ridesByDate.has(d)) ridesByDate.set(d, []);
      ridesByDate.get(d).push(r);
    });
  }
  function rebuildPlan(){
    const base = follow.startedAt ? composeFollowed(planRaw, follow, follow.runPlan).plan : null;
    plan = base ? applyHolidays(applySwaps(base, follow.swaps), follow.startedAt, follow.moves, holidays) : null;
    syncFeed();
  }
  function syncFeed(){
    syncCalendarFeed(supabase, user.id, feedEvents(plan, follow, workouts, ftp, diarySessions(diary, workouts, ftp, rides).filter(s => !s.done)));
  }

  // Planned sessions by effective date, with whether each is done/missed and its planned TSS.
  function sessionsByDate(){
    const map = new Map();
    const today = todayIso();
    const add = item => { if (!map.has(item.date)) map.set(item.date, []); map.get(item.date).push(item); };
    diarySessions(diary, workouts, ftp, rides).forEach(item => { item.missed = !item.done && item.date < today; add(item); });
    if (!plan) return map;
    planSessions(plan, follow.startedAt, follow.moves).forEach(s=>{
      const wkRaw = workouts[s.dayObj.workoutId] || {};
      const isStrength = s.dayObj.workoutType === 'strength', isRun = s.dayObj.workoutType === 'run';
      const isSwim = s.dayObj.workoutType === 'swim', isBrick = s.dayObj.workoutType === 'brick', isRace = s.dayObj.workoutType === 'race';
      const run = isRun ? runSession(s.dayObj.workoutId) : null;
      const info = sessionInfo(s.dayObj, workouts, ftp);
      const wk = run ? { name: run.name, duration_sec: run.mins*60 } : (isSwim || isBrick || isRace || isStrength) ? { name: info.name, duration_sec: info.durationSec, category: info.category } : wkRaw;
      const item = Object.assign({}, s, {
        name: wk.name || s.dayObj.workoutId, category: isStrength ? 'strength' : isRun ? 'run' : isSwim ? 'swim' : isRace ? 'race' : wk.category,
        isStrength, isRun, isSwim, isBrick, isRace, run, info, durationSec: wk.duration_sec || null,
        tss: isRun ? plannedRunTss(s.dayObj.workoutId) : (isSwim || isBrick || isRace || isStrength) ? info.tss : plannedTss(wk.steps, ftp),
        done: doneDays.has(s.dayIndex), skipped: isSkipped(follow, s),
      });
      item.missed = !item.done && (item.date < today || item.skipped);
      add(item);
    });
    return map;
  }

  // ---- fitness (CTL / ATL / TSB) ----
  function computeFitness(){
    const today = todayIso();
    const daily = new Map();
    rides.forEach(r=>{ if (r.tss!=null){ const d = isoDate(new Date(r.started_at)); daily.set(d, (daily.get(d)||0) + r.tss); } });
    const firstRide = rides.length ? isoDate(new Date(rides[0].started_at)) : today;
    const out = loadSeries(daily, firstRide < today ? firstRide : today, today, today);

    const now = out.find(p=>p.date === today) || out[out.length-1];
    document.getElementById('tFitness').textContent = Math.round(now.ctl);
    document.getElementById('tFatigue').textContent = Math.round(now.atl);
    const form = Math.round(now.ctl - now.atl);
    document.getElementById('tForm').textContent = (form > 0 ? '+' : '') + form;
    document.getElementById('tFormNote').textContent = formLabel(form);

    const wkStart = mondayOf(today);
    let wkDone = 0, wkPlanned = 0;
    for (let i=0;i<7;i++){
      const d = addDays(wkStart, i);
      (ridesByDate.get(d)||[]).forEach(r=>{ wkDone += r.tss||0; });
    }
    const byDate = sessionsByDate();
    for (let i=0;i<7;i++) (byDate.get(addDays(wkStart, i))||[]).forEach(it=>{ wkPlanned += it.tss||0; });
    document.getElementById('tWeek').textContent = wkDone;
    document.getElementById('tWeekNote').textContent = wkPlanned ? ('of ' + wkPlanned + ' planned TSS') : 'TSS ridden';
  }


  // ---- calendar ----
  let view = window.matchMedia('(max-width:760px)').matches ? 'week' : 'month';
  let anchor = todayIso();

  function chipHtml(item){
    if (item.kind === 'ride'){
      const r = item.ride;
      return '<button class="chip done" data-ride="'+r.id+'">'
        + '<div class="nm"><span class="tick">✓</span><span>'+escapeHtml(r.workout_name)+'</span></div>'
        + '<div class="mt">'+fmtMins(r.duration_sec)+(r.sport === 'run' && r.distance_m ? ' · '+fmtKm(r.distance_m)+' km' : r.sport === 'swim' && r.distance_m ? ' · '+fmtMetres(r.distance_m) : '')+(r.tss!=null ? ' · '+r.tss+' TSS' : '')+'</div></button>';
    }
    if (item.kind === 'note') return '<button class="note-pill" data-note="'+item.note.id+'" title="'+escapeHtml(item.note.text)+'">'+escapeHtml(item.note.text)+'</button>';
    const s = item.session;
    const cls = s.missed ? 'missed' : '';
    const draggable = !s.done;
    return '<button class="chip planned '+cls+(s.diaryId ? ' single' : '')+'" '+(s.diaryId ? 'data-diary="'+s.diaryId+'"' : 'data-day="'+s.dayIndex+'"')+(draggable ? ' draggable="true"' : '')+'>'
      + '<div class="nm"><i class="dot" style="background:'+(ZONE_COLOURS[s.category]||'var(--text-dim)')+'"></i><span>'+escapeHtml(s.name)+'</span>'+(s.moved ? '<span class="mv" title="Moved from '+longDate(s.plannedDate)+'">↔</span>' : '')+'</div>'
      + '<div class="mt">'+(s.missed ? (s.skipped ? 'Skipped' : 'Missed') : (s.isStrength && !s.durationSec ? 'Strength' : ((s.durationSec ? fmtMins(s.durationSec) : '')+(s.tss ? ' · '+s.tss+' TSS' : ''))))+'</div></button>';
  }
  // A day's items: notes, rides, then planned sessions that no ride has ticked off yet.
  function itemsFor(date, byDate){
    const out = notesOn(date, diary).map(n=>({ kind:'note', note:n }));
    (ridesByDate.get(date)||[]).forEach(r=> out.push({ kind:'ride', ride:r }));
    (byDate.get(date)||[]).forEach(s=>{ if (!s.done) out.push({ kind:'session', session:s }); });
    return out;
  }
  function weekTotals(mon, byDate){
    let done = 0, planned = 0, mins = 0, plannedMins = 0;
    for (let i=0;i<7;i++){
      const d = addDays(mon, i);
      (ridesByDate.get(d)||[]).forEach(r=>{ done += r.tss||0; mins += Math.round((r.duration_sec||0)/60); });
      (byDate.get(d)||[]).forEach(s=>{ planned += s.tss||0; plannedMins += Math.round((s.durationSec||0)/60); });
    }
    return { done, planned, mins, plannedMins };
  }

  // Holiday marker: the name on the first day (and each Monday it runs into), a tinted band otherwise.
  function holPill(d, h, weekStart){
    if (!h) return '';
    const first = d === h.start || weekStart;
    return '<button class="hol-pill'+(first ? '' : ' cont')+'" data-hol="'+h.id+'" title="'+escapeHtml(holidayLabel(h))+'">'+(first ? escapeHtml(h.name || 'Holiday') : '&nbsp;')+'</button>';
  }
  function render(){
    const byDate = sessionsByDate();
    const today = todayIso();
    document.getElementById('viewWeek').classList.toggle('on', view === 'week');
    document.getElementById('viewMonth').classList.toggle('on', view === 'month');
    const fine = window.matchMedia('(pointer:fine)').matches;
    document.getElementById('calHint').textContent = (fine ? 'Click' : 'Tap')+' a day to add a note, log an activity or plan a workout.'
      + (plan || diary.some(it => it.kind === 'planned') ? (fine ? ' Drag a planned session to move it.' : ' Tap a planned session to ride it or move it.') : '');
    const body = document.getElementById('calBody');
    if (view === 'month'){
      const a = parseIso(anchor);
      const first = isoDate(new Date(a.getFullYear(), a.getMonth(), 1));
      const lastDay = isoDate(new Date(a.getFullYear(), a.getMonth()+1, 0));
      document.getElementById('calTitle').textContent = a.toLocaleString('en-GB', { month:'long', year:'numeric' });
      let html = '<div class="month">' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="dow">'+d+'</div>').join('') + '<div class="dow wk">Week</div>';
      for (let mon = mondayOf(first); mon <= lastDay; mon = addDays(mon, 7)){
        for (let i=0;i<7;i++){
          const d = addDays(mon, i);
          const inMonth = d >= first && d <= lastDay;
          const hol = holidayOn(d, holidays);
          html += '<div class="day'+(inMonth ? '' : ' other')+(d === today ? ' today' : '')+(hol ? ' holiday' : '')+'" data-date="'+d+'">'
            + '<div class="dnum">'+parseIso(d).getDate()+'<button class="day-add" data-add="'+d+'" aria-label="Add to '+longDate(d)+'">+</button></div>' + holPill(d, hol, i === 0)
            + itemsFor(d, byDate).map(chipHtml).join('') + '</div>';
        }
        const t = weekTotals(mon, byDate);
        html += '<div class="wk-total"><b>'+t.done+'</b>'+(t.planned ? 'of '+t.planned+' TSS' : 'TSS')+'<span>'+fmtMins(t.mins*60)+(t.plannedMins ? ' of '+fmtMins(t.plannedMins*60) : '')+'</span></div>';
      }
      body.innerHTML = html + '</div>';
    } else {
      const mon = mondayOf(anchor);
      const sun = addDays(mon, 6);
      document.getElementById('calTitle').textContent = longDate(mon) + ' – ' + longDate(sun);
      const t = weekTotals(mon, byDate);
      let html = '<div class="week-sum"><span>Done <b>'+t.done+'</b> TSS</span>'+(t.planned ? '<span>Planned <b>'+t.planned+'</b> TSS</span>' : '')+'<span>Time <b>'+fmtMins(t.mins*60)+'</b>'+(t.plannedMins ? ' of '+fmtMins(t.plannedMins*60) : '')+'</span></div><div class="week-list">';
      for (let i=0;i<7;i++){
        const d = addDays(mon, i);
        const items = itemsFor(d, byDate);
        const hol = holidayOn(d, holidays);
        html += '<div class="day'+(d === today ? ' today' : '')+(hol ? ' holiday' : '')+'" data-date="'+d+'">'
          + '<div class="dnum">'+WEEKDAYS[parseIso(d).getDay()]+' '+parseIso(d).getDate()+'</div>'
          + '<div class="items">'+holPill(d, hol, true)+(items.length ? items.map(chipHtml).join('') : (hol ? '' : '<div class="rest">Rest</div>'))+'</div>'
          + '<button class="day-add" data-add="'+d+'" aria-label="Add to '+longDate(d)+'">+</button></div>';
      }
      body.innerHTML = html + '</div>';
    }
  }

  function shift(dir){
    if (view === 'month'){ const a = parseIso(anchor); anchor = isoDate(new Date(a.getFullYear(), a.getMonth()+dir, 1)); }
    else anchor = addDays(anchor, 7*dir);
    render();
  }
  document.getElementById('calPrev').addEventListener('click', ()=> shift(-1));
  document.getElementById('calNext').addEventListener('click', ()=> shift(1));
  document.getElementById('calToday').addEventListener('click', ()=>{ anchor = todayIso(); render(); });
  document.getElementById('viewWeek').addEventListener('click', ()=>{ view = 'week'; render(); });
  document.getElementById('viewMonth').addEventListener('click', ()=>{ view = 'month'; render(); });

  // ---- moving sessions ----
  function findSession(dayIndex){
    return plan ? planSessions(plan, follow.startedAt, follow.moves).find(s=>s.dayIndex === dayIndex) : null;
  }
  // changes: [[dayIndex, date]]. Moving a session back to its planned day clears its move.
  async function moveSessions(changes){
    const before = follow.moves, skipsBefore = follow.skips;
    const moves = Object.assign({}, follow.moves), skips = Object.assign({}, follow.skips);
    for (const [dayIndex, date] of changes){
      const s = findSession(dayIndex);
      if (!s) continue;
      if (date === s.plannedDate) delete moves[dayIndex]; else moves[dayIndex] = moveEntry(s, date);
      delete skips[dayIndex]; // moving a skipped session means doing it after all
    }
    const unskipped = Object.keys(skips).length !== Object.keys(follow.skips || {}).length;
    follow.moves = moves; follow.skips = skips;
    rebuildPlan(); render(); computeFitness();
    try { await saveMoves(supabase, user.id, moves); if (unskipped) await saveSkips(supabase, user.id, skips); }
    catch(e){ follow.moves = before; follow.skips = skipsBefore; rebuildPlan(); render(); computeFitness(); notify('Check your connection and try again.', 'Couldn\'t save that move'); }
  }
  // Skip a session (it stays on the calendar, marked skipped) or put a skipped one back.
  async function setSkipped(s, on){
    const before = follow.skips;
    const skips = Object.assign({}, follow.skips);
    if (on) skips[s.dayIndex] = skipEntry(s); else delete skips[s.dayIndex];
    follow.skips = skips;
    refresh();
    try { await saveSkips(supabase, user.id, skips); }
    catch(e){ follow.skips = before; refresh(); notify('Check your connection and try again.', 'Couldn\'t change your plan'); }
  }
  // Onto a day that already has a plan session still to do: offer to swap the two days.
  async function moveSession(dayIndex, date){
    const s = findSession(dayIndex);
    if (!s || date === s.date) return;
    const there = (sessionsByDate().get(date) || []).filter(x => !x.diaryId && !x.done && x.dayIndex !== dayIndex);
    if (there.length === 1 && s.date >= todayIso()){
      const o = there[0];
      const r = await showSheet({ title: longDate(date)+' already has '+o.name,
        text: 'Swap them, so '+o.name+' moves to '+longDate(s.date)+'? Or keep both on '+longDate(date)+'.',
        buttons:[{ label:'Swap days', value:'swap', kind:'primary' }, { label:'Keep both', value:'both' }], dismissValue:null });
      if (!r) return;
      if (r === 'swap') return moveSessions([[dayIndex, date], [o.dayIndex, s.date]]);
    }
    return moveSessions([[dayIndex, date]]);
  }

  // Single workouts planned on the calendar move by changing their date.
  async function moveDiary(id, date){
    const before = diary;
    diary = diary.map(it => it.id === id ? Object.assign({}, it, { date }) : it);
    refresh();
    try { diary = await saveDiary(supabase, user.id, diary); }
    catch(e){ diary = before; refresh(); notify('Check your connection and try again.', 'Couldn\'t save that move'); }
  }
  function refresh(){ rebuildPlan(); render(); computeFitness(); }
  function addRide(saved){ rides.push(saved); rides.sort((a,b)=> a.started_at < b.started_at ? -1 : 1); indexRides(); syncFeed(); render(); computeFitness(); }
  async function addOn(date){
    const res = await openDayAdd(supabase, user.id, { date, list: diary, workouts, ftp });
    if (res && res.list){ diary = res.list; refresh(); }
    if (res && res.saved) addRide(res.saved);
  }
  async function openDiaryItem(id, date){
    const item = diary.find(it => it.id === id);
    const s = (sessionsByDate().get(date) || []).find(x => x.diaryId === id);
    if (!item || !s) return;
    const res = await openPlanSheet(supabase, user.id, { date: item.date, list: diary, workouts, ftp, existing: item });
    if (!res) return;
    if (res.list !== diary){ diary = res.list; refresh(); }
    if (!res.go) return;
    if (s.isRun || s.isSwim){
      const open = s.isRun ? openRunLog : openSwimLog;
      const saved = await open(supabase, user.id, { session:{ dayIndex:null, date:s.date, workoutId:s.dayObj.workoutId }, planId:null });
      if (saved) addRide(saved);
    } else window.location.href = diaryHref(s);
  }
  document.getElementById('addBtn').addEventListener('click', ()=> addOn(anchor > todayIso() && view === 'week' ? anchor : todayIso()));

  const calBody = document.getElementById('calBody');
  let dragDay = null, dragDiary = null;
  calBody.addEventListener('dragstart', e=>{
    const chip = e.target.closest('.chip.planned[draggable=true]');
    if (!chip) return;
    if (chip.dataset.diary) dragDiary = chip.dataset.diary; else dragDay = Number(chip.dataset.day);
    chip.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', chip.dataset.diary || String(dragDay));
  });
  calBody.addEventListener('dragend', e=>{
    dragDay = null; dragDiary = null;
    calBody.querySelectorAll('.dragging, .drop-ok').forEach(el=> el.classList.remove('dragging','drop-ok'));
  });
  calBody.addEventListener('dragover', e=>{
    if (dragDay == null && dragDiary == null) return;
    const cell = e.target.closest('.day[data-date]');
    if (!cell || cell.dataset.date < todayIso()) return;
    e.preventDefault();
    calBody.querySelectorAll('.drop-ok').forEach(el=>{ if (el !== cell) el.classList.remove('drop-ok'); });
    cell.classList.add('drop-ok');
  });
  calBody.addEventListener('drop', e=>{
    const cell = e.target.closest('.day[data-date]');
    if ((dragDay == null && dragDiary == null) || !cell || cell.dataset.date < todayIso()) return;
    e.preventDefault();
    if (dragDiary) moveDiary(dragDiary, cell.dataset.date);
    else moveSession(dragDay, cell.dataset.date);
  });

  // ---- session / ride sheet ----
  const sheet = document.getElementById('sheetBackdrop');
  function closeSheet(){ sheet.style.display = 'none'; }
  sheet.addEventListener('click', e=>{ if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', e=>{ if (e.key === 'Escape') closeSheet(); });
  async function editHolidays(opts){
    const list = await openHolidaySheet(supabase, user.id, holidays, opts);
    if (!list) return;
    holidays = list; rebuildPlan(); render(); computeFitness();
  }
  document.getElementById('holAddBtn').addEventListener('click', ()=> editHolidays({ date: anchor > todayIso() ? anchor : todayIso() }));
  calBody.addEventListener('click', e=>{
    const pill = e.target.closest('.hol-pill');
    if (pill){ editHolidays({ existing: holidays.find(h => h.id === pill.dataset.hol) }); return; }
    const rideChip = e.target.closest('.chip.done');
    if (rideChip){ window.location.href = 'rides.html?ride='+encodeURIComponent(rideChip.dataset.ride); return; }
    const addB = e.target.closest('[data-add]');
    if (addB){ addOn(addB.dataset.add); return; }
    const noteB = e.target.closest('.note-pill');
    if (noteB){
      const n = diary.find(it => it.id === noteB.dataset.note);
      if (n) openNoteSheet(supabase, user.id, { date:n.date, list:diary, existing:n }).then(res => { if (res && res.list){ diary = res.list; render(); } });
      return;
    }
    const single = e.target.closest('.chip.planned[data-diary]');
    if (single){ openDiaryItem(single.dataset.diary, single.closest('.day').dataset.date); return; }
    const chip = e.target.closest('.chip.planned');
    if (!chip){
      const cell = e.target.closest('.day[data-date]');
      if (cell && !e.target.closest('button, a')) addOn(cell.dataset.date);
      return;
    }
    const s = sessionsByDate().get(chip.closest('.day').dataset.date).find(x=>x.dayIndex === Number(chip.dataset.day));
    if (!s) return;
    document.getElementById('sheetTitle').textContent = s.name;
    document.getElementById('sheetSub').textContent = 'Week '+s.weekNum+(s.deload ? ' · Deload' : '')+' · '+longDate(s.date)
      + (s.moved ? ' (planned for '+longDate(s.plannedDate)+')' : '')
      + (s.dayObj.holiday ? ' · Easy version for '+s.dayObj.holiday : s.dayObj.swappedFrom ? ' · Adapted from '+((workouts[s.dayObj.swappedFrom]||{}).name || s.dayObj.swappedFrom) : '')
      + (s.isStrength ? ' · Strength' : ((s.isRun ? ' · Run' : s.isSwim ? ' · Swim' : s.isBrick ? ' · Brick' : s.isRace ? ' · Race' : '')+(s.durationSec ? ' · '+fmtMins(s.durationSec) : '')+(s.tss ? ' · '+s.tss+' TSS' : '')));
    const rideHref = s.isStrength ? 'trainerstrength.html?load='+encodeURIComponent(s.dayObj.workoutId)+'&plan='+encodeURIComponent(plan.id)+'&day='+s.dayIndex
      : 'live.html?load='+encodeURIComponent(s.dayObj.workoutId)+'&plan='+encodeURIComponent(plan.id)+'&day='+s.dayIndex;
    const minDate = todayIso();
    document.getElementById('sheetBody').innerHTML =
        '<div class="move-lbl"><span>Move to</span><span><button id="mvPrev" aria-label="Previous week">‹</button> <button id="mvNext" aria-label="Next week">›</button></span></div>'
      + '<div class="move-days" id="moveDays"></div>'
      + '<div class="row"><label for="moveDate" style="color:var(--text-dim); font-size:13px;">Or a date</label>'
      + '<input type="date" id="moveDate" min="'+minDate+'" value="'+(s.date >= minDate ? s.date : minDate)+'">'
      + '<button id="moveSaveBtn">Move</button>'
      + (s.moved ? '<button id="moveResetBtn">Back to '+escapeHtml(longDate(s.plannedDate))+'</button>' : '')
      + '</div>'
      + (s.skipped && follow.skips && follow.skips[s.dayIndex] && !s.done ? '<div class="row"><button id="unskipBtn">Put it back (you skipped it)</button></div>'
        : !s.skipped && !s.done && !s.isRace && s.date >= minDate ? '<div class="row"><button id="skipBtn">Skip this session</button></div>' : '')
      + (s.dayObj.swappedFrom && !s.dayObj.holiday ? '<div class="row"><button id="undoSwapBtn">Go back to '+escapeHtml((workouts[s.dayObj.swappedFrom]||{}).name || s.dayObj.swappedFrom)+'</button></div>' : '')
      + (s.isRun ? '<p class="run-desc">'+escapeHtml(s.run.text)+'</p>' : (s.isSwim || s.isBrick || s.isRace) && s.info.text ? '<p class="run-desc">'+escapeHtml(s.info.text)+'</p>' : '')
      + '<div class="actions"><button id="sheetCloseBtn">Close</button>'
        +(!s.isStrength && !s.isSwim && !s.isRace && (s.isRun || (workouts[s.dayObj.workoutId]||{}).steps) ? '<button id="exportBtn">Download file</button>' : '')
        +(s.isRace ? '' : s.isSwim ? '<button class="primary" id="logSwimBtn">Log swim</button>' : s.isRun ? '<button class="primary" id="logRunBtn">Log run</button>'
        : '<a href="'+rideHref+'"><button class="primary">'+(s.isStrength ? 'Start session' : 'Ride now')+'</button></a>')+'</div>';
    sheet.style.display = 'flex';
    // One tap moves to a day of the session's week (or this week, for a missed one); arrows step weeks.
    let moveWeek = mondayOf(s.date >= minDate ? s.date : minDate);
    const byDay = sessionsByDate();
    function drawMoveDays(){
      document.getElementById('mvPrev').disabled = moveWeek <= mondayOf(minDate);
      document.getElementById('moveDays').innerHTML = [0,1,2,3,4,5,6].map(i=>{
        const d = addDays(moveWeek, i), busy = (byDay.get(d)||[]).some(x => !x.done && x !== s && x.dayIndex !== s.dayIndex) || (ridesByDate.get(d)||[]).length;
        return '<button data-to="'+d+'"'+(d === s.date ? ' class="on"' : '')+(d < minDate ? ' disabled' : '')+' aria-label="'+longDate(d)+'">'
          + WEEKDAYS[parseIso(d).getDay()]+'<b>'+parseIso(d).getDate()+'</b>'+(busy ? '<i></i>' : '<i style="visibility:hidden"></i>')+'</button>';
      }).join('');
    }
    drawMoveDays();
    document.getElementById('mvPrev').onclick = ()=>{ moveWeek = addDays(moveWeek, -7); drawMoveDays(); };
    document.getElementById('mvNext').onclick = ()=>{ moveWeek = addDays(moveWeek, 7); drawMoveDays(); };
    document.getElementById('moveDays').onclick = e=>{
      const b = e.target.closest('[data-to]');
      if (!b || b.disabled || b.dataset.to === s.date) return;
      closeSheet(); moveSession(s.dayIndex, b.dataset.to);
    };
    document.getElementById('sheetCloseBtn').onclick = closeSheet;
    document.getElementById('moveSaveBtn').onclick = ()=>{
      const v = document.getElementById('moveDate').value;
      if (v){ closeSheet(); moveSession(s.dayIndex, v); }
    };
    const exportBtn = document.getElementById('exportBtn');
    if (exportBtn) exportBtn.onclick = ()=>{
      closeSheet();
      if (s.isRun) openExportSheet({ kind:'run', session:s.run, T:runPace });
      else openExportSheet({ kind:'bike', workout:workouts[s.dayObj.workoutId], ftp });
    };
    const logRunBtn = document.getElementById('logRunBtn');
    if (logRunBtn) logRunBtn.onclick = async ()=>{
      closeSheet();
      const saved = await openRunLog(supabase, user.id, { session:{ dayIndex:s.dayIndex, date:s.date, workoutId:s.dayObj.workoutId }, planId: plan.id });
      if (saved){ doneDays.set(s.dayIndex, saved); addRide(saved); }
    };
    const logSwimBtn = document.getElementById('logSwimBtn');
    if (logSwimBtn) logSwimBtn.onclick = async ()=>{
      closeSheet();
      const saved = await openSwimLog(supabase, user.id, { session:{ dayIndex:s.dayIndex, date:s.date, workoutId:s.dayObj.workoutId }, planId: plan.id });
      if (saved){ doneDays.set(s.dayIndex, saved); addRide(saved); }
    };
    const undoBtn = document.getElementById('undoSwapBtn');
    if (undoBtn) undoBtn.onclick = async ()=>{
      closeSheet();
      try { await undoSwap(supabase, user.id, follow, s.dayIndex); rebuildPlan(); render(); computeFitness(); }
      catch(e){ notify('Check your connection and try again.', 'Couldn\'t undo that'); }
    };
    const skipBtn = document.getElementById('skipBtn'), unskipBtn = document.getElementById('unskipBtn');
    if (skipBtn) skipBtn.onclick = ()=>{ closeSheet(); setSkipped(s, true); };
    if (unskipBtn) unskipBtn.onclick = ()=>{ closeSheet(); setSkipped(s, false); };
    const resetBtn = document.getElementById('moveResetBtn');
    if (resetBtn) resetBtn.onclick = ()=>{ closeSheet(); moveSession(s.dayIndex, s.plannedDate); };
  });

  // ---- sidebar drawer (overlay on all screen sizes) ----
  const appRoot = document.querySelector('.app');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  function applyCollapsed(collapsed){
    appRoot.classList.toggle('sidebar-collapsed', collapsed);
    sidebarToggle.innerHTML = collapsed ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  }
  sidebarToggle.addEventListener('click', ()=> applyCollapsed(!appRoot.classList.contains('sidebar-collapsed')));
  sidebarBackdrop.addEventListener('click', ()=> applyCollapsed(true));

  // ---- fullscreen toggle (not needed when already running as an installed app) ----
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  if (!document.documentElement.classList.contains('standalone')){
    fullscreenToggle.addEventListener('click', ()=>{
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    });
    document.addEventListener('fullscreenchange', ()=>{
      fullscreenToggle.innerHTML = document.fullscreenElement ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    });
  }

  // ---- init ----
  try {
    await loadAll();
  } catch(e){
    document.getElementById('calBody').innerHTML = '<div class="empty-note">Could not load your calendar. Error: '+escapeHtml(e && e.message ? e.message : String(e))+'</div>';
    return;
  }
  document.getElementById('planLine').innerHTML = plan
    ? 'Following <b>'+escapeHtml(plan.name)+'</b> · '+(plan.weeks||[]).length+' weeks · <a href="plans.html">Plan details</a>'
    : 'Not following a plan. <a href="plans.html">Pick one</a> to see it laid out here.';
  computeFitness();
  render();
})();
</script>
</body>
</html>
