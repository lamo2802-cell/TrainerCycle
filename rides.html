<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TrainerCycle — Rides</title>
<script>if(window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||window.navigator.standalone===true)document.documentElement.classList.add('standalone');</script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app-nav.css?v=4">
<script>try{if(!/\/(index\.html)?$/.test(location.pathname)||Object.keys(localStorage).some(function(k){return /^sb-.+-auth-token$/.test(k)}))document.documentElement.classList.add('has-appnav');}catch(e){}</script>
<meta name="theme-color" content="#10141A">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}</script>
<style>
  :root{
    --bg: #10141A; --panel: #171D25; --panel-2: #1D242D; --line: #2A323D;
    --text: #E7ECF2; --text-dim: #8C97A6; --accent: #45D6C4; --danger: #E5484D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --z-recovery:#5A6472; --z-endurance:#4C8BF5; --z-tempo:#3DBE7A; --z-threshold:#E8B93D;
    --z-vo2:#F08A3C; --z-anaerobic:#E5484D; --z-neuro:#B14AED;
  }
  *{box-sizing:border-box;}

  .page-banner{
    height:260px; border-radius:10px; margin-bottom:20px; background-size:cover; background-position:center 40%;
    position:relative; overflow:hidden;
  }
  @media (max-width:600px){ .page-banner{ height:180px; } }
  .page-banner::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,13,17,0) 0%, rgba(10,13,17,0) 65%, var(--bg) 100%);
  }

  :root{ --topbar-h: calc(80px + env(safe-area-inset-top, 0px)); }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; }
  .app{ position:relative; min-height:100vh; }
  .sidebar{
    position:fixed; top:var(--topbar-h); left:0; bottom:0; width:340px; max-width:85vw;
    background:var(--panel); border-right:1px solid var(--line);
    padding:20px; overflow-y:auto; z-index:60;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar{ transform:translateX(0); }
  .sidebar-backdrop{
    position:fixed; top:var(--topbar-h); left:0; right:0; bottom:0; background:rgba(0,0,0,.5);
    z-index:55; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar-backdrop{ opacity:1; pointer-events:auto; }
  .main{ padding:calc(96px + env(safe-area-inset-top, 0px)) 28px 24px; max-width:min(1700px, 97vw); margin:0 auto; }
  .top-bar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:50;
    display:flex; align-items:center; padding:0 14px; padding-top:env(safe-area-inset-top, 0px);
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .icon-btn{
    width:38px; height:38px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  html.standalone #fullscreenToggle{ display:none; }
  .top-bar-logo-link{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; }
  .top-logo{ height:60px; width:auto; border-radius:8px; display:block; }
  .top-bar-spacer{ flex:1; }

  .sub{ color:var(--text-dim); font-size:12.5px; margin:2px 0 20px; }
  .block{ margin-bottom:24px; }
  .block-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .page-nav{ display:flex; flex-direction:column; gap:2px; }
  .page-nav a{ padding:10px 10px; border-radius:6px; color:var(--text-dim); text-decoration:none; font-size:16px; }
  .page-nav a:hover{ background:var(--panel-2); color:var(--text); }
  .page-nav a.active{ background:var(--panel-2); color:var(--accent); font-weight:600; }

  select{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 9px; font-size:13px; width:100%; }
  button{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:#08211E; border-color:var(--accent); font-weight:600; }

  .empty-note{ color:var(--text-dim); font-size:13px; }
  .page-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .page-head h1{ font-size:24px; margin:0; }
  .head-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .ghost-btn{ width:auto; margin:0; padding:8px 14px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer; }
  .ride-row .mini.run{ display:flex; align-items:center; gap:6px; color:#C084FC; font-size:12px; font-family:var(--mono); }
  .ride-row .mini.run svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tag.run{ color:#C084FC; border-color:rgba(192,132,252,.5); }
  .tag.strava{ color:#FC6A2C; border-color:rgba(252,106,44,.5); }
  .ride-row .mini.ext{ color:var(--text-dim); }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button{ border:none; border-radius:0; background:var(--panel-2); padding:8px 14px; }
  .seg button.on{ background:var(--accent); color:#08211E; font-weight:600; }

  /* ---- list ---- */
  .summary{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:20px; }
  .sum-tile{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .sum-tile .lbl{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
  .sum-tile .val{ font-family:var(--mono); font-size:24px; font-weight:600; margin-top:2px; }
  .week-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:18px 2px 8px; }
  .week-head .t{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .week-head .s{ font-size:12px; color:var(--text-dim); font-family:var(--mono); }
  .ride-row{ display:grid; grid-template-columns:4px minmax(0,1fr) 150px auto; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px 10px 0; margin-bottom:6px; color:var(--text); cursor:pointer; font:inherit; overflow:hidden; }
  .ride-row:hover{ border-color:#3A4452; }
  .ride-row .bar{ align-self:stretch; border-radius:0 3px 3px 0; margin:-10px 0; }
  .ride-row .nm{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ride-row .when{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .ride-row .mini{ display:block; width:150px; height:30px; }
  .ride-row .st{ display:flex; gap:14px; font-family:var(--mono); font-size:12px; color:var(--text-dim); text-align:right; }
  .ride-row .st b{ display:block; color:var(--text); font-size:14.5px; }
  .tag{ display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); margin-left:6px; font-weight:500; vertical-align:1px; }
  .tag.plan{ color:var(--accent); }
  @media (max-width:640px){
    .ride-row{ grid-template-columns:4px minmax(0,1fr) auto; }
    .ride-row .mini, .ride-row .mini.run{ display:none; }
    .ride-row .st span:nth-child(3){ display:none; }
    .summary .val{ font-size:20px; }
  }

  /* ---- detail ---- */
  .back{ display:inline-flex; align-items:center; gap:6px; color:var(--accent); background:none; border:none; padding:6px 0; font-size:14px; margin-bottom:6px; }
  .d-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .d-head h1{ font-size:24px; margin:0 0 4px; }
  .d-head .when{ color:var(--text-dim); font-size:13px; }
  .d-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .d-actions button{ min-height:38px; }
  .saved-note{ background:color-mix(in srgb, var(--accent) 12%, var(--panel)); border:1px solid var(--accent); color:var(--text); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13.5px; }
  .saved-note b{ color:var(--accent); }
  .tag.pb{ color:#E8B93D; border-color:rgba(232,185,61,.45); }
  .pb-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .pb-chip{ font-size:11.5px; font-weight:600; color:#E8B93D; background:rgba(232,185,61,.12); border:1px solid rgba(232,185,61,.4); padding:3px 9px; border-radius:20px; }
  .finish{ position:relative; overflow:hidden; border-radius:14px; padding:22px 22px 20px; margin-bottom:16px; border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    background:radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), var(--panel); }
  .finish-kicker{ font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .finish-title{ font-size:clamp(20px, 3.4vw, 26px); font-weight:700; margin:4px 0 16px; letter-spacing:-.015em; }
  .finish-stats{ display:grid; grid-template-columns:1.5fr repeat(3, minmax(0,1fr)); gap:10px; }
  @media (max-width:520px){ .finish-stats{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px 10px; } }
  .finish-stats .fs b{ display:block; font-family:var(--mono); font-size:clamp(22px, 4vw, 32px); font-weight:700; line-height:1.1; }
  .finish-stats .fs span{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; }
  .finish .pb-chips{ margin-top:14px; }
  .ftp-note{ display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; }
  .ftp-btns{ display:flex; gap:8px; }
  .ftp-btns button{ width:auto; margin:0; min-height:36px; }
  .feel-card{ padding:14px 16px; }
  .feel-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px 16px; flex-wrap:wrap; margin-bottom:12px; }
  .feel-wl{ font-size:13px; color:var(--text-dim); }
  .lvl-chip{ display:inline-block; font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--text); padding:2px 8px; border-radius:6px;
    background:color-mix(in srgb, var(--zc) 18%, transparent); border:1px solid color-mix(in srgb, var(--zc) 55%, transparent); }
  .feel-result{ font-size:14px; }
  .feel-result b{ font-family:var(--mono); }
  .feel-result .up{ color:var(--accent); font-family:var(--mono); font-weight:600; }
  .feel-result .dim{ color:var(--text-dim); }
  .feel-opts{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; }
  .feel-opts button{ display:flex; flex-direction:column; align-items:center; gap:2px; width:auto; margin:0; padding:10px 6px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); cursor:pointer; text-align:center; }
  .feel-opts button b{ font-size:13.5px; }
  .feel-opts button span{ font-size:11px; color:var(--text-dim); }
  .feel-opts button:hover{ border-color:#3A4452; }
  .feel-opts button.on{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--panel-2)); }
  .feel-note{ font-size:12px; color:var(--text-dim); margin-top:10px; }
  @media (max-width:640px){
    .feel-opts{ grid-template-columns:repeat(5, minmax(0,1fr)); gap:5px; }
    .feel-opts button{ padding:9px 2px; }
    .feel-opts button b{ font-size:11.5px; }
    .feel-opts button span{ display:none; }
  }
  .d-stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-bottom:16px; }
  @media (min-width:900px){ .d-stats{ grid-template-columns:repeat(9, minmax(0,1fr)); } .d-stat .val{ font-size:18px; } }
  .d-stat{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .d-stat .val{ font-family:var(--mono); font-size:20px; font-weight:600; }
  @media (max-width:520px){ .d-stat{ padding:9px 10px; } .d-stat .val{ font-size:17px; } }
  .d-stat .lbl{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .panel-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .chart-legend{ display:flex; gap:14px; font-size:11.5px; color:var(--text-dim); text-transform:none; letter-spacing:0; }
  .chart-legend span{ display:flex; align-items:center; gap:5px; }
  .chart-legend i{ display:inline-block; width:12px; height:3px; border-radius:2px; }
  .chart-wrap{ position:relative; }
  #rideChart{ width:100%; height:220px; display:block; touch-action:pan-y; }
  #curveChart{ width:100%; height:200px; display:block; touch-action:pan-y; }
  .tip{ position:absolute; top:0; pointer-events:none; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12px; font-family:var(--mono); white-space:nowrap; display:none; z-index:5; }
  .tip .d{ color:var(--text-dim); font-family:var(--sans); margin-bottom:3px; }
  .two{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }
  @media (max-width:800px){ .two{ grid-template-columns:1fr; } }
  .bests{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin-top:10px; }
  .best{ background:var(--panel-2); border-radius:8px; padding:6px 8px; text-align:center; }
  .best b{ font-family:var(--mono); font-size:15px; display:block; }
  .best span{ font-size:10.5px; color:var(--text-dim); }
  .zone-row{ display:grid; grid-template-columns:96px minmax(0,1fr) 74px; align-items:center; gap:10px; margin-bottom:7px; font-size:12.5px; }
  .zone-row .zn{ display:flex; align-items:center; gap:6px; color:var(--text); }
  .zone-row .zn i{ width:9px; height:9px; border-radius:2px; display:inline-block; flex-shrink:0; }
  .zone-row .track{ height:12px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
  .zone-row .track i{ display:block; height:100%; border-radius:4px; }
  .zone-row .v{ text-align:right; font-family:var(--mono); color:var(--text-dim); }
  .zone-row .v b{ color:var(--text); font-weight:600; }
  .laps{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .laps th{ text-align:right; font-weight:500; color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--line); }
  .laps td{ text-align:right; padding:7px 8px; border-bottom:1px solid var(--line); font-family:var(--mono); }
  .laps th:first-child, .laps td:first-child{ text-align:left; font-family:var(--sans); }
  .laps td:first-child i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:0; }
  .laps .hit{ color:var(--accent); } .laps .miss{ color:#E8B93D; }
  .laps-wrap{ overflow-x:auto; }
  @media (max-width:640px){ .laps .opt{ display:none; } }

  /* Full-screen animated logo shown right after a ride is saved, before the post-ride summary
     is revealed underneath it - a little "landing" moment instead of the page just appearing. */
  .logo-reveal-overlay{
    position:fixed; inset:0; z-index:500; background:var(--bg);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px;
  }
  html.logo-reveal-pending .logo-reveal-overlay{ display:flex; }
  .logo-reveal-overlay.lr-fade-out{ opacity:0; transition:opacity .5s ease; pointer-events:none; }
  .logo-reveal-mark{ width:104px; height:104px; }
  .logo-reveal-mark .lr-needle{ transform-origin:60px 60px; animation:lrSpin 1.05s cubic-bezier(.22,1,.36,1) forwards; }
  .logo-reveal-mark .lr-arc{ stroke-dasharray:264; stroke-dashoffset:264; animation:lrDraw 1.05s ease forwards; }
  .logo-reveal-mark .lr-hub{ transform-origin:60px 60px; animation:lrPulse .6s ease .5s backwards; }
  .logo-reveal-word{ font-size:22px; font-weight:700; color:var(--text); letter-spacing:-0.01em; opacity:0; animation:lrWordIn .5s ease .7s forwards; }
  .logo-reveal-word span{ color:var(--accent); }
  .logo-reveal-sub{ font-size:12px; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase; opacity:0; animation:lrWordIn .5s ease .85s forwards; }
  @keyframes lrSpin{ from{ transform:rotate(-480deg); } to{ transform:rotate(0deg); } }
  @keyframes lrDraw{ from{ stroke-dashoffset:264; } to{ stroke-dashoffset:0; } }
  @keyframes lrPulse{ from{ transform:scale(0); } 70%{ transform:scale(1.25); } to{ transform:scale(1); } }
  @keyframes lrWordIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .logo-reveal-mark .lr-needle, .logo-reveal-mark .lr-arc, .logo-reveal-mark .lr-hub, .logo-reveal-word, .logo-reveal-sub{ animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; }
  }
</style>
</head>
<body>
<script>
  // Set before first paint so the overlay is there from frame one, not flashed in after load.
  if (new URLSearchParams(window.location.search).get('summary')) document.documentElement.classList.add('logo-reveal-pending');
</script>
<div class="logo-reveal-overlay" id="logoRevealOverlay">
  <svg class="logo-reveal-mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="42" fill="none" stroke="#2A323D" stroke-width="3"/>
    <path class="lr-arc" d="M 60 18 A 42 42 0 1 1 25.5 82.6" fill="none" stroke="#45D6C4" stroke-width="6" stroke-linecap="round"/>
    <g class="lr-needle">
      <line x1="60" y1="60" x2="76" y2="30" stroke="#E7ECF2" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle class="lr-hub" cx="60" cy="60" r="8" fill="#45D6C4"/>
  </svg>
  <div class="logo-reveal-word">Trainer<span>Cycle</span></div>
  <div class="logo-reveal-sub">Ride saved</div>
</div>
<div class="top-bar">
  <button class="icon-btn" id="sidebarToggle" aria-label="Toggle menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a href="index.html" class="top-bar-logo-link" aria-label="TrainerCycle home"><img src="wordmark.svg" class="top-logo" alt="TrainerCycle"></a>
  <div class="top-bar-spacer"></div>
  <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div class="app sidebar-collapsed">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar">
    <p class="sub" style="margin-top:0;">Completed Rides</p>

    <div class="block">
      <div class="block-title">Navigate</div>
      <nav class="page-nav">
        <a href="index.html">Today</a>
        <a href="plans.html">Training Plans</a>
        <a href="calendar.html">Calendar</a>
        <a href="builder.html">Workouts</a>
        <a href="live.html">Live Ride</a>
        <a href="trainerstrength.html">TrainerStrength</a>
        <a href="rides.html" class="active">Rides</a>
        <a href="settings.html">Settings</a>
        <a href="help.html">How to Use</a>
      </nav>
    </div>
  </div>

  <div class="main">
    <div id="listView">
      <div class="page-banner" style="background-image:url('banner-rides.jpg');"></div>
      <div class="page-head">
        <h1>Rides</h1>
        <div class="head-actions"><button class="ghost-btn" id="logRunBtn">+ Log a run</button>
        <div class="seg" id="filterSeg"><button data-f="" class="on">All</button><button data-f="rides">Rides</button><button data-f="runs">Runs</button><button data-f="partial">Partial</button></div></div>
      </div>
      <div class="summary" id="summary"></div>
      <div id="ridesList"><div class="sk-stack" aria-label="Loading"><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div></div>
    </div>
    <div id="detailView" style="display:none;"></div>
  </div>
</div>

<script type="module">
import { createSupabaseClient, requireAuth, renderSidebarUserBadge, showSubscribeNudge } from './auth.js?v=17';
import { notify, ask } from './sheet.js?v=2';
import { openRunLog, fmtPace, fmtKm, syncStrava } from './run.js?v=2';
import { estimateFtp, shouldSuggest } from './ftp-estimate.js?v=1';
import { countUp, newBests, pbLabel } from './motion.js?v=1';
import { computeLevels, workoutLevel, zoneInfo, FEEL_OPTIONS, fmtLevel } from './levels.js?v=1';
const supabase = createSupabaseClient();

(async function(){
  const user = await requireAuth(supabase);
  renderSidebarUserBadge(supabase, user, document.querySelector('.sidebar'));
  await showSubscribeNudge(supabase, user);
  let rides = [];        // list rows (no samples - those load per ride)
  const workoutsById = {}, workoutsByName = {};
  let filter = '';

  function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    return h>0 ? (h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')) : (m+':'+String(s).padStart(2,'0'));
  }
  function fmtHm(sec){ const m = Math.round((sec||0)/60); return m >= 60 ? Math.floor(m/60)+'h'+String(m%60).padStart(2,'0') : m+'m'; }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function localIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function mondayOf(d){ const m = new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate() - ((m.getDay()+6)%7)); return m; }

  const ZONES = [
    {max:60,color:'var(--z-recovery)',hex:'#5A6472',name:'Recovery'},{max:76,color:'var(--z-endurance)',hex:'#4C8BF5',name:'Endurance'},
    {max:91,color:'var(--z-tempo)',hex:'#3DBE7A',name:'Tempo'},{max:106,color:'var(--z-threshold)',hex:'#E8B93D',name:'Threshold'},
    {max:121,color:'var(--z-vo2)',hex:'#F08A3C',name:'VO2 Max'},{max:151,color:'var(--z-anaerobic)',hex:'#E5484D',name:'Anaerobic'},
    {max:Infinity,color:'var(--z-neuro)',hex:'#B14AED',name:'Sprint'}
  ];
  function zoneIdx(pct){ for (let i=0;i<ZONES.length;i++) if (pct < ZONES[i].max) return i; return ZONES.length-1; }
  function zoneColor(pct){ return pct==null ? 'var(--text-dim)' : ZONES[zoneIdx(pct)].color; }
  function zoneRGBA(pct, alpha){ const h = ZONES[zoneIdx(pct)].hex; return 'rgba('+parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)+','+alpha+')'; }
  const CATEGORY_PCT = { recovery:50, endurance:70, tempo:85, sweet_spot:90, threshold:100, over_under:100, vo2max:115, anaerobic:130, test:100 };

  function flattenSteps(steps){ let out=[]; for (const st of steps||[]){ if (st.type==='repeat'){ for (let i=0;i<st.repetitions;i++) out=out.concat(flattenSteps(st.steps)); } else out.push(st); } return out; }
  function workoutFor(r){ return (r.workout_id && workoutsById[r.workout_id]) || workoutsByName[r.workout_name] || null; }
  function miniProfile(r){
    const w = workoutFor(r);
    if (!w || !w.steps) return '<span class="mini"></span>';
    const flat = flattenSteps(w.steps); const total = flat.reduce((a,x)=>a+(x.duration||0),0) || 1;
    let x = 0;
    const rects = flat.map(st=>{
      const pct = st.targetType==='ftp_pct' ? (st.low+st.high)/2 : 60;
      const wd = (st.duration||0)/total*150, h = Math.max(3, Math.min(30, pct/150*30));
      const out = '<rect x="'+x.toFixed(1)+'" y="'+(30-h).toFixed(1)+'" width="'+Math.max(.4,wd-.3).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+ZONES[zoneIdx(pct)].hex+'"/>';
      x += wd; return out;
    }).join('');
    return '<svg class="mini" viewBox="0 0 150 30" preserveAspectRatio="none" aria-hidden="true">'+rects+'</svg>';
  }

  async function loadRides(){
    try {
      const [rRes, wRes] = await Promise.all([
        supabase.from('completed_rides').select('id,workout_name,category,started_at,duration_sec,avg_power,np,intensity_factor,avg_hr,max_hr,avg_cadence,completed,tss,workout_id,plan_id,plan_day_index,strava_uploaded_at,feel,power_bests,sport,distance_m,elevation_m,source,external_id')
          .order('started_at',{ascending:false}).limit(200),
        supabase.from('workouts').select('id,name,steps,category')
      ]);
      if (rRes.error) throw rRes.error;
      rides = rRes.data || [];
      (wRes.data||[]).forEach(w=>{ workoutsById[w.id] = w; if (!workoutsByName[w.name]) workoutsByName[w.name] = w; });
    } catch(e){
      rides = [];
      document.getElementById('ridesList').innerHTML = '<div class="empty-note">Couldn\'t load your rides. Check your connection and refresh.</div>';
      hideLogoReveal();
      return;
    }
    renderList();
    // New rides and runs from Strava arrive in the background.
    supabase.from('strava_connections').select('scope').eq('user_id', user.id).maybeSingle().then(async ({ data })=>{
      if (!data || !/activity:read/.test(data.scope || '')) return;
      const res = await syncStrava(supabase, user.id);
      const fresh = res.imported.filter(r => !rides.some(x => x.id === r.id));
      if (!fresh.length) return;
      rides = rides.concat(fresh).sort((a,b)=> a.started_at < b.started_at ? 1 : -1);
      renderList();
    }, ()=>{});
    const q = new URLSearchParams(window.location.search);
    const summaryId = q.get('summary'), rideId = q.get('ride');
    if (summaryId){
      history.replaceState({ ride: summaryId }, '', '?ride='+encodeURIComponent(summaryId));
      await showDetail(summaryId, { justSaved:true });
    } else if (rideId){
      await showDetail(rideId);
    }
    hideLogoReveal();
  }

  // Lets the full-screen logo animation play for a minimum stretch (so it never just flashes),
  // then fades out to reveal the already-drawn summary underneath it.
  let logoRevealShownAt = document.documentElement.classList.contains('logo-reveal-pending') ? Date.now() : null;
  function hideLogoReveal(){
    if (logoRevealShownAt == null) return;
    const minMs = 1300;
    const wait = Math.max(0, minMs - (Date.now() - logoRevealShownAt));
    setTimeout(()=>{
      const overlay = document.getElementById('logoRevealOverlay');
      overlay.classList.add('lr-fade-out');
      setTimeout(()=>{
        overlay.style.display = 'none';
        document.documentElement.classList.remove('logo-reveal-pending');
      }, 500);
    }, wait);
    logoRevealShownAt = null;
  }

  // ---- list: summary + rides grouped by week ----
  function isRun(r){ return r.sport === 'run'; }
  const FEEL_WORDS = ['', 'Easy', 'Moderate', 'Hard', 'Very hard', 'All out'];
  function runDetailHtml(r){
    const stat = (v,l)=>'<div class="d-stat"><div class="val">'+(v ?? '—')+'</div><div class="lbl">'+l+'</div></div>';
    const pace = r.distance_m ? fmtPace(r.duration_sec/(r.distance_m/1000)) : null;
    return '<button class="back" data-back>‹ Rides</button>'
      + '<div class="d-head"><div><h1>'+escapeHtml(r.workout_name)+'<span class="tag run">'+(r.source === 'strava' ? 'From Strava' : 'Run')+'</span></h1>'
      + '<div class="when">'+fmtDate(r.started_at)+(r.plan_id ? ' · <span class="tag plan" style="margin-left:0">Plan session</span>' : '')+'</div></div>'
      + '<div class="d-actions"><button data-del-run="'+r.id+'">Delete run</button></div></div>'
      + '<div class="d-stats">'
      + stat(fmtDur(r.duration_sec),'Duration') + stat(r.distance_m ? fmtKm(r.distance_m) : null,'Distance (km)') + stat(pace,'Pace (/km)')
      + stat(r.tss,'TSS') + stat(r.intensity_factor!=null ? Number(r.intensity_factor).toFixed(2) : null,'IF')
      + stat(r.feel ? FEEL_WORDS[r.feel] : null,'Felt') + stat(r.avg_hr,'Avg HR') + stat(r.max_hr,'Max HR') + stat(r.elevation_m,'Climb (m)')
      + '</div>'
      + '<div class="panel empty-note">Runs count towards your Fitness, Fatigue and Form'+(r.intensity_factor!=null ? ', using your threshold pace when there\'s a distance, or how it felt when there isn\'t' : '')+'.</div>';
  }
  // Rides brought in from Strava (outdoors or other apps) only have totals, no second-by-second data.
  function isImported(r){ return r.source === 'strava'; }
  function importedRideHtml(r){
    const stat = (v,l)=>'<div class="d-stat"><div class="val">'+(v ?? '—')+'</div><div class="lbl">'+l+'</div></div>';
    const speed = r.distance_m && r.duration_sec ? (r.distance_m/1000/(r.duration_sec/3600)).toFixed(1) : null;
    const kj = r.avg_power!=null ? Math.round(r.avg_power*r.duration_sec/1000) : null;
    const how = r.np ? 'from your power and FTP' : r.avg_hr ? 'from your heart rate against your threshold heart rate (set it in Settings)' : 'as a steady endurance ride, since there was no power or heart rate';
    return '<button class="back" data-back>‹ Rides</button>'
      + '<div class="d-head"><div><h1>'+escapeHtml(r.workout_name)+'<span class="tag strava">From Strava</span></h1>'
      + '<div class="when">'+fmtDate(r.started_at)+'</div></div>'
      + '<div class="d-actions"><button data-del-run="'+r.id+'" data-what="ride">Delete ride</button></div></div>'
      + '<div class="d-stats">'
      + stat(fmtDur(r.duration_sec),'Duration') + stat(r.distance_m ? fmtKm(r.distance_m) : null,'Distance (km)') + stat(speed,'Speed (km/h)')
      + stat(r.tss,'TSS') + stat(r.intensity_factor!=null ? Number(r.intensity_factor).toFixed(2) : null,'IF')
      + (r.np ? stat(r.np,'NP (W)') + stat(r.avg_power,'Avg power') + stat(kj,'Work (kJ)') : '')
      + stat(r.avg_hr,'Avg HR') + stat(r.max_hr,'Max HR') + (r.avg_cadence ? stat(r.avg_cadence,'Cadence') : '') + stat(r.elevation_m,'Climb (m)')
      + '</div>'
      + '<div class="panel empty-note">Brought in from Strava. It counts towards your Fitness, Fatigue and Form, with TSS worked out '+how+'. Outside rides don\'t change your levels or power bests.</div>';
  }
  const BIKE_ICON = '<svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8l2 8h-6M14 5h2"/></svg>';
  const RUN_ICON = '<svg viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 3v5M7 12l3-4 4 1 3 4 3 1M10 8l-1 5"/></svg>';
  function runRowHtml(r){
    const pace = r.distance_m ? fmtPace(r.duration_sec/(r.distance_m/1000)) : null;
    return '<button class="ride-row" data-ride="'+r.id+'"><span class="bar" style="background:#C084FC"></span>'
      + '<span style="min-width:0;"><div class="nm">'+escapeHtml(r.workout_name)+'<span class="tag run">'+(r.source === 'strava' ? 'Strava run' : 'Run')+'</span></div><div class="when">'+fmtDate(r.started_at)+'</div></span>'
      + '<span class="mini run">'+RUN_ICON+(pace ? pace+' /km' : '')+'</span>'
      + '<span class="st"><span><b>'+fmtHm(r.duration_sec)+'</b>time</span><span><b>'+(r.distance_m ? fmtKm(r.distance_m) : '—')+'</b>km</span><span><b>'+(r.tss ?? '—')+'</b>TSS</span></span>'
      + '</button>';
  }
  function renderList(){
    const el = document.getElementById('ridesList');
    const since = new Date(Date.now() - 28*86400000);
    const recent = rides.filter(r=> new Date(r.started_at) >= since);
    document.getElementById('summary').innerHTML =
        '<div class="sum-tile"><div class="lbl">'+(recent.some(isRun) ? 'Sessions' : 'Rides')+' · 4 wks</div><div class="val">'+recent.length+'</div></div>'
      + '<div class="sum-tile"><div class="lbl">Time · 4 wks</div><div class="val">'+fmtHm(recent.reduce((a,r)=>a+(r.duration_sec||0),0))+'</div></div>'
      + '<div class="sum-tile"><div class="lbl">TSS · 4 wks</div><div class="val">'+recent.reduce((a,r)=>a+(r.tss||0),0)+'</div></div>';

    if (!rides.length){ el.innerHTML = '<div class="empty-note">No rides yet. Finish a session on Live Ride and it\'ll show up here.</div>'; return; }
    let items = rides;
    if (filter==='rides') items = items.filter(r=>!isRun(r));
    if (filter==='runs') items = items.filter(isRun);
    if (filter==='partial') items = items.filter(r=>!r.completed);
    if (!items.length){ el.innerHTML = '<div class="empty-note">No rides match this filter.</div>'; return; }

    const thisMon = mondayOf(new Date());
    const groups = [];
    items.forEach(r=>{
      const key = localIso(mondayOf(new Date(r.started_at)));
      let g = groups[groups.length-1];
      if (!g || g.key !== key){ g = { key, rides:[] }; groups.push(g); }
      g.rides.push(r);
    });
    el.innerHTML = groups.map(g=>{
      const weeksAgo = Math.round((thisMon - new Date(g.key+'T00:00:00')) / (7*86400000));
      const title = weeksAgo === 0 ? 'This week' : weeksAgo === 1 ? 'Last week'
        : 'Week of ' + new Date(g.key+'T00:00:00').toLocaleDateString(undefined,{ day:'numeric', month:'short' });
      const time = g.rides.reduce((a,r)=>a+(r.duration_sec||0),0), tss = g.rides.reduce((a,r)=>a+(r.tss||0),0);
      const nRuns = g.rides.filter(isRun).length, nRides = g.rides.length - nRuns;
      const counts = [nRides ? nRides+' ride'+(nRides===1?'':'s') : '', nRuns ? nRuns+' run'+(nRuns===1?'':'s') : ''].filter(Boolean).join(' · ');
      return '<div class="week-head"><span class="t">'+title+'</span><span class="s">'+counts+' · '+fmtHm(time)+' · '+tss+' TSS</span></div>'
        + g.rides.map(r=>{
          if (isRun(r)) return runRowHtml(r);
          const pct0 = r.intensity_factor!=null ? Number(r.intensity_factor)*100 : CATEGORY_PCT[r.category];
          const pct = pct0 == null && isImported(r) ? 70 : pct0;
          return '<button class="ride-row" data-ride="'+r.id+'"><span class="bar" style="background:'+zoneColor(pct)+'"></span>'
            + '<span style="min-width:0;"><div class="nm">'+escapeHtml(r.workout_name)+(isImported(r) ? '<span class="tag strava">Strava</span>' : '')+(r.completed ? '' : '<span class="tag">Partial</span>')+(newBests(r, rides).length ? '<span class="tag pb">PB</span>' : '')+'</div><div class="when">'+fmtDate(r.started_at)+'</div></span>'
            + (isImported(r) ? '<span class="mini run ext">'+BIKE_ICON+(r.distance_m ? fmtKm(r.distance_m)+' km' : '')+'</span>' : miniProfile(r))
            + '<span class="st"><span><b>'+fmtHm(r.duration_sec)+'</b>time</span><span><b>'+(r.tss ?? '—')+'</b>TSS</span><span><b>'+(r.intensity_factor!=null ? Number(r.intensity_factor).toFixed(2) : '—')+'</b>IF</span></span>'
            + '</button>';
        }).join('');
    }).join('');
  }
  document.getElementById('logRunBtn').addEventListener('click', async ()=>{
    const saved = await openRunLog(supabase, user.id);
    if (saved){ rides.unshift(saved); rides.sort((a,b)=> a.started_at < b.started_at ? 1 : -1); renderList(); }
  });
  document.getElementById('detailView').addEventListener('click', async e=>{
    const b = e.target.closest('[data-del-run]'); if (!b) return;
    const what = b.dataset.what || 'run';
    const ok = await ask('This removes it from your history and training load.', { title:'Delete this '+what+'?', ok:'Delete', danger:true });
    if (!ok) return;
    const gone = rides.find(x => x.id === b.dataset.delRun) || detailCache[b.dataset.delRun];
    const { error } = await supabase.from('completed_rides').delete().eq('id', b.dataset.delRun);
    if (error){ notify('Check your connection and try again.', 'Couldn\'t delete that '+what); return; }
    // Remember deleted Strava imports so the next sync doesn't bring them back.
    if (gone && gone.external_id){
      try {
        const { data } = await supabase.from('settings').select('value').eq('key','strava_import_ignored').eq('user_id', user.id).maybeSingle();
        const list = ((data && data.value && data.value.v) || []).concat(gone.external_id).slice(-200);
        await supabase.from('settings').upsert({ user_id:user.id, key:'strava_import_ignored', value:{v:list}, updated_at:new Date().toISOString() }, { onConflict:'user_id,key' });
      } catch(_){}
    }
    rides = rides.filter(x => x.id !== b.dataset.delRun); delete detailCache[b.dataset.delRun];
    history.pushState({}, '', location.pathname); showList();
  });
  document.getElementById('filterSeg').addEventListener('click', e=>{
    const b = e.target.closest('[data-f]'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filterSeg button').forEach(x=> x.classList.toggle('on', x === b));
    renderList();
  });
  document.getElementById('ridesList').addEventListener('click', e=>{
    const row = e.target.closest('[data-ride]'); if (!row) return;
    history.pushState({ ride: row.dataset.ride }, '', '?ride='+encodeURIComponent(row.dataset.ride));
    showDetail(row.dataset.ride);
  });
  window.addEventListener('popstate', ()=>{
    const id = new URLSearchParams(location.search).get('ride');
    if (id) showDetail(id); else showList();
  });
  function showList(){
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = '';
    current = null;
  }

  // ---- ride detail ----
  let current = null; // { ride, sec: per-second series, ftp }
  const detailCache = {};

  // Samples arrive roughly once a second while riding (elapsed = active seconds). Resample to exactly
  // one value per second so averages and best efforts are time-weighted.
  function perSecond(samples){
    const n = samples.length ? Math.max(1, Math.floor(Number(samples[samples.length-1].elapsed)||0) + 1) : 0;
    const out = new Array(n);
    const buckets = new Map();
    samples.forEach(sm=>{
      const t = Math.max(0, Math.floor(Number(sm.elapsed)||0));
      if (!buckets.has(t)) buckets.set(t, []);
      buckets.get(t).push(sm);
    });
    let last = { power:0, hr:null, cadence:null, target:null, stepIdx:null };
    for (let t=0;t<n;t++){
      const b = buckets.get(t);
      if (b){
        const avg = k => { const v = b.map(x=>Number(x[k])).filter(x=>x>0 || (k==='power' && x===0)); return v.length ? v.reduce((a,c)=>a+c,0)/v.length : null; };
        const p = avg('power');
        last = { power: p!=null ? p : last.power, hr: avg('hr') ?? last.hr, cadence: avg('cadence') ?? last.cadence,
          target: Number(b[b.length-1].target) || null, stepIdx: b[b.length-1].stepIdx ?? last.stepIdx };
      }
      out[t] = Object.assign({ t }, last);
    }
    return out;
  }
  const CURVE_DURS = [5,10,15,30,60,120,180,300,480,600,1200,1800,2700,3600,5400,7200];
  function bestEfforts(sec){
    const p = sec.map(x=>x.power||0), n = p.length;
    const pre = new Float64Array(n+1); for (let i=0;i<n;i++) pre[i+1] = pre[i] + p[i];
    return CURVE_DURS.filter(d=>d<=n).map(d=>{
      let best = 0; for (let i=d;i<=n;i++){ const v = pre[i]-pre[i-d]; if (v>best) best = v; }
      return { d, w: Math.round(best/d) };
    });
  }
  function durLabel(d){ return d < 60 ? d+'s' : d < 3600 ? (d/60)+' min' : (d/3600)+' h'; }

  async function showDetail(id, opts={}){
    const el = document.getElementById('detailView');
    document.getElementById('listView').style.display = 'none';
    el.style.display = '';
    window.scrollTo(0,0);
    let ride = detailCache[id];
    if (!ride){
      el.innerHTML = '<button class="back" data-back>‹ Rides</button><div class="empty-note">Loading ride…</div>';
      try {
        const { data, error } = await supabase.from('completed_rides').select('*').eq('id', id).maybeSingle();
        if (error) throw error;
        ride = data;
      } catch(e){ ride = null; }
      if (!ride){ el.innerHTML = '<button class="back" data-back>‹ Rides</button><div class="empty-note">That ride couldn\'t be loaded.</div>'; return; }
      detailCache[id] = ride;
    }
    if (isRun(ride)){ el.innerHTML = runDetailHtml(ride); return; }
    if (isImported(ride)){ el.innerHTML = importedRideHtml(ride); return; }
    const sec = perSecond(ride.samples || []);
    // FTP at the time of the ride, backed out from NP/IF, so zones reflect what was true then.
    const ftp = (ride.np && ride.intensity_factor) ? ride.np / ride.intensity_factor : null;
    current = { ride, sec, ftp };
    const w = workoutFor(ride);
    const kj = ride.avg_power!=null ? Math.round(ride.avg_power*ride.duration_sec/1000) : null;
    const stat = (v,l)=>'<div class="d-stat"><div class="val">'+(v ?? '—')+'</div><div class="lbl">'+l+'</div></div>';

    let html = '<button class="back" data-back>‹ Rides</button>';
    const pbs = newBests(ride, rides.some(r=>r.id===ride.id) ? rides.map(r=> r.id===ride.id ? Object.assign({}, r, { power_bests: ride.power_bests }) : r) : rides.concat([ride]));
    const pbHtml = pbs.length ? '<div class="pb-chips">'+pbs.map(b=>'<span class="pb-chip" title="Previous best '+b.prev+' W">New '+pbLabel(b.d)+' best · '+b.w+' W</span>').join('')+'</div>' : '';
    if (opts.justSaved){
      const kjDone = ride.avg_power!=null ? Math.round(ride.avg_power*ride.duration_sec/1000) : null;
      const big = (v,l)=> v==null ? '' : '<div class="fs"><b data-count="'+v+'">'+v+'</b><span>'+l+'</span></div>';
      html += '<div class="finish fade-in"><div class="finish-kicker">'+(ride.completed ? 'Workout complete' : 'Ride saved')+'</div>'
        + '<div class="finish-title">'+(ride.completed ? (pbs.length ? 'New personal best. Great ride.' : 'Nice work. That one\'s in the bank.') : 'Every minute counts. It\'s saved.')+'</div>'
        + '<div class="finish-stats"><div class="fs"><b>'+fmtDur(ride.duration_sec)+'</b><span>Time</span></div>'+big(ride.tss,'TSS')+big(ride.np,'NP (W)')+big(kjDone,'kJ')+'</div>'
        + pbHtml + '</div>';
    }
    if (opts.justSaved) html += '<div id="ftpNote"></div>';
    html += '<div class="d-head"><div><h1>'+escapeHtml(ride.workout_name)+(ride.completed ? '' : '<span class="tag">Partial</span>')+'</h1>'
      + '<div class="when">'+fmtDate(ride.started_at)+(ride.plan_id ? ' · <span class="tag plan" style="margin-left:0">Plan session</span>' : '')+'</div>'+(opts.justSaved ? '' : pbHtml)+'</div>'
      + '<div class="d-actions"><button data-tcx="'+ride.id+'">Export TCX</button>'
      + (ride.strava_uploaded_at ? '<button disabled style="opacity:.7; cursor:default;">On Strava ✓</button>' : '<button data-strava="'+ride.id+'">Upload to Strava</button>')
      + '</div></div>';
    html += '<div class="d-stats">'
      + stat(fmtDur(ride.duration_sec),'Duration') + stat(ride.tss,'TSS')
      + stat(ride.intensity_factor!=null ? Number(ride.intensity_factor).toFixed(2) : null,'IF')
      + stat(ride.np,'NP (W)') + stat(ride.avg_power,'Avg power') + stat(kj,'Work (kJ)')
      + stat(ride.avg_hr,'Avg HR') + stat(ride.max_hr,'Max HR') + stat(ride.avg_cadence,'Cadence')
      + '</div>';
    html += '<div id="feelCard">'+feelCardHtml(ride, opts.justSaved)+'</div>';

    if (!sec.length){
      html += '<div class="panel empty-note">No second-by-second data was recorded for this ride.</div>';
      el.innerHTML = html; return;
    }
    html += '<div class="panel"><div class="panel-title"><span>Ride</span><span class="chart-legend"><span><i style="background:#45D6C4"></i>Power</span><span><i style="background:#E5484D"></i>Heart rate</span><span><i style="background:var(--z-threshold); opacity:.7"></i>Target (zone colour)</span></span></div>'
      + '<div class="chart-wrap"><canvas id="rideChart"></canvas><div class="tip" id="rideTip"></div></div></div>';

    // power curve + time in zone
    const bests = bestEfforts(sec);
    const key = [5,60,300,1200].map(d=> bests.find(b=>b.d===d)).filter(Boolean);
    let zoneHtml = '<div class="empty-note">Needs NP and IF to work out your zones.</div>';
    if (ftp){
      const tz = new Array(ZONES.length).fill(0);
      sec.forEach(x=>{ if (x.power > 0) tz[zoneIdx(x.power/ftp*100)]++; });
      const tot = tz.reduce((a,c)=>a+c,0) || 1, mx = Math.max(...tz) || 1;
      zoneHtml = ZONES.map((z,i)=>'<div class="zone-row"><span class="zn"><i style="background:'+z.color+'"></i>'+z.name+'</span>'
        + '<span class="track"><i style="width:'+(tz[i]/mx*100).toFixed(1)+'%; background:'+z.color+'"></i></span>'
        + '<span class="v"><b>'+fmtHm(tz[i])+'</b> '+Math.round(tz[i]/tot*100)+'%</span></div>').join('')
        + '<div class="empty-note" style="font-size:11.5px; margin-top:6px;">Zones from your FTP at the time ('+Math.round(ftp)+' W).</div>';
    }
    html += '<div class="two"><div class="panel"><div class="panel-title"><span>Best efforts</span></div>'
      + '<div class="chart-wrap"><canvas id="curveChart"></canvas><div class="tip" id="curveTip"></div></div>'
      + '<div class="bests">'+key.map(b=>'<div class="best"><b>'+b.w+'</b><span>'+durLabel(b.d)+'</span></div>').join('')+'</div></div>'
      + '<div class="panel"><div class="panel-title"><span>Time in zone</span></div>'+zoneHtml+'</div></div>';

    // intervals: one row per workout step that lasted 10 s or more
    const laps = [];
    sec.forEach(x=>{
      const last = laps[laps.length-1];
      if (!last || last.stepIdx !== x.stepIdx) laps.push({ stepIdx:x.stepIdx, pts:[x] }); else last.pts.push(x);
    });
    const steps = w && w.steps ? flattenSteps(w.steps) : [];
    const rows = laps.filter(l=>l.pts.length >= 10).map((l,i)=>{
      const avg = k => { const v = l.pts.map(x=>x[k]).filter(v=>v!=null && v>0); return v.length ? Math.round(v.reduce((a,c)=>a+c,0)/v.length) : null; };
      const pw = avg('power'), tg = avg('target'), hr = avg('hr'), cad = avg('cadence');
      const name = (steps[l.stepIdx] && steps[l.stepIdx].note) || (l.stepIdx!=null && l.stepIdx>=0 ? 'Step '+(l.stepIdx+1) : 'Free ride');
      const hitPct = (pw && tg) ? Math.round(pw/tg*100) : null;
      return '<tr><td><i style="background:'+(tg && ftp ? zoneColor(tg/ftp*100) : 'var(--text-dim)')+'"></i>'+escapeHtml(name)+'</td><td>'+fmtDur(l.pts.length)+'</td><td>'+(tg ?? '—')+'</td><td>'+(pw ?? '—')+'</td>'
        + '<td class="'+(hitPct==null ? '' : Math.abs(hitPct-100) <= 5 ? 'hit' : 'miss')+'">'+(hitPct!=null ? hitPct+'%' : '—')+'</td><td class="opt">'+(hr ?? '—')+'</td><td class="opt">'+(cad ?? '—')+'</td></tr>';
    });
    if (rows.length > 1){
      html += '<div class="panel"><div class="panel-title"><span>Intervals</span></div><div class="laps-wrap"><table class="laps"><thead><tr><th>Step</th><th>Time</th><th>Target W</th><th>Avg W</th><th>Of target</th><th class="opt">HR</th><th class="opt">Cad</th></tr></thead><tbody>'
        + rows.join('') + '</tbody></table></div></div>';
    }
    el.innerHTML = html;
    countUp(el);
    drawRideChart();
    drawCurve(bests);
    if (opts.justSaved) offerNewFtp(ride);
    if (opts.justSaved){
      // auto-upload to Strava if connected — this is what "connecting Strava" is actually for
      try {
        const { data: conn } = await supabase.from('strava_connections').select('connected_at').eq('user_id', user.id).maybeSingle();
        const stravaBtn = el.querySelector('[data-strava="'+ride.id+'"]');
        if (conn && stravaBtn) uploadRideToStrava(ride, stravaBtn, true);
      } catch(e){ /* best effort — the manual button is still right there either way */ }
    }
  }
  // A ride that beats what your FTP says you can do gets a one-tap update (Today shows it too).
  async function offerNewFtp(ride){
    try {
      const [{ data: f }, { data: d }] = await Promise.all([
        supabase.from('settings').select('value').eq('key','ftp').eq('user_id', user.id).maybeSingle(),
        supabase.from('settings').select('value').eq('key','ftp_suggestion_dismissed').eq('user_id', user.id).maybeSingle()
      ]);
      const cur = f && f.value && f.value.v, dismissed = d && d.value && d.value.v;
      const est = estimateFtp(rides.map(r=> r.id===ride.id ? Object.assign({}, r, { power_bests: ride.power_bests }) : r));
      const el = document.getElementById('ftpNote');
      if (!el || !shouldSuggest(est, cur, dismissed) || est.rideId !== ride.id) return;
      el.innerHTML = '<div class="saved-note ftp-note"><div><b>New FTP spotted: '+est.ftp+' W.</b> From '+est.basis+' on this ride. Your FTP is '+Math.round(cur)+' W.</div>'
        + '<div class="ftp-btns"><button class="primary" data-ftp-yes>Update to '+est.ftp+' W</button><button data-ftp-no>Not now</button></div></div>';
      el.querySelector('[data-ftp-yes]').onclick = async (e)=>{
        e.target.disabled = true;
        const { error } = await supabase.from('settings').upsert({ user_id:user.id, key:'ftp', value:{ v:est.ftp }, updated_at:new Date().toISOString() }, { onConflict:'user_id,key' });
        if (error){ e.target.disabled = false; notify('Check your connection and try again.', 'Couldn\'t update your FTP'); return; }
        try { localStorage.setItem('tc_ftp_' + user.id, String(est.ftp)); } catch(_){}
        el.innerHTML = '<div class="saved-note"><b>✓ FTP updated to '+est.ftp+' W.</b> Your next workouts will use it.</div>';
      };
      el.querySelector('[data-ftp-no]').onclick = async ()=>{
        el.innerHTML = '';
        try { await supabase.from('settings').upsert({ user_id:user.id, key:'ftp_suggestion_dismissed', value:{ v:est.ftp }, updated_at:new Date().toISOString() }, { onConflict:'user_id,key' }); } catch(_){}
      };
    } catch(e){ /* a bonus, never block the ride page */ }
  }

  // ---- "How did it feel?" + what the ride did to your progression level ----
  function feelCardHtml(ride, prompt){
    const w = workoutFor(ride);
    const rideFtp = (ride.np && ride.intensity_factor) ? ride.np / ride.intensity_factor : null;
    const wl = w ? workoutLevel(w, rideFtp) : null;
    const { byRide } = computeLevels(rides.filter(x => !isRun(x) && x.source !== 'strava'), workoutFor, rideFtp);
    const change = byRide[ride.id];
    const asked = ride.feel != null;
    if (!wl && asked && !prompt) return '';
    let out = '<div class="panel feel-card">';
    out += '<div class="feel-top"><div><div class="panel-title" style="margin-bottom:4px;"><span>'+(asked ? 'How it felt' : 'How did that feel?')+'</span></div>';
    if (wl){
      const z = zoneInfo(wl.zone);
      out += '<div class="feel-wl"><span class="lvl-chip" style="--zc:'+z.color+'">'+z.name+' '+fmtLevel(wl.level)+'</span> workout</div>';
    }
    out += '</div>';
    if (change){
      const z = zoneInfo(change.zone);
      const up = change.after - change.before;
      out += '<div class="feel-result">'+(!ride.completed
        ? '<span class="dim">Partial rides don\'t change your '+z.name+' level ('+fmtLevel(change.before)+').</span>'
        : up > 0.05
          ? z.name+' level <b>'+fmtLevel(change.before)+' → '+fmtLevel(change.after)+'</b> <span class="up">+'+up.toFixed(1)+'</span>'
          : '<span class="dim">'+z.name+' level stays at <b>'+fmtLevel(change.after)+'</b>.</span>')+'</div>';
    }
    out += '</div><div class="feel-opts" role="group" aria-label="How did it feel?">'
      + FEEL_OPTIONS.map(o=>'<button type="button" data-feel="'+o.v+'" class="'+(ride.feel===o.v ? 'on' : '')+'"><b>'+o.label+'</b><span>'+o.hint+'</span></button>').join('')
      + '</div>';
    if (!asked && wl && ride.completed) out += '<div class="feel-note">Your answer tunes how much this ride moves your level. Easy rides move it more, all-out ones less.</div>';
    return out + '</div>';
  }

  function setupCanvas(canvas){
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return { ctx, W, H };
  }

  // Power (and HR) over the zone-coloured target profile, with a hover/tap readout.
  function drawRideChart(hover){
    const canvas = document.getElementById('rideChart');
    if (!canvas || !current) return;
    const { ctx, W, H } = setupCanvas(canvas);
    const { sec, ftp } = current, n = sec.length;
    const maxP = Math.max(100, ...sec.map(x=>Math.max(x.power||0, x.target||0))) * 1.12;
    const maxHr = Math.max(60, ...sec.map(x=>x.hr||0)) * 1.1;
    const xAt = i => i/Math.max(1,n-1)*W;
    // smooth the power line a little (5 s) so it reads as a trace, not noise; the stats use raw data
    const sm = sec.map((x,i)=>{ let a=0,c=0; for (let j=Math.max(0,i-2); j<=Math.min(n-1,i+2); j++){ a+=sec[j].power||0; c++; } return a/c; });
    if (ftp){
      const bw = W/Math.max(1,n-1)+1;
      sec.forEach((x,i)=>{ if (!x.target) return; const h = Math.min(H, x.target/maxP*H);
        ctx.fillStyle = zoneRGBA(x.target/ftp*100, .38); ctx.fillRect(xAt(i), H-h, bw, h); });
    }
    function path(vals, max, color, lw){
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round';
      let started = false;
      vals.forEach((v,i)=>{ if (v==null){ started = false; return; } const y = H - v/max*H; if (!started){ ctx.moveTo(xAt(i), y); started = true; } else ctx.lineTo(xAt(i), y); });
      ctx.stroke();
    }
    if (sec.some(x=>x.hr)) path(sec.map(x=>x.hr||null), maxHr, '#E5484D', 1.5);
    path(sm, maxP, '#45D6C4', 2);
    if (hover != null){
      const x = xAt(hover);
      ctx.strokeStyle = 'rgba(231,236,242,.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.round(x)+.5, 0); ctx.lineTo(Math.round(x)+.5, H); ctx.stroke();
    }
  }
  function attachTip(canvasId, tipId, onIndex, count){
    const canvas = document.getElementById(canvasId), tip = document.getElementById(tipId);
    if (!canvas) return;
    function show(clientX){
      const r = canvas.getBoundingClientRect();
      const n = count();
      const i = Math.max(0, Math.min(n-1, Math.round((clientX - r.left)/r.width*(n-1))));
      tip.innerHTML = onIndex(i);
      tip.style.display = 'block';
      const x = (i/Math.max(1,n-1))*r.width;
      tip.style.left = (x + 12 + tip.offsetWidth > r.width ? Math.max(0, x - tip.offsetWidth - 12) : x + 12) + 'px';
    }
    canvas.addEventListener('pointermove', e=>show(e.clientX));
    canvas.addEventListener('pointerdown', e=>show(e.clientX));
    canvas.addEventListener('pointerleave', ()=>{ tip.style.display = 'none'; onIndex(null); });
  }

  // Best average power for each duration, log-scaled time axis.
  let curvePts = [];
  function drawCurve(bests, hover){
    const canvas = document.getElementById('curveChart');
    if (!canvas) return;
    if (bests) curvePts = bests;
    const { ctx, W, H } = setupCanvas(canvas);
    if (curvePts.length < 2) return;
    const pad = { l:36, r:8, t:8, b:20 };
    const maxW = Math.ceil(Math.max(...curvePts.map(p=>p.w)) * 1.1 / 50) * 50;
    const lx = d => Math.log(d), x0 = lx(curvePts[0].d), x1 = lx(curvePts[curvePts.length-1].d);
    const X = d => pad.l + (lx(d)-x0)/(x1-x0||1)*(W-pad.l-pad.r);
    const Y = w => pad.t + (1 - w/maxW)*(H-pad.t-pad.b);
    ctx.font = '11px '+getComputedStyle(document.body).getPropertyValue('--mono'); ctx.fillStyle = '#8C97A6';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const step = maxW > 600 ? 200 : 100;
    for (let w=0; w<=maxW; w+=step){ ctx.strokeStyle = '#2A323D'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad.l, Math.round(Y(w))+.5); ctx.lineTo(W-pad.r, Math.round(Y(w))+.5); ctx.stroke(); ctx.fillText(String(w), pad.l-6, Y(w)); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    [5,30,60,300,1200,3600].filter(d=>d>=curvePts[0].d && d<=curvePts[curvePts.length-1].d).forEach(d=> ctx.fillText(durLabel(d).replace(' ',''), X(d), H-pad.b+5));
    if (current && current.ftp){
      ctx.setLineDash([4,4]); ctx.strokeStyle = 'rgba(232,185,61,.7)';
      ctx.beginPath(); ctx.moveTo(pad.l, Y(current.ftp)); ctx.lineTo(W-pad.r, Y(current.ftp)); ctx.stroke(); ctx.setLineDash([]);
      ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#E8B93D'; ctx.fillText('FTP', W-pad.r, Y(current.ftp)-2);
    }
    ctx.strokeStyle = '#45D6C4'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath(); curvePts.forEach((p,i)=>{ i ? ctx.lineTo(X(p.d), Y(p.w)) : ctx.moveTo(X(p.d), Y(p.w)); }); ctx.stroke();
    curvePts.forEach((p,i)=>{ ctx.fillStyle = '#45D6C4'; ctx.strokeStyle = '#171D25'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(p.d), Y(p.w), i===hover ? 5 : 3, 0, Math.PI*2); ctx.fill(); ctx.stroke(); });
  }

  // tooltips are wired once; they read whatever ride is current
  const detailObserver = new MutationObserver(()=>{
    if (!current) return;
    attachTip('rideChart', 'rideTip', i=>{
      if (i==null){ drawRideChart(); return ''; }
      const x = current.sec[i]; drawRideChart(i);
      return '<div class="d">'+fmtDur(i)+'</div>'+Math.round(x.power||0)+' W'+(x.target ? ' / '+x.target+' target' : '')+(x.hr ? '<br>'+Math.round(x.hr)+' bpm' : '')+(x.cadence ? '<br>'+Math.round(x.cadence)+' rpm' : '');
    }, ()=>current.sec.length);
    attachTip('curveChart', 'curveTip', i=>{
      if (i==null){ drawCurve(null); return ''; }
      const p = curvePts[i]; drawCurve(null, i);
      return '<div class="d">Best '+durLabel(p.d)+'</div>'+p.w+' W'+(current.ftp ? ' · '+Math.round(p.w/current.ftp*100)+'% FTP' : '');
    }, ()=>curvePts.length);

  // ---- TCX export ----
  function buildTcx(ride){
    const start = new Date(ride.started_at);
    const samples = ride.samples || [];

    // Group consecutive samples into laps whenever the step changes, so each interval in the
    // planned workout becomes its own lap on Strava's activity page (warm-up, each effort, each
    // recovery, etc.) instead of the whole ride showing as one undifferentiated block - this is
    // what actually lets Strava's own laps table show the workout structure.
    const laps = [];
    let current = null;
    samples.forEach(s=>{
      const stepIdx = s.stepIdx != null ? s.stepIdx : 0;
      if (!current || current.stepIdx !== stepIdx){
        current = { stepIdx, samples: [] };
        laps.push(current);
      }
      current.samples.push(s);
    });
    if (!laps.length) laps.push({ stepIdx: 0, samples: [] });

    const lapXml = laps.map(lap=>{
      const lapStartElapsed = lap.samples.length ? Number(lap.samples[0].elapsed)||0 : 0;
      const lapStartTime = new Date(start.getTime() + lapStartElapsed*1000).toISOString();
      const lapDurSec = lap.samples.length
        ? Math.max(1, (Number(lap.samples[lap.samples.length-1].elapsed)||0) - lapStartElapsed + 1)
        : 0;
      const trackpoints = lap.samples.map(s=>{
        const t = new Date(start.getTime() + (Number(s.elapsed)||0)*1000).toISOString();
        let tp = '<Trackpoint><Time>'+t+'</Time>';
        if (s.hr !== '' && s.hr != null) tp += '<HeartRateBpm><Value>'+Math.round(Number(s.hr))+'</Value></HeartRateBpm>';
        if (s.cadence !== '' && s.cadence != null) tp += '<Cadence>'+Math.round(Number(s.cadence))+'</Cadence>';
        if (s.power !== '' && s.power != null) tp += '<Extensions><ns3:TPX xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2"><ns3:Watts>'+Math.round(Number(s.power))+'</ns3:Watts></ns3:TPX></Extensions>';
        tp += '</Trackpoint>';
        return tp;
      }).join('');

      return '<Lap StartTime="'+lapStartTime+'">\n'
        + '<TotalTimeSeconds>'+lapDurSec+'</TotalTimeSeconds>\n'
        + '<DistanceMeters>0</DistanceMeters>\n'
        + '<Calories>0</Calories>\n'
        + '<Intensity>Active</Intensity>\n'
        + '<TriggerMethod>Manual</TriggerMethod>\n'
        + '<Track>'+trackpoints+'</Track>\n'
        + '</Lap>\n';
    }).join('');

    return '<?xml version="1.0" encoding="UTF-8"?>\n'
      + '<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n'
      + '<Activities><Activity Sport="Biking">\n'
      + '<Id>'+start.toISOString()+'</Id>\n'
      + lapXml
      + '<Creator xsi:type="Device_t"><Name>TrainerCycle</Name></Creator>\n'
      + '</Activity></Activities>\n'
      + '</TrainingCenterDatabase>';
  }

  // ---- Strava upload (connection itself is managed on the Settings page) ----
  async function uploadRideToStrava(ride, btn, silent){
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    try {
      const xml = buildTcx(ride);
      const { data, error } = await supabase.functions.invoke('strava-upload', {
        body: { tcx: xml, name: ride.workout_name + ' (via TrainerCycle)' }
      });
      if (error || (data && data.error)){
        btn.textContent = 'Failed';
        if (!silent){
          // On a non-2xx reply supabase-js gives us the raw Response in error.context - read Strava's reason from it.
          let body = data;
          try { if (!body && error && error.context && typeof error.context.json === 'function') body = await error.context.json(); } catch(_){}
          const errObj = body && body.error;
          const errText = errObj ? (typeof errObj === 'string' ? errObj : JSON.stringify(errObj)) : '';
          const appInactive = /"code":"Inactive"/.test(errText);
          const needsReconnect = /Authorization Error|activity:write/i.test(errText);
          let msg;
          if (errText === 'Strava not connected') msg = 'Connect Strava first from the Settings page.';
          else if (appInactive) msg = 'Strava is currently blocking uploads from TrainerCycle (this is on our side of the Strava connection, not your account). Your ride is saved. Please try again later - we are sorting it out.';
          else if (needsReconnect) msg = 'Strava didn\'t allow the upload. Go to Settings, press Disconnect under Strava, then Connect again and keep "Upload your activities" ticked. If you have more than one Strava account, make sure you are logged in to the right one.';
          else msg = 'Strava upload failed: ' + (errText || (error ? error.message : 'unknown error'));
          notify(msg, 'Strava upload failed');
        }
        setTimeout(()=>{ btn.disabled = false; btn.textContent = original; }, 3000);
      } else {
        const uploadedAt = new Date().toISOString();
        ride.strava_uploaded_at = uploadedAt;
        try { await supabase.from('completed_rides').update({ strava_uploaded_at: uploadedAt }).eq('id', ride.id); } catch(e){ /* non-fatal - button still shows uploaded for this session */ }
        btn.textContent = 'On Strava ✓';
        const row = rides.find(r=>r.id===ride.id); if (row) row.strava_uploaded_at = uploadedAt;
        btn.style.opacity = '.7';
        btn.style.cursor = 'default';
        btn.removeAttribute('data-strava');
      }
    } catch(err){
      btn.textContent = 'Failed';
      if (!silent) notify(err.message, 'Strava upload failed');
      setTimeout(()=>{ btn.disabled = false; btn.textContent = original; }, 3000);
    }
  }
  document.getElementById('detailView').addEventListener('click', async (e)=>{
    const id = e.target.dataset.strava;
    if (!id) return;
    const ride = detailCache[id];
    if (!ride) return;
    uploadRideToStrava(ride, e.target, false);
  });

  // ---- sidebar drawer (overlay on all screen sizes) ----
  const appRoot = document.querySelector('.app');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  function applyCollapsed(collapsed){
    appRoot.classList.toggle('sidebar-collapsed', collapsed);
    sidebarToggle.innerHTML = collapsed ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  }
  sidebarToggle.addEventListener('click', ()=> applyCollapsed(!appRoot.classList.contains('sidebar-collapsed')));
  sidebarBackdrop.addEventListener('click', ()=> applyCollapsed(true));

  // ---- fullscreen toggle (not needed when already running as an installed app) ----
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  if (!document.documentElement.classList.contains('standalone')){
    fullscreenToggle.addEventListener('click', ()=>{
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    });
    document.addEventListener('fullscreenchange', ()=>{
      fullscreenToggle.innerHTML = document.fullscreenElement ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    });
  }

  loadRides();
})();
</script>
</body>
</html>
