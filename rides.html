<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TrainerCycle — Rides</title>
<script>if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true)document.documentElement.classList.add('standalone');</script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141A">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}</script>
<style>
  :root{
    --bg: #10141A; --panel: #171D25; --panel-2: #1D242D; --line: #2A323D;
    --text: #E7ECF2; --text-dim: #8C97A6; --accent: #45D6C4; --danger: #E5484D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --z-recovery:#5A6472; --z-endurance:#4C8BF5; --z-tempo:#3DBE7A; --z-threshold:#E8B93D;
    --z-vo2:#F08A3C; --z-anaerobic:#E5484D; --z-neuro:#B14AED;
  }
  *{box-sizing:border-box;}

  .page-banner{
    height:260px; border-radius:10px; margin-bottom:20px; background-size:cover; background-position:center 40%;
    position:relative; overflow:hidden;
  }
  @media (max-width:600px){ .page-banner{ height:180px; } }
  .page-banner::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,13,17,0) 0%, rgba(10,13,17,0) 65%, var(--bg) 100%);
  }

  :root{ --topbar-h: calc(80px + env(safe-area-inset-top, 0px)); }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; }
  .app{ position:relative; min-height:100vh; }
  .sidebar{
    position:fixed; top:var(--topbar-h); left:0; bottom:0; width:340px; max-width:85vw;
    background:var(--panel); border-right:1px solid var(--line);
    padding:20px; overflow-y:auto; z-index:60;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar{ transform:translateX(0); }
  .sidebar-backdrop{
    position:fixed; top:var(--topbar-h); left:0; right:0; bottom:0; background:rgba(0,0,0,.5);
    z-index:55; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar-backdrop{ opacity:1; pointer-events:auto; }
  .main{ padding:calc(96px + env(safe-area-inset-top, 0px)) 28px 24px; max-width:min(1700px, 97vw); margin:0 auto; }
  .top-bar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:50;
    display:flex; align-items:center; padding:0 14px; padding-top:env(safe-area-inset-top, 0px);
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .icon-btn{
    width:38px; height:38px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  html.standalone #fullscreenToggle{ display:none; }
  .top-bar-logo-link{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; }
  .top-logo{ height:60px; width:auto; border-radius:8px; display:block; }
  .top-bar-spacer{ flex:1; }

  .sub{ color:var(--text-dim); font-size:12.5px; margin:2px 0 20px; }
  .block{ margin-bottom:24px; }
  .block-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .page-nav{ display:flex; flex-direction:column; gap:2px; }
  .page-nav a{ padding:10px 10px; border-radius:6px; color:var(--text-dim); text-decoration:none; font-size:16px; }
  .page-nav a:hover{ background:var(--panel-2); color:var(--text); }
  .page-nav a.active{ background:var(--panel-2); color:var(--accent); font-weight:600; }

  select{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:7px 9px; font-size:13px; width:100%; }
  button{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:#08211E; border-color:var(--accent); font-weight:600; }

  .ride-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .ride-card.ride-just-saved{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .ride-card.ride-just-saved::before{ content:"✓ Ride saved"; display:block; color:var(--accent); font-size:12px; font-weight:600; margin-bottom:8px; }
  .ride-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .ride-name{ font-size:16px; font-weight:600; }
  .ride-date{ font-size:12px; color:var(--text-dim); font-family:var(--mono); margin-top:2px; }
  .ride-tag{ display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--accent); margin-left:6px; }
  .ride-tag.partial{ color:var(--text-dim); }
  .ride-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  @media (max-width:480px){ .ride-stats{ grid-template-columns:repeat(2,1fr); } }
  .ride-stat{ background:var(--panel-2); border-radius:6px; padding:8px; text-align:center; }
  .ride-stat .val{ font-family:var(--mono); font-size:16px; font-weight:600; }
  .ride-stat .lbl{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .empty-note{ color:var(--text-dim); font-size:13px; }
  .filters{ display:flex; gap:8px; margin-bottom:18px; }
  .ride-chart-wrap{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .chart-legend{ display:flex; gap:16px; font-size:11.5px; color:var(--text-dim); margin-bottom:8px; }
  .chart-legend span{ display:flex; align-items:center; gap:5px; }
  .chart-legend i{ display:inline-block; width:12px; height:3px; border-radius:2px; }
  #ridesList canvas{ width:100%; height:150px; display:block; }
  .filters select{ max-width:200px; }
</style>
</head>
<body>
<div class="top-bar">
  <button class="icon-btn" id="sidebarToggle" aria-label="Toggle menu">☰</button>
  <a href="index.html" class="top-bar-logo-link" aria-label="TrainerCycle home"><img src="wordmark.svg" class="top-logo" alt="TrainerCycle"></a>
  <div class="top-bar-spacer"></div>
  <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">⛶</button>
</div>

<div class="app sidebar-collapsed">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar">
    <p class="sub" style="margin-top:0;">Completed Rides</p>

    <div class="block">
      <div class="block-title">Navigate</div>
      <nav class="page-nav">
        <a href="index.html">Home</a>
        <a href="plans.html">Training Plans</a>
        <a href="builder.html">Workouts</a>
        <a href="live.html">Live Ride</a>
        <a href="trainerstrength.html">TrainerStrength</a>
        <a href="rides.html" class="active">Rides</a>
        <a href="settings.html">Settings</a>
        <a href="help.html">How to Use</a>
      </nav>
    </div>
  </div>

  <div class="main">
    <div class="page-banner" style="background-image:url('banner-rides.jpg');"></div>
    <div class="filters">
      <select id="filterCompleted">
        <option value="">All rides</option>
        <option value="completed">Completed only</option>
        <option value="partial">Partial only</option>
      </select>
    </div>
    <div id="ridesList"><div class="empty-note">Loading…</div></div>
  </div>
</div>

<script type="module">
import { createSupabaseClient, requireAuth, renderSidebarUserBadge, requireSubscription } from './auth.js?v=5';
const supabase = createSupabaseClient();

(async function(){
  const user = await requireAuth(supabase);
  renderSidebarUserBadge(supabase, user, document.querySelector('.sidebar'));
  await requireSubscription(supabase, user);
  let rides = [];

  function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    return h>0 ? (h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')) : (m+':'+String(s).padStart(2,'0'));
  }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function loadRides(){
    try {
      const { data, error } = await supabase.from('completed_rides').select('*').order('started_at',{ascending:false}).limit(100);
      if (error) throw error;
      rides = data || [];
    } catch(e){ rides = []; }
    render();

    const summaryId = new URLSearchParams(window.location.search).get('summary');
    if (summaryId && rides.find(r=>r.id===summaryId)){
      const wrap = document.getElementById('chartwrap-'+summaryId);
      const card = document.getElementById('ridecard-'+summaryId);
      if (wrap) wrap.style.display = 'block';
      if (card){
        card.classList.add('ride-just-saved');
        card.scrollIntoView({ behavior:'smooth', block:'start' });
      }
      const ride = rides.find(r=>r.id===summaryId);
      if (ride) drawRideChart(ride);
      window.history.replaceState({}, '', window.location.pathname);

      // auto-upload to Strava if connected — this is what "connecting Strava" is actually for
      try {
        const { data: conn } = await supabase.from('strava_connections').select('connected_at').eq('user_id', user.id).maybeSingle();
        const stravaBtn = document.querySelector('[data-strava="'+summaryId+'"]');
        if (conn && stravaBtn) uploadRideToStrava(ride, stravaBtn, true);
      } catch(e){ /* best effort — the manual button is still right there either way */ }
    }
  }

  function render(){
    const el = document.getElementById('ridesList');
    if (!rides.length){ el.innerHTML = '<div class="empty-note">No completed rides yet — finish a session on the Live Ride page and it\'ll show up here.</div>'; return; }

    const filterVal = document.getElementById('filterCompleted').value;
    let items = rides;
    if (filterVal==='completed') items = items.filter(r=>r.completed);
    if (filterVal==='partial') items = items.filter(r=>!r.completed);

    if (!items.length){ el.innerHTML = '<div class="empty-note">No rides match this filter.</div>'; return; }

    el.innerHTML = items.map(r=>{
      return '<div class="ride-card" id="ridecard-'+r.id+'">'
        + '<div class="ride-top"><div>'
        + '<div class="ride-name">'+escapeHtml(r.workout_name)
        + '<span class="ride-tag'+(r.completed?'':' partial')+'">'+(r.completed?'Completed':'Partial')+'</span>'
        + '</div><div class="ride-date">'+fmtDate(r.started_at)+'</div>'
        + '</div><div style="display:flex; gap:6px;"><button data-details="'+r.id+'">View chart</button><button data-tcx="'+r.id+'">Export TCX</button><button data-strava="'+r.id+'">Upload to Strava</button></div></div>'
        + '<div class="ride-stats">'
        + '<div class="ride-stat"><div class="val">'+fmtDur(r.duration_sec)+'</div><div class="lbl">Duration</div></div>'
        + '<div class="ride-stat"><div class="val">'+(r.avg_power ?? '—')+'</div><div class="lbl">Avg Power</div></div>'
        + '<div class="ride-stat"><div class="val">'+(r.np ?? '—')+'</div><div class="lbl">NP</div></div>'
        + '<div class="ride-stat"><div class="val">'+(r.intensity_factor!=null ? Number(r.intensity_factor).toFixed(2) : '—')+'</div><div class="lbl">IF</div></div>'
        + '<div class="ride-stat"><div class="val">'+(r.avg_hr ?? '—')+'</div><div class="lbl">Avg HR</div></div>'
        + '<div class="ride-stat"><div class="val">'+(r.avg_cadence ?? '—')+'</div><div class="lbl">Avg Cadence</div></div>'
        + '</div>'
        + '<div class="ride-chart-wrap" id="chartwrap-'+r.id+'" style="display:none;">'
        + '<div class="chart-legend"><span><i style="background:#45D6C4"></i>Power</span><span><i style="background:#E5484D"></i>Heart rate</span><span><i style="background:var(--z-threshold); opacity:.75;"></i>Target intensity zone</span></div>'
        + '<canvas id="chart-'+r.id+'" width="760" height="150"></canvas>'
        + '</div>'
        + '</div>';
    }).join('');
  }
  document.getElementById('filterCompleted').addEventListener('change', render);

  // Keeps a canvas's actual pixel buffer in sync with its rendered CSS width.
  function fitCanvasWidth(canvas){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const displayWidth = Math.round(rect.width);
    const displayHeight = Math.round(rect.height);
    const bufferWidth = Math.round(displayWidth * dpr);
    const bufferHeight = Math.round(displayHeight * dpr);
    if (displayWidth > 0 && canvas.width !== bufferWidth) canvas.width = bufferWidth;
    if (displayHeight > 0 && canvas.height !== bufferHeight) canvas.height = bufferHeight;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const ZONES = [
    {max:60,color:'var(--z-recovery)'},{max:76,color:'var(--z-endurance)'},{max:91,color:'var(--z-tempo)'},
    {max:106,color:'var(--z-threshold)'},{max:121,color:'var(--z-vo2)'},{max:151,color:'var(--z-anaerobic)'},
    {max:Infinity,color:'var(--z-neuro)'}
  ];
  function zoneColor(pct){ if(pct==null) return 'var(--text-dim)'; for(const z of ZONES) if(pct<z.max) return z.color; return ZONES[ZONES.length-1].color; }
  function zoneColorRGBA(pct, alpha){
    const map = {
      'var(--z-recovery)':'90,100,114', 'var(--z-endurance)':'76,139,245', 'var(--z-tempo)':'61,190,122',
      'var(--z-threshold)':'232,185,61', 'var(--z-vo2)':'240,138,60', 'var(--z-anaerobic)':'229,72,77',
      'var(--z-neuro)':'177,74,237', 'var(--text-dim)':'140,151,166'
    };
    const rgb = map[zoneColor(pct)] || '140,151,166';
    return 'rgba('+rgb+','+alpha+')';
  }

  function drawRideChart(ride){
    const canvas = document.getElementById('chart-'+ride.id);
    if (!canvas) return;
    fitCanvasWidth(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    const samples = ride.samples || [];
    if (!samples.length) return;
    const n = samples.length;
    const maxPower = Math.max(50, ...samples.map(s=>Number(s.power)||0), ...samples.map(s=>Number(s.target)||0)) * 1.15;
    const maxHr = Math.max(60, ...samples.map(s=>Number(s.hr)||0)) * 1.1;
    const xAt = i => (i/Math.max(1,n-1))*w;

    // Historical FTP at the time of this ride, backed out from NP/IF (rather than today's FTP),
    // so the zone coloring reflects what was actually true when the ride happened.
    const histFtp = (ride.np && ride.intensity_factor) ? (ride.np / ride.intensity_factor) : null;

    // Colored zone-intensity background (skyline profile), same technique as Live Ride's overview chart,
    // using each sample's own target power to classify + size each sliver.
    if (histFtp){
      samples.forEach((s,i)=>{
        const tgt = Number(s.target);
        if (!tgt) return;
        const pct = (tgt/histFtp)*100;
        const barH = Math.max(h*0.06, Math.min(h*0.95, (pct/160)*h));
        ctx.fillStyle = zoneColorRGBA(pct, 0.75);
        const x = xAt(i);
        const segW = w/Math.max(1,n-1) + 1;
        ctx.fillRect(x, h-barH, segW, barH);
      });
    }

    function line(getVal, max, color, outline){
      [ {c: outline, lw: 4}, {c: color, lw: 2} ].forEach(pass=>{
        ctx.beginPath(); ctx.strokeStyle = pass.c; ctx.lineWidth = pass.lw; ctx.setLineDash([]);
        samples.forEach((s,i)=>{
          const v = Number(getVal(s))||0;
          const y = h - (v/max)*h;
          if (i===0) ctx.moveTo(xAt(i), y); else ctx.lineTo(xAt(i), y);
        });
        ctx.stroke();
      });
    }
    line(s=>s.hr, maxHr, '#E5484D', 'rgba(255,255,255,0.6)');
    line(s=>s.power, maxPower, '#45D6C4', 'rgba(255,255,255,0.6)');
  }

  document.getElementById('ridesList').addEventListener('click', (e)=>{
    const detailsId = e.target.dataset.details;
    if (detailsId){
      const wrap = document.getElementById('chartwrap-'+detailsId);
      const showing = wrap.style.display !== 'none';
      wrap.style.display = showing ? 'none' : 'block';
      e.target.textContent = showing ? 'View chart' : 'Hide chart';
      if (!showing){
        const ride = rides.find(r=>r.id===detailsId);
        if (ride) drawRideChart(ride);
      }
      return;
    }
  });

  // ---- TCX export ----
  function buildTcx(ride){
    const start = new Date(ride.started_at);
    const trackpoints = (ride.samples||[]).map(s=>{
      const t = new Date(start.getTime() + (Number(s.elapsed)||0)*1000).toISOString();
      let tp = '<Trackpoint><Time>'+t+'</Time>';
      if (s.hr !== '' && s.hr != null) tp += '<HeartRateBpm><Value>'+Math.round(Number(s.hr))+'</Value></HeartRateBpm>';
      if (s.cadence !== '' && s.cadence != null) tp += '<Cadence>'+Math.round(Number(s.cadence))+'</Cadence>';
      if (s.power !== '' && s.power != null) tp += '<Extensions><ns3:TPX xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2"><ns3:Watts>'+Math.round(Number(s.power))+'</ns3:Watts></ns3:TPX></Extensions>';
      tp += '</Trackpoint>';
      return tp;
    }).join('');

    return '<?xml version="1.0" encoding="UTF-8"?>\n'
      + '<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n'
      + '<Activities><Activity Sport="Biking">\n'
      + '<Id>'+start.toISOString()+'</Id>\n'
      + '<Lap StartTime="'+start.toISOString()+'">\n'
      + '<TotalTimeSeconds>'+(ride.duration_sec||0)+'</TotalTimeSeconds>\n'
      + '<DistanceMeters>0</DistanceMeters>\n'
      + '<Calories>0</Calories>\n'
      + '<Intensity>Active</Intensity>\n'
      + '<TriggerMethod>Manual</TriggerMethod>\n'
      + '<Track>'+trackpoints+'</Track>\n'
      + '</Lap>\n'
      + '<Creator xsi:type="Device_t"><Name>TrainerCycle</Name></Creator>\n'
      + '</Activity></Activities>\n'
      + '</TrainingCenterDatabase>';
  }

  document.getElementById('ridesList').addEventListener('click', (e)=>{
    const id = e.target.dataset.tcx;
    if (!id) return;
    const ride = rides.find(r=>r.id===id);
    if (!ride) return;
    const xml = buildTcx(ride);
    const blob = new Blob([xml], {type:'application/vnd.garmin.tcx+xml'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const dateStr = new Date(ride.started_at).toISOString().slice(0,10);
    a.download = 'trainercycle-' + dateStr + '-' + ride.workout_name.replace(/[^a-z0-9]+/gi,'_') + '.tcx';
    a.click();
  });

  // ---- Strava upload (connection itself is managed on the Settings page) ----
  async function uploadRideToStrava(ride, btn, silent){
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    try {
      const xml = buildTcx(ride);
      const { data, error } = await supabase.functions.invoke('strava-upload', {
        body: { tcx: xml, name: ride.workout_name + ' (via TrainerCycle)' }
      });
      if (error || (data && data.error)){
        btn.textContent = 'Failed';
        if (!silent){
          const isNotConnected = data && data.error === 'Strava not connected';
          alert(isNotConnected ? 'Connect Strava first from the Settings page.' : ('Strava upload failed: ' + (data && data.error ? JSON.stringify(data.error) : (error ? error.message : 'unknown error'))));
        }
      } else {
        btn.textContent = 'Uploaded ✓';
      }
    } catch(err){
      btn.textContent = 'Failed';
      if (!silent) alert('Strava upload failed: ' + err.message);
    } finally {
      setTimeout(()=>{ btn.disabled = false; btn.textContent = original; }, 3000);
    }
  }
  document.getElementById('ridesList').addEventListener('click', async (e)=>{
    const id = e.target.dataset.strava;
    if (!id) return;
    const ride = rides.find(r=>r.id===id);
    if (!ride) return;
    uploadRideToStrava(ride, e.target, false);
  });

  // ---- sidebar drawer (overlay on all screen sizes) ----
  const appRoot = document.querySelector('.app');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  function applyCollapsed(collapsed){
    appRoot.classList.toggle('sidebar-collapsed', collapsed);
    sidebarToggle.textContent = collapsed ? '☰' : '✕';
  }
  sidebarToggle.addEventListener('click', ()=> applyCollapsed(!appRoot.classList.contains('sidebar-collapsed')));
  sidebarBackdrop.addEventListener('click', ()=> applyCollapsed(true));

  // ---- fullscreen toggle (not needed when already running as an installed app) ----
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  if (!document.documentElement.classList.contains('standalone')){
    fullscreenToggle.addEventListener('click', ()=>{
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    });
    document.addEventListener('fullscreenchange', ()=>{
      fullscreenToggle.textContent = document.fullscreenElement ? '⤢' : '⛶';
    });
  }

  loadRides();
})();
</script>
</body>
</html>
