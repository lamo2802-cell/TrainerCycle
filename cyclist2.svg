<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171D25"/>
      <stop offset="100%" stop-color="#10141A"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="62%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#1D242D"/>
      <stop offset="100%" stop-color="#10141A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" fill="url(#skyGrad)"/>
  <rect width="640" height="420" fill="url(#spotlight)"/>

  <!-- road -->
  <path d="M -20 400 L 250 250 L 660 250 L 660 420 Z" fill="#171D25"/>
  <line x1="250" y1="250" x2="660" y2="250" stroke="#2A323D" stroke-width="2"/>
  <g stroke="#45D6C4" stroke-width="4" opacity="0.4" stroke-linecap="round">
    <line x1="280" y1="300" x2="240" y2="300"/>
    <line x1="360" y1="300" x2="320" y2="300"/>
    <line x1="440" y1="300" x2="400" y2="300"/>
    <line x1="520" y1="300" x2="480" y2="300"/>
  </g>

  <!-- speed lines behind rider -->
  <g stroke="#45D6C4" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="60" y1="150" x2="150" y2="150"/>
    <line x1="40" y1="180" x2="160" y2="180"/>
    <line x1="55" y1="210" x2="145" y2="210"/>
    <line x1="70" y1="240" x2="140" y2="240"/>
  </g>

  <!-- rear wheel -->
  <circle cx="230" cy="330" r="62" fill="none" stroke="#2A323D" stroke-width="6"/>
  <circle cx="230" cy="330" r="62" fill="none" stroke="#45D6C4" stroke-width="3" stroke-dasharray="6 12" opacity="0.5"/>
  <!-- front wheel -->
  <circle cx="450" cy="330" r="62" fill="none" stroke="#2A323D" stroke-width="6"/>
  <circle cx="450" cy="330" r="62" fill="none" stroke="#45D6C4" stroke-width="3" stroke-dasharray="6 12" opacity="0.5"/>

  <!-- frame, leaned forward for a sprint feel -->
  <g stroke="#8C97A6" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="230" y1="330" x2="345" y2="220"/>
    <line x1="345" y1="220" x2="400" y2="330"/>
    <line x1="230" y1="330" x2="400" y2="330"/>
    <line x1="345" y1="220" x2="310" y2="330"/>
    <line x1="400" y1="330" x2="450" y2="330"/>
    <line x1="400" y1="330" x2="425" y2="225"/>
    <line x1="425" y1="225" x2="450" y2="330"/>
  </g>
  <line x1="310" y1="330" x2="322" y2="248" stroke="#8C97A6" stroke-width="7" stroke-linecap="round"/>
  <rect x="310" y="238" width="34" height="10" rx="5" fill="#8C97A6"/>
  <line x1="440" y1="205" x2="440" y2="228" stroke="#8C97A6" stroke-width="7" stroke-linecap="round"/>

  <!-- rider, standing sprint position -->
  <path d="M 322 250 L 300 300 L 320 330" stroke="#45D6C4" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M 322 250 L 375 195" stroke="#E7ECF2" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M 322 250 L 360 300 L 425 330" stroke="#45D6C4" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M 368 202 L 435 225" stroke="#E7ECF2" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="386" cy="180" r="21" fill="#E7ECF2"/>
  <path d="M 364 178 A 21 21 0 0 1 408 178 L 404 165 A 23 15 0 0 0 368 165 Z" fill="#45D6C4"/>

  <!-- ground shadow -->
  <ellipse cx="340" cy="392" rx="140" ry="10" fill="#000000" opacity="0.25"/>
</svg>
