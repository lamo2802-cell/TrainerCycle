<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — TrainerCycle</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#10141A">
<style>
  *{box-sizing:border-box;}
  :root{
    --bg: #10141A; --panel: #171D25; --panel-2: #1D242D; --line: #2A323D;
    --text: #E7ECF2; --text-dim: #8C97A6; --accent: #45D6C4;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --topbar-h: calc(80px + env(safe-area-inset-top, 0px));
  }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; }
  .top-bar{
    height:var(--topbar-h); display:flex; align-items:center; padding:0 14px; padding-top:env(safe-area-inset-top, 0px);
    background:var(--bg); border-bottom:1px solid var(--line); position:relative;
  }
  .top-logo{ height:60px; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .main{ padding:28px 24px; max-width:900px; margin:0 auto; }
  h1{ font-size:19px; margin:0 0 4px; }
  .sub{ color:var(--text-dim); font-size:12.5px; margin:0 0 24px; }
  .stats-grid{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:28px; }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; flex:1 1 200px; }
  .stat-val{ font-family:var(--mono); font-size:30px; font-weight:600; color:var(--accent); }
  .stat-lbl{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
  .section-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:28px 0 10px; }
  .denied{ text-align:center; padding:80px 20px; color:var(--text-dim); }
  .denied h2{ color:var(--text); }
  .refresh-btn{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font-size:13px; cursor:pointer; }
  .stat-card.clickable{ cursor:pointer; }
  .stat-card.clickable:hover{ border-color:var(--accent); }
  #userModal{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }
  #userModal .box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; max-width:480px; width:100%; max-height:80vh; overflow-y:auto; padding:20px; }
  #userModal h3{ margin:0 0 4px; font-size:16px; }
  #userModal .count{ color:var(--text-dim); font-size:12.5px; margin-bottom:14px; }
  #userModal .row{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  #userModal .row:last-child{ border-bottom:none; }
  #userModal .row .date{ color:var(--text-dim); font-family:var(--mono); font-size:11.5px; flex-shrink:0; }
  #userModal .close{ float:right; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }
  #userModal .empty{ color:var(--text-dim); font-size:13px; padding:10px 0; }
</style>
</head>
<body>
<div class="top-bar">
  <img src="wordmark.svg" class="top-logo" alt="TrainerCycle">
</div>
<div class="main" id="mainContent">
  <div class="denied">Loading…</div>
</div>

<div id="userModal">
  <div class="box">
    <button class="close" id="modalClose">✕</button>
    <h3 id="modalTitle"></h3>
    <div class="count" id="modalCount"></div>
    <div id="modalList"></div>
  </div>
</div>

<script type="module">
import { createSupabaseClient, requireAuth } from './auth.js?v=11';
const supabase = createSupabaseClient();

(async function(){
  const user = await requireAuth(supabase);
  const el = document.getElementById('mainContent');

  async function load(){
    el.innerHTML = '<div class="denied">Loading…</div>';
    const { data, error } = await supabase.rpc('get_admin_stats');
    if (error){
      el.innerHTML = '<div class="denied"><h2>Not authorized</h2><p>This page is only visible to the account owner.</p></div>';
      return;
    }
    el.innerHTML =
      '<h1>Admin</h1>' +
      '<p class="sub">Signed in as ' + (user.email || '') + '</p>' +

      '<div class="section-title">Accounts</div>' +
      '<div class="stats-grid">' +
        stat(data.total_users, 'Total signups', 'all') +
        stat(data.confirmed_users, 'Confirmed accounts', 'confirmed') +
        stat(data.signups_last_7_days, 'New signups (7d)', 'new_7d') +
      '</div>' +

      '<div class="section-title">Subscriptions</div>' +
      '<div class="stats-grid">' +
        stat(data.active_subscribers, 'Active (paid)', 'active') +
        stat(data.trialing, 'Trialing', 'trialing') +
        stat(data.canceled, 'Canceled', 'canceled') +
        stat(data.owners, 'Owner accounts', 'owner') +
      '</div>' +

      '<div class="section-title">Activity</div>' +
      '<div class="stats-grid">' +
        stat(data.total_rides, 'Total rides logged') +
        stat(data.rides_last_7_days, 'Rides (7d)') +
        stat(data.rides_last_30_days, 'Rides (30d)') +
        stat(data.strava_connections, 'Strava connections', 'strava') +
        stat(data.custom_workouts, 'Custom workouts built', 'custom_workouts') +
      '</div>' +

      '<button class="refresh-btn" id="refreshBtn">Refresh</button>';
    document.getElementById('refreshBtn').addEventListener('click', load);
    document.querySelectorAll('.stat-card.clickable').forEach(card=>{
      card.addEventListener('click', ()=> openModal(card.dataset.category, card.dataset.label));
    });
  }

  function stat(val, label, category){
    const clickable = category ? ' clickable' : '';
    const attrs = category ? ' data-category="'+category+'" data-label="'+label+'"' : '';
    return '<div class="stat-card'+clickable+'"'+attrs+'><div class="stat-val">'+(val ?? '—')+'</div><div class="stat-lbl">'+label+'</div></div>';
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function openModal(category, label){
    const modal = document.getElementById('userModal');
    const listEl = document.getElementById('modalList');
    document.getElementById('modalTitle').textContent = label;
    document.getElementById('modalCount').textContent = 'Loading…';
    listEl.innerHTML = '';
    modal.style.display = 'flex';

    const { data, error } = await supabase.rpc('get_admin_user_list', { category });
    if (error){
      document.getElementById('modalCount').textContent = '';
      listEl.innerHTML = '<div class="empty">Could not load — ' + error.message + '</div>';
      return;
    }
    const rows = data || [];
    document.getElementById('modalCount').textContent = rows.length + (rows.length===1 ? ' person' : ' people');
    listEl.innerHTML = rows.length ? rows.map(r=>{
      const d = r.date ? new Date(r.date).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
      return '<div class="row"><span>'+escapeHtml(r.email)+'</span><span class="date">'+d+'</span></div>';
    }).join('') : '<div class="empty">Nobody in this category yet.</div>';
  }
  document.getElementById('modalClose').addEventListener('click', ()=>{
    document.getElementById('userModal').style.display = 'none';
  });
  document.getElementById('userModal').addEventListener('click', (e)=>{
    if (e.target.id === 'userModal') document.getElementById('userModal').style.display = 'none';
  });

  await load();
})();
</script>
</body>
</html>
