<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainerCycle</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10141A">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}</script>
<style>
  :root{
    --bg: #10141A;
    --panel: #171D25;
    --panel-2: #1D242D;
    --line: #2A323D;
    --text: #E7ECF2;
    --text-dim: #8C97A6;
    --accent: #45D6C4;
    --accent-dim: #2A5C56;
    --danger: #E5484D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --z-recovery: #5A6472;
    --z-endurance: #4C8BF5;
    --z-tempo: #3DBE7A;
    --z-threshold: #E8B93D;
    --z-vo2: #F08A3C;
    --z-anaerobic: #E5484D;
    --z-neuro: #B14AED;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.4; font-size:14px;
  }
  .app{ position:relative; min-height:100vh; }
  .sidebar{
    position:fixed; top:60px; left:0; bottom:0; width:300px; max-width:85vw;
    background:var(--panel); border-right:1px solid var(--line);
    padding:20px; overflow-y:auto; z-index:60;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar{ transform:translateX(0); }
  .sidebar-backdrop{
    position:fixed; top:60px; left:0; right:0; bottom:0; background:rgba(0,0,0,.5);
    z-index:55; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar-backdrop{ opacity:1; pointer-events:auto; }
  .main{ padding:76px 28px 24px; max-width:900px; margin:0 auto; }
  .top-bar{
    position:fixed; top:0; left:0; right:0; height:60px; z-index:50;
    display:flex; align-items:center; padding:0 14px;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .icon-btn{
    width:38px; height:38px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  .top-bar-logo-link{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; }
  .top-logo{ height:36px; width:auto; border-radius:8px; display:block; }
  .top-bar-spacer{ flex:1; }

  h1{ font-size:19px; margin:0 0 2px; letter-spacing:-0.01em; }
  .sub{ color:var(--text-dim); font-size:12.5px; margin:0 0 24px; }

  .block{ margin-bottom:26px; }
  .block-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .page-nav{ display:flex; flex-direction:column; gap:2px; }
  .page-nav a{ padding:7px 8px; border-radius:6px; color:var(--text-dim); text-decoration:none; font-size:13px; }
  .page-nav a:hover{ background:var(--panel-2); color:var(--text); }
  .page-nav a.active{ background:var(--panel-2); color:var(--accent); font-weight:600; }

  .ftp-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
  .ftp-value{ font-family:var(--mono); font-size:30px; font-weight:600; color:var(--accent); }
  .ftp-unit{ color:var(--text-dim); font-size:13px; }
  .ftp-edit{ display:flex; gap:8px; margin-top:8px; }

  input[type=number], input[type=text], textarea, select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 9px; font-family:var(--sans); font-size:13.5px;
    width:100%;
  }
  input[type=number]{ font-family:var(--mono); }
  textarea{ font-family:var(--mono); font-size:12px; resize:vertical; min-height:110px; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px; }
  .field{ margin-bottom:10px; }
  .row{ display:flex; gap:8px; }
  .row > .field{ flex:1; }

  button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:var(--sans);
  }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:#08211E; border-color:var(--accent); font-weight:600; }
  button.primary:hover{ filter:brightness(1.08); }
  button.danger{ color:var(--danger); }
  button.danger:hover{ border-color:var(--danger); }
  button.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); padding:4px 6px; }
  button.ghost:hover{ color:var(--text); border-color:var(--line); }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  .lib-filters{ display:flex; gap:6px; margin-bottom:10px; }
  .lib-filters select{ font-size:12px; padding:5px 6px; }
  .lib-item{ padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
  .lib-item:hover{ background:var(--panel-2); margin:0 -8px; padding:10px 8px; border-radius:6px; }
  .lib-tag{ display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--accent); margin-left:6px; }
  .lib-item:first-child{ border-top:none; }
  .lib-name{ font-weight:600; font-size:13.5px; }
  .lib-meta{ color:var(--text-dim); font-size:11.5px; font-family:var(--mono); margin:2px 0 6px; }
  .lib-item-row{ display:flex; gap:10px; align-items:center; }
  .lib-chart{ width:56px; height:34px; flex-shrink:0; border-radius:4px; background:var(--panel-2); }
  .lib-item-text{ flex:1; min-width:0; }
  .lib-actions{ display:flex; gap:6px; }
  .lib-actions button{ font-size:11.5px; padding:4px 8px; }
  .empty-note{ color:var(--text-dim); font-size:12.5px; font-style:italic; }

  .tabs{ display:flex; gap:2px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .tab{ padding:8px 14px; color:var(--text-dim); cursor:pointer; font-size:13.5px; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--text); border-bottom-color:var(--accent); }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; }

  .interval-form{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .interval-col h4{ margin:0 0 8px; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }

  .chart{ margin:18px 0; }
  .chart-bars{ display:flex; align-items:flex-end; gap:1px; height:120px; background:var(--panel-2); border-radius:6px; padding:8px; overflow-x:auto; }
  .bar{ min-width:3px; border-radius:1px 1px 0 0; }

  .steplist{ margin-top:14px; }
  .step-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; margin-bottom:6px; background:var(--panel-2);
  }
  .step-swatch{ width:6px; align-self:stretch; border-radius:3px; flex-shrink:0; }
  .step-info{ flex:1; min-width:0; }
  .step-dur{ font-family:var(--mono); font-size:13px; }
  .step-target{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .step-note{ font-size:11.5px; color:var(--text-dim); }
  .step-btns{ display:flex; gap:2px; flex-shrink:0; }
  .repeat-wrap{ border:1px dashed var(--line); border-radius:6px; padding:8px; margin-bottom:6px; }
  .repeat-label{ font-size:11.5px; color:var(--accent); font-family:var(--mono); margin-bottom:6px; padding-left:4px; }

  .summary-bar{ display:flex; gap:24px; margin-bottom:6px; }
  .summary-item .val{ font-family:var(--mono); font-size:18px; font-weight:600; }
  .summary-item .lbl{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }

  .save-row{ display:flex; gap:8px; margin-top:16px; align-items:flex-end; }
  .save-row .field{ flex:1; margin-bottom:0; }

  .msg{ font-size:12.5px; margin-top:8px; padding:8px 10px; border-radius:6px; }
  .msg.error{ background:rgba(229,72,77,.12); color:var(--danger); }
  .msg.ok{ background:rgba(69,214,196,.12); color:var(--accent); }

  .hint{ font-size:12px; color:var(--text-dim); margin-bottom:12px; }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); }
  .legend-dot{ width:8px; height:8px; border-radius:2px; }
</style>
</head>
<body>
<div class="top-bar">
  <button class="icon-btn" id="sidebarToggle" aria-label="Toggle menu">☰</button>
  <a href="index.html" class="top-bar-logo-link" aria-label="TrainerCycle home"><img src="wordmark.svg" class="top-logo" alt="TrainerCycle"></a>
  <div class="top-bar-spacer"></div>
  <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">⛶</button>
</div>
<div class="app sidebar-collapsed">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar">
    <p class="sub" style="margin-top:0;">Workouts</p>

    <div class="block">
      <div class="block-title">Navigate</div>
      <nav class="page-nav">
        <a href="index.html">Home</a>
        <a href="plans.html">Training Plans</a>
        <a href="builder.html" class="active">Workouts</a>
        <a href="live.html">Live Ride</a>
        <a href="trainerstrength.html">TrainerStrength</a>
        <a href="rides.html">Rides</a>
        <a href="settings.html">Settings</a>
        <a href="help.html">How to Use</a>
      </nav>
    </div>

    <div class="block">
      <div class="block-title">Workout Library</div>
      <input type="text" id="librarySearch" placeholder="Search workouts…" style="margin-bottom:10px;">
      <div class="lib-filters">
        <select id="filterCategory">
          <option value="">All types</option>
          <option value="recovery">Recovery</option>
          <option value="endurance">Endurance</option>
          <option value="tempo">Tempo</option>
          <option value="sweet_spot">Sweet Spot</option>
          <option value="threshold">Threshold</option>
          <option value="vo2max">VO2 Max</option>
          <option value="over_under">Over/Under</option>
          <option value="anaerobic">Anaerobic</option>
          <option value="test">FTP Test</option>
          <option value="custom">Custom (mine)</option>
        </select>
        <select id="sortBy">
          <option value="duration_asc">Duration ↑</option>
          <option value="duration_desc">Duration ↓</option>
          <option value="if_asc">Intensity ↑</option>
          <option value="if_desc">Intensity ↓</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div id="libraryList"><div class="empty-note">Loading…</div></div>
    </div>
  </div>

  <div class="main">
    <div id="tab-builder">
      <div class="panel">
        <div class="hint">Add a steady step, or a work/recovery interval set. Targets are stored as %FTP so they stay correct if your FTP changes.</div>

        <div class="interval-form">
          <div class="interval-col">
            <h4>Add single step</h4>
            <div class="row">
              <div class="field"><label>Duration (mm:ss)</label><input type="text" id="stepDur" placeholder="10:00"></div>
              <div class="field"><label>Type</label>
                <select id="stepType">
                  <option value="ftp_pct">% FTP</option>
                  <option value="watts">Watts</option>
                  <option value="hr_pct">% HRmax</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="field"><label>Low</label><input type="number" id="stepLow" placeholder="60"></div>
              <div class="field"><label>High</label><input type="number" id="stepHigh" placeholder="65"></div>
            </div>
            <div class="field"><label>Note (optional)</label><input type="text" id="stepNote" placeholder="Warm up"></div>
            <button id="addStepBtn">Add step</button>
          </div>

          <div class="interval-col">
            <h4>Add interval set</h4>
            <div class="row">
              <div class="field"><label>Work (mm:ss)</label><input type="text" id="ivWorkDur" placeholder="3:00"></div>
              <div class="field"><label>Work %FTP</label><input type="number" id="ivWorkPct" placeholder="110"></div>
            </div>
            <div class="row">
              <div class="field"><label>Recover (mm:ss)</label><input type="text" id="ivRecDur" placeholder="3:00"></div>
              <div class="field"><label>Recover %FTP</label><input type="number" id="ivRecPct" placeholder="50"></div>
            </div>
            <div class="field"><label>Repetitions</label><input type="number" id="ivReps" placeholder="5"></div>
            <button id="addIntervalBtn">Add interval set</button>
          </div>
        </div>
        <div id="builderMsg"></div>
      </div>

      <div id="buildSummary"></div>
      <div class="chart"><div class="chart-bars" id="buildChart"></div></div>
      <div class="legend" id="legend"></div>
      <div class="steplist" id="buildStepList"></div>

      <div class="save-row">
        <div class="field"><label>Workout name</label><input type="text" id="workoutName" placeholder="e.g. Sweet Spot 3x12"></div>
        <button class="primary" id="saveWorkoutBtn">Save to library</button>
        <button id="clearBuilderBtn">Clear</button>
      </div>
      <div id="saveMsg"></div>
    </div>
  </div>
</div>

<script type="module">
import { createSupabaseClient, requireAuth, renderSidebarUserBadge, requireSubscription } from './auth.js';
const supabase = createSupabaseClient();
(async function(){
  const user = await requireAuth(supabase);
  renderSidebarUserBadge(supabase, user, document.querySelector('.sidebar'));
  await requireSubscription(supabase, user);
  const ZONES = [
    {max:60,  name:'Recovery',    color:'var(--z-recovery)'},
    {max:76,  name:'Endurance',   color:'var(--z-endurance)'},
    {max:91,  name:'Tempo',       color:'var(--z-tempo)'},
    {max:106, name:'Threshold',   color:'var(--z-threshold)'},
    {max:121, name:'VO2 Max',     color:'var(--z-vo2)'},
    {max:151, name:'Anaerobic',   color:'var(--z-anaerobic)'},
    {max:Infinity, name:'Neuromuscular', color:'var(--z-neuro)'}
  ];
  function zoneFor(pct){
    if (pct == null) return {name:'—', color:'var(--text-dim)'};
    for (const z of ZONES) if (pct < z.max) return z;
    return ZONES[ZONES.length-1];
  }
  function fmtDur(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + String(s).padStart(2,'0');
  }
  function parseDur(str){
    if (!str) return 0;
    const parts = str.split(':').map(x=>parseInt(x,10));
    if (parts.some(isNaN)) return 0;
    if (parts.length === 1) return parts[0];
    return parts[0]*60 + parts[1];
  }
  function uid(){ return 'w_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  // ---- state ----
  let ftp = 250;
  let library = [];
  let buildSteps = []; // array of {type:'step',...} or {type:'repeat', repetitions, steps:[...]}

  // ---- storage (Supabase, with localStorage as an offline cache/fallback) ----
  const ftpCacheKey = 'tc_ftp_' + user.id;
  const libCacheKey = 'tc_workout_library_' + user.id;
  async function loadState(){
    // FTP
    try {
      const { data, error } = await supabase.from('settings').select('value').eq('key','ftp').eq('user_id', user.id).maybeSingle();
      if (error) throw error;
      if (data && data.value && typeof data.value.v === 'number'){
        ftp = data.value.v;
        localStorage.setItem(ftpCacheKey, String(ftp));
      } else {
        const cached = localStorage.getItem(ftpCacheKey);
        if (cached) ftp = parseFloat(cached) || 250;
      }
    } catch(e){
      const cached = localStorage.getItem(ftpCacheKey);
      if (cached) ftp = parseFloat(cached) || 250;
      showMsg('ftpMsg','Offline — showing last saved FTP.', true);
    }
    // Library (RLS returns shared prebuilt rows plus this user's own rows)
    try {
      const { data, error } = await supabase.from('workouts').select('id,name,steps,category').order('created_at', {ascending:false});
      if (error) throw error;
      library = (data||[]).map(r=>({ id:r.id, name:r.name, steps:r.steps, category:r.category||null }));
      localStorage.setItem(libCacheKey, JSON.stringify(library));
    } catch(e){
      const cached = localStorage.getItem(libCacheKey);
      if (cached) { try { library = JSON.parse(cached); } catch(_){ library = []; } }
      showMsg('saveMsg','Offline — showing last synced library.', true);
    }
    renderFtp();
    renderLibrary();
  }
  async function saveFtp(v){
    ftp = v;
    localStorage.setItem(ftpCacheKey, String(v));
    try {
      const { error } = await supabase.from('settings').upsert(
        { user_id:user.id, key:'ftp', value:{v}, updated_at: new Date().toISOString() },
        { onConflict: 'user_id,key' }
      );
      if (error) throw error;
    } catch(e){ showMsg('ftpMsg','Saved locally, but sync failed — check connection.', true); }
  }
  async function addWorkoutToLibrary(w){
    library.unshift(w);
    localStorage.setItem(libCacheKey, JSON.stringify(library));
    try {
      const { error } = await supabase.from('workouts').insert({ id:w.id, name:w.name, steps:w.steps, source:'builder', user_id:user.id });
      if (error) throw error;
    } catch(e){ showMsg('saveMsg','Saved locally, but sync failed — check connection.', true); }
  }
  async function deleteWorkoutFromLibrary(id){
    library = library.filter(x=>x.id!==id);
    localStorage.setItem(libCacheKey, JSON.stringify(library));
    try {
      const { error } = await supabase.from('workouts').delete().eq('id', id);
      if (error) throw error;
    } catch(e){ showMsg('saveMsg','Deleted locally, but sync failed — check connection.', true); }
  }

  function showMsg(elId, text, isError){
    const el = document.getElementById(elId);
    el.innerHTML = '<div class="msg ' + (isError?'error':'ok') + '">' + text + '</div>';
    setTimeout(()=>{ el.innerHTML=''; }, 3500);
  }

  // ---- effective % / watts helpers ----
  function effectivePct(step){
    if (step.targetType === 'ftp_pct') return (step.low + step.high)/2;
    if (step.targetType === 'watts') return ((step.low + step.high)/2 / ftp) * 100;
    if (step.targetType === 'hr_pct') return (step.low + step.high)/2; // approx bucket reuse
    if (step.targetType === 'hr_bpm') return null;
    return null;
  }
  function displayTarget(step){
    if (step.targetType === 'ftp_pct'){
      const wLow = Math.round(ftp*step.low/100), wHigh = Math.round(ftp*step.high/100);
      return step.low===step.high ? (step.low+'% FTP (~'+wLow+'W)') : (step.low+'–'+step.high+'% FTP (~'+wLow+'–'+wHigh+'W)');
    }
    if (step.targetType === 'watts'){
      return step.low===step.high ? (step.low+'W') : (step.low+'–'+step.high+'W');
    }
    if (step.targetType === 'hr_pct') return step.low+'–'+step.high+'% HRmax';
    if (step.targetType === 'hr_bpm') return step.low+'–'+step.high+' bpm';
    return 'unspecified';
  }

  function flatten(steps){
    let out = [];
    for (const s of steps){
      if (s.type === 'repeat'){
        for (let i=0;i<s.repetitions;i++) out = out.concat(flatten(s.steps));
      } else out.push(s);
    }
    return out;
  }

  const CATEGORY_LABELS = {
    recovery:'Recovery', endurance:'Endurance', sweet_spot:'Sweet Spot',
    threshold:'Threshold', vo2max:'VO2 Max', over_under:'Over/Under',
    tempo:'Tempo', anaerobic:'Anaerobic', test:'FTP Test'
  };
  function categoryLabel(cat){ return CATEGORY_LABELS[cat] || 'Custom'; }

  function stepWatts(s){
    if (s.targetType==='ftp_pct') return ftp*(s.low+s.high)/200;
    if (s.targetType==='watts') return (s.low+s.high)/2;
    return null;
  }
  function computeStats(steps){
    const flat = flatten(steps);
    let totalDur = 0, sumP4t = 0, hasPower = false;
    flat.forEach(s=>{
      const w = stepWatts(s);
      const dur = s.duration||0;
      totalDur += dur;
      if (w!=null){ sumP4t += Math.pow(w,4)*dur; hasPower = true; }
    });
    const np = (hasPower && totalDur>0) ? Math.pow(sumP4t/totalDur, 0.25) : null;
    const IF = (np!=null && ftp>0) ? np/ftp : null;
    return { totalDur, np: np!=null?Math.round(np):null, IF: IF!=null?Math.round(IF*100)/100:null };
  }

  // ---- rendering ----
  function renderFtp(){
    // FTP is now edited on the Settings page — this page just reads the value for calculations.
  }

  function miniChartSVG(steps){
    const flat = flatten(steps);
    const total = flat.reduce((a,s)=>a+(s.duration||0),0) || 1;
    let x = 0;
    const bars = flat.map(s=>{
      const pct = effectivePct(s);
      const z = zoneFor(pct);
      const w = ((s.duration||1)/total) * 100;
      const h = pct!=null ? Math.max(15, Math.min(100, (pct/160)*100)) : 30;
      const bar = '<rect x="'+x+'" y="'+(100-h)+'" width="'+Math.max(0.5,w-0.3)+'" height="'+h+'" fill="'+z.color+'"/>';
      x += w;
      return bar;
    }).join('');
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="lib-chart">'+bars+'</svg>';
  }

  function renderLibrary(){
    const el = document.getElementById('libraryList');
    if (!library.length){ el.innerHTML = '<div class="empty-note">No saved workouts yet.</div>'; return; }

    const filterVal = document.getElementById('filterCategory').value;
    const sortVal = document.getElementById('sortBy').value;
    const searchVal = document.getElementById('librarySearch').value.trim().toLowerCase();

    let items = library.map(w=>{
      const stats = computeStats(w.steps);
      return { w, stats };
    });

    if (filterVal){
      items = items.filter(it => filterVal==='custom' ? !it.w.category : it.w.category===filterVal);
    }
    if (searchVal){
      items = items.filter(it => it.w.name.toLowerCase().includes(searchVal));
    }

    items.sort((a,b)=>{
      if (sortVal==='duration_asc') return a.stats.totalDur - b.stats.totalDur;
      if (sortVal==='duration_desc') return b.stats.totalDur - a.stats.totalDur;
      if (sortVal==='if_asc') return (a.stats.IF??0) - (b.stats.IF??0);
      if (sortVal==='if_desc') return (b.stats.IF??0) - (a.stats.IF??0);
      if (sortVal==='name') return a.w.name.localeCompare(b.w.name);
      return 0;
    });

    if (!items.length){ el.innerHTML = '<div class="empty-note">No workouts match this filter.</div>'; return; }

    el.innerHTML = items.map(({w, stats})=>{
      return '<div class="lib-item" data-preview="'+w.id+'">'
        + '<div class="lib-item-row">'
        + miniChartSVG(w.steps)
        + '<div class="lib-item-text">'
        + '<div class="lib-name">'+escapeHtml(w.name)+'<span class="lib-tag">'+categoryLabel(w.category)+'</span></div>'
        + '<div class="lib-meta">'+fmtDur(stats.totalDur)+ (stats.IF!=null ? ('  ·  IF '+stats.IF.toFixed(2)) : '') + (stats.np!=null ? ('  ·  NP '+stats.np+'W') : '') +'</div>'
        + '</div></div>'
        + '<div class="lib-actions">'
        + '<button class="ghost danger" data-del="'+w.id+'">Delete</button>'
        + '</div></div>';
    }).join('');
  }
  document.getElementById('filterCategory').addEventListener('change', renderLibrary);
  document.getElementById('sortBy').addEventListener('change', renderLibrary);
  document.getElementById('librarySearch').addEventListener('input', renderLibrary);

  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function renderBuilder(){
    const flat = flatten(buildSteps);
    const totalSec = flat.reduce((a,s)=>a+(s.duration||0),0);
    const pcts = flat.map(effectivePct).filter(p=>p!=null);
    const avg = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : null;

    document.getElementById('buildSummary').innerHTML = buildSteps.length ?
      ('<div class="summary-bar">'
        + '<div class="summary-item"><div class="val">'+fmtDur(totalSec)+'</div><div class="lbl">Duration</div></div>'
        + '<div class="summary-item"><div class="val">'+(avg!=null?avg+'%':'—')+'</div><div class="lbl">Avg FTP</div></div>'
        + '<div class="summary-item"><div class="val">'+flat.length+'</div><div class="lbl">Steps</div></div>'
        + '</div>') : '';

    // chart
    const chart = document.getElementById('buildChart');
    if (!flat.length){ chart.innerHTML = '<div class="empty-note" style="padding:0 4px;">No steps yet — add one on the left.</div>'; }
    else {
      const maxDur = Math.max(...flat.map(s=>s.duration||1));
      chart.innerHTML = flat.map(s=>{
        const pct = effectivePct(s);
        const z = zoneFor(pct);
        const h = pct!=null ? Math.max(6, Math.min(100, (pct/160)*100)) : 20;
        const w = Math.max(3, ((s.duration||1)/ (flat.reduce((a,x)=>a+(x.duration||1),0)||1)) * 700);
        return '<div class="bar" style="height:'+h+'%; width:'+w+'px; background:'+z.color+';" title="'+fmtDur(s.duration)+' · '+displayTarget(s)+'"></div>';
      }).join('');
    }

    // legend
    document.getElementById('legend').innerHTML = ZONES.map(z=>
      '<div class="legend-item"><span class="legend-dot" style="background:'+z.color+'"></span>'+z.name+'</div>'
    ).join('');

    // step list (top-level, with repeat grouping visible)
    const listEl = document.getElementById('buildStepList');
    if (!buildSteps.length){ listEl.innerHTML = ''; }
    else {
      listEl.innerHTML = buildSteps.map((s, i)=>{
        if (s.type === 'repeat'){
          const inner = s.steps.map(st=>stepRowHtml(st)).join('');
          return '<div class="repeat-wrap"><div class="repeat-label">× '+s.repetitions+' repetitions</div>'+inner+'</div>'
            + rowControls(i, buildSteps.length);
        }
        return '<div>' + stepRowHtml(s) + rowControls(i, buildSteps.length) + '</div>';
      }).join('');
    }
  }

  function stepRowHtml(s){
    const pct = effectivePct(s);
    const z = zoneFor(pct);
    return '<div class="step-row">'
      + '<div class="step-swatch" style="background:'+z.color+'"></div>'
      + '<div class="step-info">'
      + '<div class="step-dur">'+fmtDur(s.duration)+'</div>'
      + '<div class="step-target">'+displayTarget(s)+ (s.note ? ' · '+escapeHtml(s.note) : '') +'</div>'
      + '</div></div>';
  }
  function rowControls(i, len){
    return '<div class="step-btns" style="justify-content:flex-end; margin:-4px 0 6px;">'
      + (i>0 ? '<button class="ghost" data-up="'+i+'">↑</button>' : '')
      + (i<len-1 ? '<button class="ghost" data-down="'+i+'">↓</button>' : '')
      + '<button class="ghost danger" data-remove="'+i+'">✕</button>'
      + '</div>';
  }

  // ---- events: add single step ----
  document.getElementById('addStepBtn').addEventListener('click', ()=>{
    const dur = parseDur(document.getElementById('stepDur').value);
    const type = document.getElementById('stepType').value;
    const low = parseFloat(document.getElementById('stepLow').value);
    const highRaw = document.getElementById('stepHigh').value;
    const high = highRaw === '' ? low : parseFloat(highRaw);
    const note = document.getElementById('stepNote').value.trim();
    if (!dur || isNaN(low)){ showMsg('builderMsg','Enter a duration and target value.', true); return; }
    buildSteps.push({type:'step', duration:dur, targetType:type, low, high, note});
    ['stepDur','stepLow','stepHigh','stepNote'].forEach(id=>document.getElementById(id).value='');
    renderBuilder();
  });

  // ---- events: add interval set ----
  document.getElementById('addIntervalBtn').addEventListener('click', ()=>{
    const workDur = parseDur(document.getElementById('ivWorkDur').value);
    const workPct = parseFloat(document.getElementById('ivWorkPct').value);
    const recDur = parseDur(document.getElementById('ivRecDur').value);
    const recPct = parseFloat(document.getElementById('ivRecPct').value);
    const reps = parseInt(document.getElementById('ivReps').value, 10);
    if (!workDur || isNaN(workPct) || !recDur || isNaN(recPct) || !reps){
      showMsg('builderMsg','Fill in work, recovery and repetitions.', true); return;
    }
    buildSteps.push({
      type:'repeat', repetitions: reps,
      steps:[
        {type:'step', duration:workDur, targetType:'ftp_pct', low:workPct, high:workPct, note:'Work'},
        {type:'step', duration:recDur, targetType:'ftp_pct', low:recPct, high:recPct, note:'Recover'}
      ]
    });
    ['ivWorkDur','ivWorkPct','ivRecDur','ivRecPct','ivReps'].forEach(id=>document.getElementById(id).value='');
    renderBuilder();
  });

  // ---- events: step list row actions (delegated) ----
  document.getElementById('buildStepList').addEventListener('click', (e)=>{
    const t = e.target;
    if (t.dataset.remove !== undefined){ buildSteps.splice(+t.dataset.remove,1); renderBuilder(); }
    else if (t.dataset.up !== undefined){
      const i = +t.dataset.up;
      [buildSteps[i-1], buildSteps[i]] = [buildSteps[i], buildSteps[i-1]];
      renderBuilder();
    } else if (t.dataset.down !== undefined){
      const i = +t.dataset.down;
      [buildSteps[i+1], buildSteps[i]] = [buildSteps[i], buildSteps[i+1]];
      renderBuilder();
    }
  });

  document.getElementById('clearBuilderBtn').addEventListener('click', ()=>{
    buildSteps = [];
    document.getElementById('workoutName').value = '';
    renderBuilder();
  });

  // ---- save to library ----
  document.getElementById('saveWorkoutBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('workoutName').value.trim();
    if (!name){ showMsg('saveMsg','Give the workout a name.', true); return; }
    if (!buildSteps.length){ showMsg('saveMsg','Add at least one step first.', true); return; }
    const w = { id: uid(), name, steps: JSON.parse(JSON.stringify(buildSteps)), createdAt: Date.now() };
    await addWorkoutToLibrary(w);
    renderLibrary();
    showMsg('saveMsg','Saved to library.', false);
  });

  // ---- library row actions (delegated) ----
  document.getElementById('libraryList').addEventListener('click', async (e)=>{
    const t = e.target;
    if (t.dataset.del !== undefined){
      if (confirm('Delete this workout?')){
        await deleteWorkoutFromLibrary(t.dataset.del);
        renderLibrary();
      }
      return;
    }
    const row = t.closest('[data-preview]');
    if (row){
      const w = library.find(x=>x.id===row.dataset.preview);
      if (w){
        buildSteps = JSON.parse(JSON.stringify(w.steps));
        document.getElementById('workoutName').value = w.name;
        document.querySelector('.tab[data-tab="builder"]').click();
        renderBuilder();
      }
    }
  });

  // ---- sidebar drawer (overlay on all screen sizes) ----
  const appRoot = document.querySelector('.app');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  function applyCollapsed(collapsed){
    appRoot.classList.toggle('sidebar-collapsed', collapsed);
    sidebarToggle.textContent = collapsed ? '☰' : '✕';
  }
  sidebarToggle.addEventListener('click', ()=> applyCollapsed(!appRoot.classList.contains('sidebar-collapsed')));
  sidebarBackdrop.addEventListener('click', ()=> applyCollapsed(true));

  // ---- fullscreen toggle ----
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  fullscreenToggle.addEventListener('click', ()=>{
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', ()=>{
    fullscreenToggle.textContent = document.fullscreenElement ? '⤢' : '⛶';
  });

  await loadState();

  const loadParam = new URLSearchParams(window.location.search).get('load');
  if (loadParam){
    const w = library.find(x=>x.id===loadParam);
    if (w){
      buildSteps = JSON.parse(JSON.stringify(w.steps));
      document.getElementById('workoutName').value = w.name;
      renderBuilder();
    }
  }
})();
</script>
</body>
</html>
