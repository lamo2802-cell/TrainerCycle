<style>
  :root{
    --bg: #10141A;
    --panel: #171D25;
    --panel-2: #1D242D;
    --line: #2A323D;
    --text: #E7ECF2;
    --text-dim: #8C97A6;
    --accent: #45D6C4;
    --accent-dim: #2A5C56;
    --danger: #E5484D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --z-recovery: #5A6472;
    --z-endurance: #4C8BF5;
    --z-tempo: #3DBE7A;
    --z-threshold: #E8B93D;
    --z-vo2: #F08A3C;
    --z-anaerobic: #E5484D;
    --z-neuro: #B14AED;
  }
  *{box-sizing:border-box;}
  :root{ --topbar-h: calc(80px + env(safe-area-inset-top, 0px)); }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.4; font-size:14px;
  }
  .app{ position:relative; min-height:100vh; }
  .sidebar{
    position:fixed; top:var(--topbar-h); left:0; bottom:0; width:340px; max-width:85vw;
    background:var(--panel); border-right:1px solid var(--line);
    padding:20px; overflow-y:auto; z-index:60;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar{ transform:translateX(0); }
  .sidebar-backdrop{
    position:fixed; top:var(--topbar-h); left:0; right:0; bottom:0; background:rgba(0,0,0,.5);
    z-index:55; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .app:not(.sidebar-collapsed) .sidebar-backdrop{ opacity:1; pointer-events:auto; }
  .main{ padding:calc(96px + env(safe-area-inset-top, 0px)) 28px 24px; max-width:min(1700px, 97vw); margin:0 auto; }
  .top-bar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:50;
    display:flex; align-items:center; padding:0 14px; padding-top:env(safe-area-inset-top, 0px);
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .icon-btn{
    width:38px; height:38px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  html.standalone #fullscreenToggle{ display:none; }
  .top-bar-logo-link{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; }
  .top-logo{ height:60px; width:auto; border-radius:8px; display:block; }
  .top-bar-spacer{ flex:1; }

  h1{ font-size:19px; margin:0 0 2px; letter-spacing:-0.01em; }
  .sub{ color:var(--text-dim); font-size:12.5px; margin:0 0 24px; }

  .block{ margin-bottom:26px; }
  .block-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .block-top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .block-top-row .block-title{ margin-bottom:0; }
  .page-nav{ display:flex; flex-direction:column; gap:2px; }
  .page-nav a{ padding:10px 10px; border-radius:6px; color:var(--text-dim); text-decoration:none; font-size:16px; }
  .page-nav a:hover{ background:var(--panel-2); color:var(--text); }
  .page-nav a.active{ background:var(--panel-2); color:var(--accent); font-weight:600; }

  .ftp-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
  .ftp-value{ font-family:var(--mono); font-size:30px; font-weight:600; color:var(--accent); }
  .ftp-unit{ color:var(--text-dim); font-size:13px; }
  .ftp-edit{ display:flex; gap:8px; margin-top:8px; }

  input[type=number], input[type=text], textarea, select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 9px; font-family:var(--sans); font-size:13.5px;
    width:100%;
  }
  input[type=number]{ font-family:var(--mono); }
  textarea{ font-family:var(--mono); font-size:12px; resize:vertical; min-height:110px; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px; }
  .field{ margin-bottom:10px; }
  .row{ display:flex; gap:8px; }
  .row > .field{ flex:1; }

  button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:var(--sans);
  }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:#08211E; border-color:var(--accent); font-weight:600; }
  button.primary:hover{ filter:brightness(1.08); }
  button.danger{ color:var(--danger); }
  button.danger:hover{ border-color:var(--danger); }
  button.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); padding:4px 6px; }
  button.ghost:hover{ color:var(--text); border-color:var(--line); }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  .lib-filters{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .lib-filters select{ font-size:12px; padding:5px 6px; width:auto; flex:1 1 140px; }
  #libraryList{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
  .lib-item{ padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); cursor:pointer; }
  .lib-item .lib-actions{ margin-top:10px; }
  .lib-item:hover{ background:var(--panel-2); border-color:#3A4452; }
  .lib-tag{ display:inline-block; font-size:12px; padding:2px 9px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--accent); margin-left:8px; }
  .lib-name{ font-weight:600; font-size:17px; }
  .lib-meta{ color:var(--text-dim); font-size:14px; font-family:var(--mono); margin:3px 0 6px; }
  .lib-levels{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:4px; }
  .lvl-chip{ display:inline-block; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--text); padding:1px 7px; border-radius:6px;
    background:color-mix(in srgb, var(--zc) 18%, transparent); border:1px solid color-mix(in srgb, var(--zc) 55%, transparent); }
  .lvl-diff{ font-size:12px; color:var(--text-dim); }
  .lvl-diff.achievable, .lvl-diff.productive{ color:var(--accent); }
  .lvl-diff.stretch{ color:#E8B93D; }
  .lvl-diff.breakthrough, .lvl-diff.too-hard{ color:#F08A3C; }
  .lib-item-row{ display:flex; gap:10px; align-items:center; }
  .lib-chart{ width:84px; height:48px; flex-shrink:0; border-radius:5px; background:var(--panel-2); }
  .lib-item-text{ flex:1; min-width:0; }
  .preview-overlay{ position:fixed; inset:0; background:rgba(16,20,26,0.97); z-index:300; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:60px 20px 40px; }
  .preview-content{ position:relative; max-width:640px; width:100%; }
  .preview-header{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .preview-header h2{ margin:0; font-size:24px; }
  .preview-stats{ color:var(--text-dim); font-family:var(--mono); font-size:13px; margin-bottom:20px; }
  .preview-chart-svg{ width:100%; height:140px; border-radius:8px; background:var(--panel-2); margin-bottom:24px; }
  .preview-steps{ margin-bottom:28px; }
  .preview-step-row{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .preview-step-row .dur{ font-family:var(--mono); color:var(--text-dim); width:60px; flex-shrink:0; }
  .preview-step-row .tgt{ flex:1; }
  .preview-step-row .note{ color:var(--text-dim); font-size:12px; }
  .preview-actions{ display:flex; justify-content:center; }
  .preview-actions button{ padding:12px 28px; font-size:15px; }
  .lib-actions{ display:flex; gap:6px; }
  .lib-actions button{ font-size:11.5px; padding:4px 8px; }
  .empty-note{ color:var(--text-dim); font-size:12.5px; font-style:italic; }

  .tabs{ display:flex; gap:2px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .tab{ padding:8px 14px; color:var(--text-dim); cursor:pointer; font-size:13.5px; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--text); border-bottom-color:var(--accent); }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; }

  .interval-form{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .interval-col h4{ margin:0 0 8px; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }

  .chart{ margin:18px 0; }
  .chart-bars{ display:flex; align-items:flex-end; gap:1px; height:120px; background:var(--panel-2); border-radius:6px; padding:8px; overflow-x:auto; }
  .bar{ min-width:3px; border-radius:1px 1px 0 0; }

  .steplist{ margin-top:14px; }
  .step-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; margin-bottom:6px; background:var(--panel-2);
  }
  .step-swatch{ width:6px; align-self:stretch; border-radius:3px; flex-shrink:0; }
  .step-info{ flex:1; min-width:0; }
  .step-dur{ font-family:var(--mono); font-size:13px; }
  .step-target{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .step-note{ font-size:11.5px; color:var(--text-dim); }
  .step-btns{ display:flex; gap:2px; flex-shrink:0; }
  .repeat-wrap{ border:1px dashed var(--line); border-radius:6px; padding:8px; margin-bottom:6px; }
  .repeat-label{ font-size:11.5px; color:var(--accent); font-family:var(--mono); margin-bottom:6px; padding-left:4px; }

  .summary-bar{ display:flex; gap:24px; margin-bottom:6px; }
  .summary-item .val{ font-family:var(--mono); font-size:18px; font-weight:600; }
  .summary-item .lbl{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }

  .save-row{ display:flex; gap:8px; margin-top:16px; align-items:flex-end; }
  .save-row .field{ flex:1; margin-bottom:0; }

  .msg{ font-size:12.5px; margin-top:8px; padding:8px 10px; border-radius:6px; }
  .msg.error{ background:rgba(229,72,77,.12); color:var(--danger); }
  .msg.ok{ background:rgba(69,214,196,.12); color:var(--accent); }

  .hint{ font-size:12px; color:var(--text-dim); margin-bottom:12px; }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); }
  .legend-dot{ width:8px; height:8px; border-radius:2px; }

  /* ---- "How long have you got?" picker ---- */
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .page-head h1{ font-size:24px; margin:0; }
  .picker{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .picker-q{ font-size:16px; font-weight:600; }
  .picker-q + .picker-opts{ margin-bottom:8px; }
  .picker-opts{ display:grid; gap:10px; }
  .picker-durs{ grid-template-columns:repeat(auto-fit, minmax(84px, 1fr)); }
  .picker-feels{ grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); }
  .pick-btn{ display:flex; flex-direction:column; justify-content:center; gap:2px; min-height:64px; padding:10px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--text); text-align:left; }
  .pick-btn:hover{ border-color:#3A4452; }
  .pick-btn[aria-pressed="true"]{ background:rgba(69,214,196,.12); border-color:var(--accent); }
  .picker-durs .pick-btn{ align-items:center; text-align:center; min-height:72px; }
  .pick-big{ font-family:var(--mono); font-size:24px; font-weight:600; }
  .pick-label{ font-size:15px; font-weight:600; }
  .pick-sub{ font-size:12px; color:var(--text-dim); }
  .plan-nudge{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; border:1px solid var(--line); border-radius:10px; color:#B4BDC9; margin-bottom:22px; font-size:14px; }
  .plan-nudge .pn-text{ flex:1; min-width:200px; }
  .plan-nudge b{ color:var(--text); }
  .plan-nudge a{ color:var(--accent); text-decoration:none; font-size:13.5px; padding:6px 0; }
  .section-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .section-h{ font-size:17px; font-weight:600; }
  .section-sub{ color:var(--text-dim); font-size:13px; }
  #bestFits{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px; margin-bottom:36px; }
  .fit-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; }
  .fit-card:hover{ border-color:#3A4452; }
  .fit-chart{ display:block; width:100%; height:96px; background:#131920; }
  .fit-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .fit-name{ font-weight:600; font-size:17px; }
  .fit-meta{ display:flex; align-items:center; gap:6px; color:var(--text-dim); font-size:12.5px; }
  .cat-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .fit-stats{ display:flex; gap:22px; align-items:baseline; font-family:var(--mono); }
  .fit-stats .big{ font-size:22px; font-weight:600; }
  .fit-stats .v{ font-size:15px; }
  .fit-stats .u{ color:var(--text-dim); font-size:11.5px; margin-left:4px; }
  .fit-ride{ margin-top:2px; padding:11px; border-radius:8px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-weight:600; font-size:14px; }
  .fit-ride:hover{ background:rgba(69,214,196,.1); }
  #suggestCard .sg-card{ margin-bottom:22px; border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  @media (min-width:760px){ #suggestCard .fit-ride{ align-self:flex-start; padding:11px 28px; } }
  .sg-kicker{ font-size:11.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .sg-why{ font-size:13.5px; color:var(--text-dim); line-height:1.45; }
  .fit-ride.primary-fill{ background:var(--accent); color:#08211E; }
  .fits-empty{ grid-column:1/-1; padding:36px 20px; text-align:center; border:1px dashed var(--line); border-radius:12px; color:var(--text-dim); }
  .lib-empty{ padding:36px 20px; text-align:center; border:1px dashed var(--line); border-radius:12px; color:var(--text-dim); grid-column:1/-1; }
  .link-btn{ background:none; border:none; color:var(--accent); padding:0; font-size:inherit; cursor:pointer; }
  .link-btn:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="top-bar">
  <button class="icon-btn" id="sidebarToggle" aria-label="Toggle menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a href="index.html" class="top-bar-logo-link" aria-label="TrainerCycle home"><img src="wordmark.svg" class="top-logo" alt="TrainerCycle"></a>
  <div class="top-bar-spacer"></div>
  <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div class="app sidebar-collapsed">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar">
    <p class="sub" style="margin-top:0;">Workouts</p>

    <div class="block">
      <div class="block-title">Navigate</div>
      <nav class="page-nav">
        <a href="index.html">Today</a>
        <a href="plans.html">Training Plans</a>
        <a href="trainerrun.html">TrainerRun</a>
        <a href="calendar.html">Calendar</a>
        <a href="builder.html" class="active">Workouts</a>
        <a href="live.html">Live Ride</a>
        <a href="trainerstrength.html">TrainerStrength</a>
        <a href="rides.html">Rides</a>
        <a href="settings.html">Settings</a>
        <a href="help.html">How to Use</a>

      <div class="picker-opts picker-feels" id="pickerFeels" role="group" aria-labelledby="feelQ"></div>

    <div id="suggestCard"></div>

    <div class="section-row">

      <div class="section-sub" id="fitsSub"></div>

    <div class="block">

        <div class="section-h">All workouts</div>
        <div class="section-sub" id="libCount"></div>

      <input type="text" id="librarySearch" placeholder="Search workouts…" style="margin-bottom:10px;">
      <div class="lib-filters">

          <option value="">Any length</option>
          <option value="0-30">Up to 30 min</option>

        <select id="filterCategory" aria-label="Type">
          <option value="">All types</option>
          <option value="recovery">Recovery</option>
          <option value="endurance">Endurance</option>
          <option value="tempo">Tempo</option>
          <option value="sweet_spot">Sweet Spot</option>
          <option value="threshold">Threshold</option>
          <option value="vo2max">VO2 Max</option>
          <option value="over_under">Over/Under</option>
          <option value="anaerobic">Anaerobic</option>
          <option value="test">FTP Test</option>
          <option value="custom">Custom (mine)</option>
        </select>
        <select id="sortBy" aria-label="Sort">
          <option value="duration_asc">Duration ↑</option>
          <option value="duration_desc">Duration ↓</option>
          <option value="if_asc">Intensity ↑</option>
          <option value="if_desc">Intensity ↓</option>
          <option value="level_asc">Level ↑</option>
          <option value="level_desc">Level ↓</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div id="libraryList"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
    </div>
  </div>
</div>

<div class="preview-overlay" id="previewOverlay" style="display:none;">
  <div class="preview-content">
    <button class="icon-btn" id="previewCloseBtn" style="position:absolute; top:16px; right:16px;" aria-label="Close">✕</button>
    <div class="preview-header">
      <h2 id="previewName"></h2>
      <span class="lib-tag" id="previewTag"></span>
    </div>
    <div class="preview-stats" id="previewStats"></div>
    <svg id="previewChart" viewBox="0 0 100 40" preserveAspectRatio="none" class="preview-chart-svg"></svg>
    <div class="preview-steps" id="previewSteps"></div>
    <div class="preview-actions">
      <button class="primary" id="previewLoadLiveBtn">Load to Live Ride</button>
      <button id="previewExportBtn">Download file</button>
    </div>
  </div>
</div>

<script type="module">
import { createSupabaseClient, requireAuth, renderSidebarUserBadge, requireSubscription } from './auth.js?v=19';
import { notify, ask } from './sheet.js?v=3';
import { computeLevels, workoutLevel, difficultyLabel, zoneInfo, fmtLevel } from './levels.js?v=1';
import { suggestRide, loadFeel } from './suggest.js?v=3';
import { nextSession, loadFollowState, loadDoneDays, todayIso } from './plan-schedule.js?v=6';
import { applySwaps } from './adapt.js?v=5';
import { loadHolidays, applyHolidays } from './holidays.js?v=3';
import { addRuns } from './run.js?v=6';
import { openExportSheet } from './export.js?v=3';
const supabase = createSupabaseClient();
(async function(){
  const user = await requireAuth(supabase);
  renderSidebarUserBadge(supabase, user, document.querySelector('.sidebar'));
  await requireSubscription(supabase, user);
  const ZONES = [
    {max:60,  name:'Recovery',    color:'var(--z-recovery)'},
    {max:76,  name:'Endurance',   color:'var(--z-endurance)'},
    {max:91,  name:'Tempo',       color:'var(--z-tempo)'},
    {max:106, name:'Threshold',   color:'var(--z-threshold)'},
    {max:121, name:'VO2 Max',     color:'var(--z-vo2)'},
    {max:151, name:'Anaerobic',   color:'var(--z-anaerobic)'},
    {max:Infinity, name:'Neuromuscular', color:'var(--z-neuro)'}
  ];
  function zoneFor(pct){
    if (pct == null) return {name:'—', color:'var(--text-dim)'};
    for (const z of ZONES) if (pct < z.max) return z;
    return ZONES[ZONES.length-1];
  }
  function fmtDur(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + String(s).padStart(2,'0');
  }

  // ---- state ----
  let ftp = 100;
  let library = [];

  // ---- storage (Supabase, with localStorage as an offline cache/fallback) ----
  const ftpCacheKey = 'tc_ftp_' + user.id;
  const libCacheKey = 'tc_workout_library_' + user.id;
  async function loadState(){
    // FTP
    try {
      const { data, error } = await supabase.from('settings').select('value').eq('key','ftp').eq('user_id', user.id).maybeSingle();
      if (error) throw error;
      if (data && data.value && typeof data.value.v === 'number'){
        ftp = data.value.v;
        localStorage.setItem(ftpCacheKey, String(ftp));
      } else {
        const cached = localStorage.getItem(ftpCacheKey);
        if (cached) ftp = parseFloat(cached) || 100;
      }
    } catch(e){
      const cached = localStorage.getItem(ftpCacheKey);
      if (cached) ftp = parseFloat(cached) || 100;
      showMsg('saveMsg','Offline — showing last saved FTP.', true);
    }
    // Library (RLS returns shared prebuilt rows plus this user's own rows)
    try {
      const { data, error } = await supabase.from('workouts').select('id,name,steps,category,user_id').order('created_at', {ascending:false});
      if (error) throw error;
      library = (data||[]).map(r=>({ id:r.id, name:r.name, steps:r.steps, category:r.category||null, user_id:r.user_id }));
      localStorage.setItem(libCacheKey, JSON.stringify(library));
    } catch(e){
      const cached = localStorage.getItem(libCacheKey);
      if (cached) { try { library = JSON.parse(cached); } catch(_){ library = []; } }
      showMsg('saveMsg','Offline — showing last synced library.', true);
    }
    // Rider's progression levels, from ride history (used to label each workout Achievable, Productive…)
    try {
      const { data } = await supabase.from('completed_rides').select('id,started_at,completed,workout_id,workout_name,feel,np,intensity_factor,sport,source,tss').eq('user_id', user.id);
      const byId = {}, byName = {};
      library.forEach(w=>{ byId[w.id] = w; if (!byName[w.name]) byName[w.name] = w; });
      riderRides = data || [];
      ({ levels: riderLevels, byRide: riderByRide } = computeLevels(riderRides.filter(r => (r.sport || 'ride') === 'ride' && r.source !== 'strava' && r.source !== 'manual'), r => byId[r.workout_id] || byName[r.workout_name] || null, ftp));
    } catch(e){ riderLevels = null; }
    renderFtp();
    renderPicker();
    renderFits();
    renderLibrary();
    renderPlanNudge();
  }
  let riderLevels = null, riderByRide = {}, riderRides = [];
  function levelChip(w){
    const wl = workoutLevel(w, ftp);
    if (!wl) return '';
    const z = zoneInfo(wl.zone);
    const d = riderLevels ? difficultyLabel(wl.level, riderLevels[wl.zone]) : null;
    return '<span class="lvl-chip" style="--zc:'+z.color+'"'+(riderLevels ? ' title="Your '+z.name+' level is '+fmtLevel(riderLevels[wl.zone])+'"' : '')+'>'+z.short+' '+fmtLevel(wl.level)+'</span>'
      + (d ? '<span class="lvl-diff '+d.key+'">'+d.label+'</span>' : '');
  }
  async function saveFtp(v){
    ftp = v;
    localStorage.setItem(ftpCacheKey, String(v));
    try {
      const { error } = await supabase.from('settings').upsert(
        { user_id:user.id, key:'ftp', value:{v}, updated_at: new Date().toISOString() },
        { onConflict: 'user_id,key' }
      );
      if (error) throw error;
    } catch(e){ showMsg('ftpMsg','Saved locally, but sync failed — check connection.', true); }
  }
  async function deleteWorkoutFromLibrary(id){
    library = library.filter(x=>x.id!==id);
    localStorage.setItem(libCacheKey, JSON.stringify(library));
    try {
      const { error } = await supabase.from('workouts').delete().eq('id', id);
      if (error) throw error;
    } catch(e){ showMsg('saveMsg','Deleted locally, but sync failed — check connection.', true); }
  }

  function showMsg(elId, text, isError){
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = '<div class="msg ' + (isError?'error':'ok') + '">' + text + '</div>';
    setTimeout(()=>{ el.innerHTML=''; }, 3500);
  }

  // ---- effective % / watts helpers ----
  function effectivePct(step){
    if (step.targetType === 'ftp_pct') return (step.low + step.high)/2;
    if (step.targetType === 'watts') return ((step.low + step.high)/2 / ftp) * 100;
    if (step.targetType === 'hr_pct') return (step.low + step.high)/2; // approx bucket reuse
    if (step.targetType === 'hr_bpm') return null;
    return null;
  }
  function displayTarget(step){
    if (step.targetType === 'ftp_pct'){
      const wLow = Math.round(ftp*step.low/100), wHigh = Math.round(ftp*step.high/100);
      return step.low===step.high ? (step.low+'% FTP (~'+wLow+'W)') : (step.low+'–'+step.high+'% FTP (~'+wLow+'–'+wHigh+'W)');
    }
    if (step.targetType === 'watts'){
      return step.low===step.high ? (step.low+'W') : (step.low+'–'+step.high+'W');
    }
    if (step.targetType === 'hr_pct') return step.low+'–'+step.high+'% HRmax';
    if (step.targetType === 'hr_bpm') return step.low+'–'+step.high+' bpm';
    return 'unspecified';
  }

  function flatten(steps){
    let out = [];
    for (const s of steps){
      if (s.type === 'repeat'){
        for (let i=0;i<s.repetitions;i++) out = out.concat(flatten(s.steps));
      } else out.push(s);
    }
    return out;
  }

  const CATEGORY_LABELS = {
    recovery:'Recovery', endurance:'Endurance', sweet_spot:'Sweet Spot',
    threshold:'Threshold', vo2max:'VO2 Max', over_under:'Over/Under',
    tempo:'Tempo', anaerobic:'Anaerobic', test:'FTP Test'
  };
  function categoryLabel(cat){ return CATEGORY_LABELS[cat] || 'Custom'; }

  function stepWatts(s){
    if (s.targetType==='ftp_pct') return ftp*(s.low+s.high)/200;
    if (s.targetType==='watts') return (s.low+s.high)/2;
    return null;
  }
  function computeStats(steps){
    const flat = flatten(steps);
    let totalDur = 0, sumP4t = 0, hasPower = false;
    flat.forEach(s=>{
      const w = stepWatts(s);
      const dur = s.duration||0;
      totalDur += dur;
      if (w!=null){ sumP4t += Math.pow(w,4)*dur; hasPower = true; }
    });
    const np = (hasPower && totalDur>0) ? Math.pow(sumP4t/totalDur, 0.25) : null;
    const IF = (np!=null && ftp>0) ? np/ftp : null;
    const tss = IF!=null ? Math.round(totalDur/3600 * IF * IF * 100) : null;
    return { totalDur, np: np!=null?Math.round(np):null, IF: IF!=null?Math.round(IF*100)/100:null, tss };
  }

  // ---- rendering ----
  function renderFtp(){
    // FTP is now edited on the Settings page — this page just reads the value for calculations.
  }

  function profileSVG(steps, cls){
    const flat = flatten(steps);
    const total = flat.reduce((a,s)=>a+(s.duration||0),0) || 1;
    let x = 0;
    const bars = flat.map(s=>{
      const pct = effectivePct(s);
      const z = zoneFor(pct);
      const w = ((s.duration||1)/total) * 100;
      const h = pct!=null ? Math.max(15, Math.min(100, (pct/160)*100)) : 30;
      const bar = '<rect x="'+x+'" y="'+(100-h)+'" width="'+Math.max(0.5,w-0.3)+'" height="'+h+'" fill="'+z.color+'"/>';
      x += w;
      return bar;
    }).join('');
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="'+cls+'" aria-hidden="true">'+bars+'</svg>';
  }
  function miniChartSVG(steps){ return profileSVG(steps, 'lib-chart'); }

  // ---- remembered choices (picker + library filters), per device ----
  const prefsKey = 'tc_workouts_prefs_' + user.id;
  let prefs = { dur:60, feel:'steady', filterDuration:'', filterCategory:'', sortBy:'duration_asc' };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(prefsKey) || '{}')); } catch(_){}
  function savePrefs(){ try { localStorage.setItem(prefsKey, JSON.stringify(prefs)); } catch(_){} }

  const CATEGORY_COLORS = {
    recovery:'#7D8796', endurance:'#4C8BF5', tempo:'#3DBE7A', sweet_spot:'#B9C24A', threshold:'#E8B93D',
    over_under:'#EFA03C', vo2max:'#F08A3C', anaerobic:'#E5484D', test:'#B14AED'
  };
  function catDot(cat){ return '<span class="cat-dot" style="background:'+(CATEGORY_COLORS[cat]||'var(--accent)')+'"></span>'; }

  // ---- "How long have you got?" picker ----
  const PICK_DURS = [
    { v:30, big:'30', unit:'min' }, { v:45, big:'45', unit:'min' }, { v:60, big:'60', unit:'min' },
    { v:75, big:'75', unit:'min' }, { v:90, big:'90', unit:'min' }, { v:0, big:'2h+', unit:'long ride' }
  ];
  const FEELS = [
    { id:'easy',   label:'Easy',        sub:'Recovery, endurance',          cats:['recovery','endurance'] },
    { id:'steady', label:'Steady',      sub:'Tempo, sweet spot',            cats:['tempo','sweet_spot'] },
    { id:'hard',   label:'Hard',        sub:'Threshold, VO2, over-unders',  cats:['threshold','over_under','vo2max','anaerobic'] },
    { id:'test',   label:'Test my FTP', sub:'Ramp or 20-minute test',       cats:['test'] }
  ];
  const LONG_RIDE_MIN = 100; // "2h+" shows rides of at least this many minutes
  const FIT_GRACE_SEC = 90;  // a 61-minute workout still counts as fitting a 60-minute slot

  // Custom workouts have no category, so bucket them by intensity instead.
  function feelOf(w, stats){
    if (w.category){
      const f = FEELS.find(f=>f.cats.includes(w.category));
      return f ? f.id : null;
    }
    if (stats.IF == null) return null;
    return stats.IF < 0.70 ? 'easy' : stats.IF < 0.86 ? 'steady' : 'hard';
  }

  function renderPicker(){
    document.getElementById('pickerDurs').innerHTML = PICK_DURS.map(d=>
      '<button class="pick-btn" data-dur="'+d.v+'" aria-pressed="'+(prefs.dur===d.v)+'"><span class="pick-big">'+d.big+'</span><span class="pick-sub">'+d.unit+'</span></button>'
    ).join('');
    document.getElementById('pickerFeels').innerHTML = FEELS.map(f=>
      '<button class="pick-btn" data-feel="'+f.id+'" aria-pressed="'+(prefs.feel===f.id)+'"><span class="pick-label">'+f.label+'</span><span class="pick-sub">'+f.sub+'</span></button>'
    ).join('');
  }
  document.getElementById('pickerDurs').addEventListener('click', e=>{
    const b = e.target.closest('[data-dur]'); if (!b) return;
    prefs.dur = parseInt(b.dataset.dur, 10); savePrefs(); renderPicker(); renderFits();
  });
  document.getElementById('pickerFeels').addEventListener('click', e=>{
    const b = e.target.closest('[data-feel]'); if (!b) return;
    prefs.feel = b.dataset.feel; savePrefs(); renderPicker(); renderFits();
  });

  function bestFits(){
    const feel = FEELS.find(f=>f.id===prefs.feel) || FEELS[1];
    const long = prefs.dur === 0;
    const slot = prefs.dur*60;
    const cands = library.map(w=>({ w, stats:computeStats(w.steps) }))
      .filter(it => feelOf(it.w, it.stats) === feel.id)
      .filter(it => long ? it.stats.totalDur >= LONG_RIDE_MIN*60 : it.stats.totalDur <= slot + FIT_GRACE_SEC)
      .sort((a,b)=> long ? a.stats.totalDur - b.stats.totalDur
                         : (slot - a.stats.totalDur) - (slot - b.stats.totalDur) || a.w.name.localeCompare(b.w.name));
    // Prefer variety: the closest fit from each type first, then fill with the next closest.
    const picks = [], seenCats = new Set();
    for (const it of cands){ const k = it.w.category||'custom'; if (!seenCats.has(k)){ seenCats.add(k); picks.push(it); } if (picks.length===3) break; }
    for (const it of cands){ if (picks.length===3) break; if (!picks.includes(it)) picks.push(it); }
    return picks.sort((a,b)=> cands.indexOf(a) - cands.indexOf(b));
  }

  function fmtLong(sec){
    const m = Math.round(sec/60);
    return m < 60 ? { big:String(m), unit:'min' } : { big:Math.floor(m/60)+':'+String(m%60).padStart(2,'0'), unit:'h' };
  }

  // The one ride we'd pick for today (as on Today), within the time chosen above.
  function renderSuggest(){
    const box = document.getElementById('suggestCard');
    if (!riderLevels || !riderRides.length){ box.innerHTML = ''; return; }
    const today = todayIso();
    const res = suggestRide({ rides: riderRides, byRide: riderByRide, levels: riderLevels, library: library.filter(w => w.steps), ftp, today, maxMin: prefs.dur || 120, feel: loadFeel(today) });
    if (!res){ box.innerHTML = ''; return; }
    const c = res.picks[0], stats = computeStats(c.w.steps), d = fmtLong(stats.totalDur);
    box.innerHTML = '<div class="sg-card fit-card" data-preview="'+c.w.id+'">'
      + profileSVG(c.w.steps, 'fit-chart')
      + '<div class="fit-body"><div class="sg-kicker">Suggested for today</div>'
      + '<div><div class="fit-name">'+escapeHtml(c.w.name)+'</div><div class="fit-meta">'+catDot(c.w.category)+categoryLabel(c.w.category)+(levelChip(c.w) ? ' '+levelChip(c.w) : '')+'</div></div>'
      + '<div class="sg-why">'+escapeHtml(res.reason)+'</div>'
      + '<div class="fit-stats"><div><span class="big">'+d.big+'</span><span class="u">'+d.unit+'</span></div>'
      + (stats.IF!=null ? '<div><span class="v">'+stats.IF.toFixed(2)+'</span><span class="u">IF</span></div>' : '')
      + (stats.tss!=null ? '<div><span class="v">'+stats.tss+'</span><span class="u">TSS</span></div>' : '')+'</div>'
      + '<button class="fit-ride primary-fill" data-ride="'+c.w.id+'">Ride this</button></div></div>';
  }
  document.getElementById('suggestCard').addEventListener('click', e=>{
    const ride = e.target.closest('[data-ride]');
    if (ride){ window.location.href = 'live.html?load=' + encodeURIComponent(ride.dataset.ride); return; }
    const card = e.target.closest('[data-preview]');
    if (card) showWorkoutPreview(card.dataset.preview);
  });

  function renderFits(){
    renderSuggest();
    const el = document.getElementById('bestFits');
    const feel = FEELS.find(f=>f.id===prefs.feel) || FEELS[1];
    const long = prefs.dur === 0;
    document.getElementById('fitsSub').textContent = (long ? '2 hours or more' : 'Up to '+prefs.dur+' min') + ' · ' + feel.label;
    const picks = bestFits();
    if (!picks.length){
      el.innerHTML = '<div class="fits-empty">Nothing '+(long?'that long':'that short')+' for '+feel.label.toLowerCase()+' yet. Try a '+(long?'shorter':'longer')+' slot, or browse everything below.</div>';
      return;
    }
    el.innerHTML = picks.map(({w, stats})=>{
      const d = fmtLong(stats.totalDur);
      const spareMin = Math.round((prefs.dur*60 - stats.totalDur)/60);
      const spare = long ? 'Long ride' : (spareMin < 1 ? 'Fits exactly' : spareMin+' min to spare');
      return '<div class="fit-card" data-preview="'+w.id+'">'
        + profileSVG(w.steps, 'fit-chart')
        + '<div class="fit-body">'
        + '<div><div class="fit-name">'+escapeHtml(w.name)+'</div>'
        + '<div class="fit-meta">'+catDot(w.category)+categoryLabel(w.category)+' · '+spare+'</div></div>'
        + '<div class="fit-stats"><div><span class="big">'+d.big+'</span><span class="u">'+d.unit+'</span></div>'
        + (stats.IF!=null ? '<div><span class="v">'+stats.IF.toFixed(2)+'</span><span class="u">IF</span></div>' : '')
        + (stats.tss!=null ? '<div><span class="v">'+stats.tss+'</span><span class="u">TSS</span></div>' : '')
        + '</div>'
        + '<button class="fit-ride" data-ride="'+w.id+'">Ride this</button>'
        + '</div></div>';
    }).join('');
  }
  document.getElementById('bestFits').addEventListener('click', e=>{
    const ride = e.target.closest('[data-ride]');
    if (ride){ window.location.href = 'live.html?load=' + encodeURIComponent(ride.dataset.ride); return; }
    const card = e.target.closest('[data-preview]');
    if (card) showWorkoutPreview(card.dataset.preview);
  });

  // ---- next session from a followed plan (same rules as plans.html) ----
  async function renderPlanNudge(){
    const el = document.getElementById('planNudge');
    try {
      const st = await loadFollowState(supabase, user.id);
      if (!st.planId || !st.startedAt) return;
      const { data: planRow } = await supabase.from('training_plans').select('id,name,weeks').eq('id', st.planId).maybeSingle();
      if (!planRow) return;
      const plan = applyHolidays(applySwaps(addRuns(planRow, st.runs), st.swaps), st.startedAt, st.moves, await loadHolidays(supabase, user.id));
      const doneDays = await loadDoneDays(supabase, user.id, plan.id, st.startedAt);
      const s = nextSession(plan, st.startedAt, { cursorDay: st.cursorDay, moves: st.moves, skips: st.skips, doneDays });
      const next = s ? { day: s.dayObj, isToday: s.date === todayIso(), dayIndex: s.dayIndex } : null;
      if (!next || next.day.workoutType === 'strength' || next.day.workoutType === 'run') return;
      const w = library.find(x=>x.id===next.day.workoutId);
      if (!w) return;
      const mins = Math.round(computeStats(w.steps).totalDur/60);
      el.innerHTML = '<span class="pn-text">'+(next.isToday ? 'Today' : 'Next')+' in '+escapeHtml(plan.name)+': <b>'+escapeHtml(w.name)+'</b>, '+mins+' min</span>'
        + '<a href="live.html?load='+encodeURIComponent(w.id)+'&plan='+encodeURIComponent(plan.id)+'&day='+next.dayIndex+'">Ride this instead</a>';
      el.style.display = 'flex';
    } catch(_){ /* the nudge is optional; stay hidden if anything fails */ }
  }

  // ---- full library list ----
  function renderLibrary(){
    const el = document.getElementById('libraryList');
    const countEl = document.getElementById('libCount');
    if (!library.length){ el.innerHTML = '<div class="empty-note">No saved workouts yet.</div>'; countEl.textContent=''; return; }

    const durVal = document.getElementById('filterDuration').value;
    const filterVal = document.getElementById('filterCategory').value;
    const sortVal = document.getElementById('sortBy').value;
    const searchVal = document.getElementById('librarySearch').value.trim().toLowerCase();

    let items = library.map(w=>{
      const stats = computeStats(w.steps);
      return { w, stats };
    });

    if (durVal){
      const [lo, hi] = durVal.split('-').map(x => x==='' ? Infinity : parseInt(x,10)*60);
      items = items.filter(it => it.stats.totalDur > lo && it.stats.totalDur <= hi + FIT_GRACE_SEC);
    }
    if (filterVal){
      items = items.filter(it => filterVal==='custom' ? !it.w.category : it.w.category===filterVal);
    }
    if (searchVal){
      items = items.filter(it => it.w.name.toLowerCase().includes(searchVal));
    }

    items.sort((a,b)=>{
      if (sortVal==='duration_asc') return a.stats.totalDur - b.stats.totalDur;
      if (sortVal==='duration_desc') return b.stats.totalDur - a.stats.totalDur;
      if (sortVal==='if_asc') return (a.stats.IF??0) - (b.stats.IF??0);
      if (sortVal==='if_desc') return (b.stats.IF??0) - (a.stats.IF??0);
      if (sortVal==='name') return a.w.name.localeCompare(b.w.name);
      if (sortVal==='level_asc' || sortVal==='level_desc'){
        const la = (workoutLevel(a.w, ftp)||{level:0}).level, lb = (workoutLevel(b.w, ftp)||{level:0}).level;
        return sortVal==='level_asc' ? la-lb : lb-la;
      }
      return 0;
    });

    const filtered = !!(durVal || filterVal || searchVal);
    countEl.textContent = filtered ? (items.length+' of '+library.length) : (library.length+' workouts');

    if (!items.length){
      el.innerHTML = '<div class="lib-empty">No workouts match these filters. <button class="link-btn" id="clearFiltersBtn">Clear filters</button></div>';
      document.getElementById('clearFiltersBtn').addEventListener('click', ()=>{
        document.getElementById('filterDuration').value = '';
        document.getElementById('filterCategory').value = '';
        document.getElementById('librarySearch').value = '';
        onFilterChange();
      });
      return;
    }

    el.innerHTML = items.map(({w, stats})=>{
      const isOwn = w.user_id === user.id;
      return '<div class="lib-item" data-preview="'+w.id+'">'
        + '<div class="lib-item-row">'
        + miniChartSVG(w.steps)
        + '<div class="lib-item-text">'
        + '<div class="lib-name">'+escapeHtml(w.name)+'<span class="lib-tag">'+categoryLabel(w.category)+'</span></div>'
        + '<div class="lib-meta">'+fmtLen(stats.totalDur)+ (stats.IF!=null ? ('  ·  IF '+stats.IF.toFixed(2)) : '') + (stats.tss!=null ? ('  ·  '+stats.tss+' TSS') : '') +'</div>'
        + (levelChip(w) ? '<div class="lib-levels">'+levelChip(w)+'</div>' : '')
        + '</div></div>'
        + (isOwn ? '<div class="lib-actions"><button class="ghost danger" data-del="'+w.id+'">Delete</button></div>' : '')
        + '</div>';
    }).join('');
  }
  function onFilterChange(){
    prefs.filterDuration = document.getElementById('filterDuration').value;
    prefs.filterCategory = document.getElementById('filterCategory').value;
    prefs.sortBy = document.getElementById('sortBy').value;
    savePrefs();
    renderLibrary();
  }
  for (const [id, key] of [['filterDuration','filterDuration'],['filterCategory','filterCategory'],['sortBy','sortBy']]){
    const sel = document.getElementById(id);
    if ([...sel.options].some(o=>o.value===prefs[key])) sel.value = prefs[key];
    sel.addEventListener('change', onFilterChange);
  }
  document.getElementById('librarySearch').addEventListener('input', renderLibrary);

  function fmtLen(sec){ const m = Math.round((sec||0)/60); return m >= 60 ? Math.floor(m/60)+'h'+(m%60 ? ' '+String(m%60).padStart(2,'0')+'m' : '') : m+' min'; }
  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- library row actions (delegated) ----
  function targetLabel(step){
    if (step.targetType==='ftp_pct') return step.low+'–'+step.high+'% FTP';
    if (step.targetType==='watts') return Math.round(step.low)+'–'+Math.round(step.high)+'W';
    if (step.targetType==='hr_pct') return step.low+'–'+step.high+'% HRmax';
    if (step.targetType==='hr_bpm') return Math.round(step.low)+'–'+Math.round(step.high)+' bpm';
    return '—';
  }

  function bigChartSVG(steps){
    const flat = flatten(steps);
    const total = flat.reduce((a,s)=>a+(s.duration||0),0) || 1;
    let x = 0;
    return flat.map(s=>{
      const pct = effectivePct(s);
      const z = zoneFor(pct);
      const w = ((s.duration||1)/total) * 100;
      const h = pct!=null ? Math.max(6, Math.min(38, (pct/160)*38)) : 12;
      const bar = '<rect x="'+x+'" y="'+(38-h)+'" width="'+Math.max(0.3,w-0.15)+'" height="'+h+'" fill="'+z.color+'"/>';
      x += w;
      return bar;
    }).join('');
  }

  function showWorkoutPreview(id){
    const w = library.find(x=>x.id===id);
    if (!w) return;
    const stats = computeStats(w.steps);
    document.getElementById('previewName').textContent = w.name;
    document.getElementById('previewTag').textContent = categoryLabel(w.category);
    document.getElementById('previewStats').textContent = fmtDur(stats.totalDur)
      + (stats.IF!=null ? ('  ·  IF '+stats.IF.toFixed(2)) : '')
      + (stats.np!=null ? ('  ·  NP '+stats.np+'W') : '');
    document.getElementById('previewChart').innerHTML = bigChartSVG(w.steps);

    const flat = flatten(w.steps);
    document.getElementById('previewSteps').innerHTML = flat.map(s=>{
      return '<div class="preview-step-row">'
        + '<div class="dur">'+fmtDur(s.duration||0)+'</div>'
        + '<div class="tgt">'+targetLabel(s)+'</div>'
        + '<div class="note">'+escapeHtml(s.note||'')+'</div>'
        + '</div>';
    }).join('');

    document.getElementById('previewLoadLiveBtn').onclick = ()=>{
      window.location.href = 'live.html?load=' + encodeURIComponent(w.id);
    };
    document.getElementById('previewExportBtn').onclick = ()=> openExportSheet({ kind:'bike', workout:w, ftp });
    document.getElementById('previewOverlay').style.display = 'flex';
  }
  document.getElementById('previewCloseBtn').addEventListener('click', ()=>{
    document.getElementById('previewOverlay').style.display = 'none';
  });

  document.getElementById('libraryList').addEventListener('click', async (e)=>{
    const t = e.target;
    if (t.dataset.del !== undefined){
      if (await ask('This removes it from your library. Rides you\'ve already done with it are kept.', { title:'Delete this workout?', ok:'Delete', danger:true })){
        await deleteWorkoutFromLibrary(t.dataset.del);
        renderFits();
        renderLibrary();
      }
      return;
    }
    const row = t.closest('[data-preview]');
    if (row) showWorkoutPreview(row.dataset.preview);
  });

  // ---- sidebar drawer (overlay on all screen sizes) ----
  const appRoot = document.querySelector('.app');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  function applyCollapsed(collapsed){
    appRoot.classList.toggle('sidebar-collapsed', collapsed);
    sidebarToggle.innerHTML = collapsed ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  }
  sidebarToggle.addEventListener('click', ()=> applyCollapsed(!appRoot.classList.contains('sidebar-collapsed')));
  sidebarBackdrop.addEventListener('click', ()=> applyCollapsed(true));

  // ---- fullscreen toggle (not needed when already running as an installed app) ----
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  if (!document.documentElement.classList.contains('standalone')){
    fullscreenToggle.addEventListener('click', ()=>{
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    });
    document.addEventListener('fullscreenchange', ()=>{
      fullscreenToggle.innerHTML = document.fullscreenElement ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    });
  }

  await loadState();
})();
</script>
</body>
</html>
