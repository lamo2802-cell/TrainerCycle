<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainerCycle — Plans</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root{
    --bg: #10141A; --panel: #171D25; --panel-2: #1D242D; --line: #2A323D;
    --text: #E7ECF2; --text-dim: #8C97A6; --accent: #45D6C4;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; }
  .app{ display:flex; min-height:100vh; flex-wrap:wrap; }
  .sidebar{ width:300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); padding:72px 20px 20px; }
  .main{ flex:1; min-width:320px; padding:76px 28px 24px; max-width:900px; }
  @media (min-width:701px){ .sidebar{ min-height:100vh; } }
  @media (max-width:700px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--line); }
    .main{ max-width:100%; min-width:0; }
  }
  .app.sidebar-collapsed .sidebar{ display:none; }
  .app.sidebar-collapsed .main{ max-width:1100px; margin:0 auto; }
  .top-actions{ position:fixed; top:14px; left:14px; z-index:50; display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:38px; height:38px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  .top-logo-link{ display:flex; }
  .top-logo{ height:52px; width:auto; border-radius:8px; display:block; }

  .sub{ color:var(--text-dim); font-size:12.5px; margin:2px 0 20px; }
  .block{ margin-bottom:24px; }
  .block-title{ font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .page-nav{ display:flex; flex-direction:column; gap:2px; }
  .page-nav a{ padding:7px 8px; border-radius:6px; color:var(--text-dim); text-decoration:none; font-size:13px; }
  .page-nav a:hover{ background:var(--panel-2); color:var(--text); }
  .page-nav a.active{ background:var(--panel-2); color:var(--accent); font-weight:600; }

  button{ background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:hover{ border-color:var(--accent); }

  .plan-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:14px; cursor:pointer; }
  .plan-card:hover{ border-color:var(--accent); }
  .plan-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .plan-name{ font-size:17px; font-weight:600; }
  .plan-tag{ display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--accent); margin-left:8px; }
  .plan-desc{ color:var(--text-dim); font-size:12.5px; margin:6px 0 4px; line-height:1.5; }
  .plan-meta{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); }

  .week-block{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
  .week-title{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .day-row{ display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:6px; }
  .day-row:hover{ background:var(--panel-2); }
  .day-name{ width:36px; flex-shrink:0; color:var(--text-dim); font-size:12px; font-family:var(--mono); }
  .day-workout{ flex:1; font-size:13px; }
  .day-workout.rest{ color:var(--text-dim); font-style:italic; }
  .day-workout a{ color:var(--text); text-decoration:none; }
  .day-workout a:hover{ color:var(--accent); }
  .day-workout .tag{ color:var(--text-dim); font-size:11px; margin-left:6px; }
  .empty-note{ color:var(--text-dim); font-size:13px; }
</style>
</head>
<body>
<div class="top-actions">
  <a href="index.html" class="top-logo-link" aria-label="TrainerCycle home"><img src="wordmark.svg" class="top-logo" alt="TrainerCycle"></a>
  <button class="icon-btn" id="sidebarToggle" aria-label="Toggle menu">☰</button>
  <button class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">⛶</button>
</div>

<div class="app">
  <div class="sidebar">
    <p class="sub" style="margin-top:0;">Training Plans</p>

    <div class="block">
      <div class="block-title">Navigate</div>
      <nav class="page-nav">
        <a href="index.html">Home</a>
        <a href="builder.html">Builder</a>
        <a href="live.html">Live Ride</a>
        <a href="trainerstrength.html">TrainerStrength</a>
        <a href="rides.html">Rides</a>
        <a href="plans.html" class="active">Plans</a>
        <a href="help.html">How to Use</a>
      </nav>
    </div>
  </div>

  <div class="main">
    <div id="plansList"><div class="empty-note">Loading…</div></div>
  </div>
</div>

<script type="module">
import { createSupabaseClient, requireAuth, addUserBadge, requireSubscription } from './auth.js';
const supabase = createSupabaseClient();

(async function(){
  const user = await requireAuth(supabase);
  addUserBadge(supabase, user);
  await requireSubscription(supabase, user);

  const FOCUS_LABELS = {
    recovery:'Recovery', endurance:'Endurance', sweet_spot:'Sweet Spot',
    threshold:'Threshold', vo2max:'VO2 Max', over_under:'Over/Under',
    tempo:'Tempo', anaerobic:'Anaerobic', test:'FTP Test'
  };
  function focusLabel(f){ return FOCUS_LABELS[f] || f || ''; }
  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  let plans = [];
  let workoutNames = {}; // id -> {name, category}

  async function loadPlans(){
    const el = document.getElementById('plansList');
    try {
      const { data: planData, error: planErr } = await supabase.from('training_plans').select('*').order('created_at',{ascending:true});
      if (planErr) throw planErr;
      plans = planData || [];

      const { data: workoutData, error: wErr } = await supabase.from('workouts').select('id,name,category');
      if (wErr) throw wErr;
      (workoutData||[]).forEach(w=>{ workoutNames[w.id] = w; });

      render();
    } catch(e){
      el.innerHTML = '<div class="empty-note">Could not load plans. Error: ' + escapeHtml(e && e.message ? e.message : String(e)) + '</div>';
    }
  }

  function render(){
    const el = document.getElementById('plansList');
    if (!plans.length){ el.innerHTML = '<div class="empty-note">No training plans yet.</div>'; return; }

    el.innerHTML = plans.map(p=>{
      const weekCount = (p.weeks||[]).length;
      return '<div class="plan-card" data-plan="'+p.id+'">'
        + '<div class="plan-top"><div>'
        + '<span class="plan-name">'+escapeHtml(p.name)+'</span>'
        + (p.focus ? '<span class="plan-tag">'+focusLabel(p.focus)+'</span>' : '')
        + '</div></div>'
        + '<div class="plan-desc">'+escapeHtml(p.description||'')+'</div>'
        + '<div class="plan-meta">'+weekCount+' week'+(weekCount===1?'':'s')+'</div>'
        + '<div class="plan-weeks" id="weeks-'+p.id+'" style="display:none;"></div>'
        + '</div>';
    }).join('');
  }

  function renderWeeks(plan){
    const container = document.getElementById('weeks-'+plan.id);
    if (container.dataset.rendered) { container.style.display = container.style.display==='none' ? 'block' : 'none'; return; }
    container.innerHTML = (plan.weeks||[]).map(w=>{
      const days = (w.days||[]).map(d=>{
        if (d.type === 'rest'){
          return '<div class="day-row"><div class="day-name">'+escapeHtml(d.day)+'</div><div class="day-workout rest">Rest day</div></div>';
        }
        const wk = workoutNames[d.workoutId];
        const label = wk ? wk.name : d.workoutId;
        const tag = wk && wk.category ? focusLabel(wk.category) : '';
        return '<div class="day-row"><div class="day-name">'+escapeHtml(d.day)+'</div>'
          + '<div class="day-workout"><a href="builder.html?load='+encodeURIComponent(d.workoutId)+'" onclick="event.stopPropagation()">'+escapeHtml(label)+'</a>'
          + (tag ? '<span class="tag">'+tag+'</span>' : '') + '</div></div>';
      }).join('');
      return '<div class="week-block"><div class="week-title">Week '+w.week+'</div>'+days+'</div>';
    }).join('');
    container.dataset.rendered = '1';
    container.style.display = 'block';
  }

  document.getElementById('plansList').addEventListener('click', (e)=>{
    const card = e.target.closest('[data-plan]');
    if (!card) return;
    const plan = plans.find(p=>p.id===card.dataset.plan);
    if (plan) renderWeeks(plan);
  });

  // ---- sidebar collapse ----
  const appRoot = document.querySelector('.app');
  const sidebarToggle = document.getElementById('sidebarToggle');
  function applyCollapsed(collapsed){
    appRoot.classList.toggle('sidebar-collapsed', collapsed);
    sidebarToggle.textContent = collapsed ? '☰' : '✕';
    try { localStorage.setItem('tc_sidebar_collapsed', collapsed ? '1' : '0'); } catch(e){}
  }
  sidebarToggle.addEventListener('click', ()=> applyCollapsed(!appRoot.classList.contains('sidebar-collapsed')));
  let initCollapsed = false;
  try { initCollapsed = localStorage.getItem('tc_sidebar_collapsed') === '1'; } catch(e){}
  applyCollapsed(initCollapsed);

  // ---- fullscreen toggle ----
  const fullscreenToggle = document.getElementById('fullscreenToggle');
  fullscreenToggle.addEventListener('click', ()=>{
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', ()=>{
    fullscreenToggle.textContent = document.fullscreenElement ? '⤢' : '⛶';
  });

  loadPlans();
})();
</script>
</body>
</html>
