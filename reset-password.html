<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password — TrainerCycle</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#10141A">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:#10141A; color:#E7ECF2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .box{ background:#171D25; border:1px solid #2A323D; border-radius:12px; padding:32px; max-width:340px; width:100%; text-align:center; }
  .box img{ width:56px; height:56px; border-radius:12px; margin-bottom:14px; }
  h2{ font-size:18px; margin:0 0 6px; }
  p{ color:#8C97A6; font-size:13px; margin:0 0 20px; line-height:1.4; }
  input[type=password], input[type=text]{ width:100%; box-sizing:border-box; padding:10px; padding-right:38px; margin-bottom:0; border-radius:6px; border:1px solid #2A323D; background:#1D242D; color:#E7ECF2; font-size:13.5px; }
  ul#rpChecklist{ text-align:left; font-size:11.5px; color:#8C97A6; margin:2px 0 12px; padding-left:18px; list-style:none; }
  button{ width:100%; padding:11px; border-radius:6px; border:1px solid #45D6C4; background:#45D6C4; color:#08211E; font-weight:600; font-size:14px; cursor:pointer; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .msg{ color:#8C97A6; font-size:12px; margin-top:14px; min-height:16px; }
  .msg.error{ color:#E5484D; }
  .msg.ok{ color:#45D6C4; }
  a{ color:#45D6C4; }
</style>
</head>
<body>
  <div class="box">
    <img src="logo.svg" alt="TrainerCycle">
    <h2>Set a new password</h2>
    <p>Choose a new password for your TrainerCycle account.</p>
    <div id="formArea">
      <div id="rpPasswordField"></div>
      <div id="rpConfirmField"></div>
      <ul id="rpChecklist">
        <li data-req="length">○ At least 8 characters</li>
        <li data-req="upper">○ One uppercase letter</li>
        <li data-req="lower">○ One lowercase letter</li>
        <li data-req="number">○ One number</li>
        <li data-req="symbol">○ One symbol</li>
      </ul>
      <button id="rpSubmit">Update Password</button>
    </div>
    <div class="msg" id="rpMsg"></div>
  </div>

<script type="module">
import { createSupabaseClient, passwordRequirements, passwordValid, passwordFieldHtml } from './auth.js?v=10';
const supabase = createSupabaseClient();

document.getElementById('rpPasswordField').innerHTML = passwordFieldHtml('rpPassword', 'New password', 'new-password');
document.getElementById('rpConfirmField').innerHTML = passwordFieldHtml('rpConfirm', 'Confirm new password', 'new-password');
document.getElementById('formArea').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-toggle-pw]');
  if (!btn) return;
  const input = document.getElementById(btn.dataset.togglePw);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.textContent = input.type === 'password' ? '👁' : '🙈';
});

function updateChecklist(pw){
  const r = passwordRequirements(pw);
  Object.keys(r).forEach(k=>{
    const li = document.querySelector('#rpChecklist [data-req="'+k+'"]');
    if (!li) return;
    li.textContent = (r[k] ? '✓ ' : '○ ') + li.textContent.slice(2);
    li.style.color = r[k] ? '#45D6C4' : '#8C97A6';
  });
}
document.getElementById('rpPassword').addEventListener('input', (e)=> updateChecklist(e.target.value));

document.getElementById('rpSubmit').addEventListener('click', async ()=>{
  const pw = document.getElementById('rpPassword').value;
  const confirm = document.getElementById('rpConfirm').value;
  const msg = document.getElementById('rpMsg');
  msg.className = 'msg';
  if (!passwordValid(pw)){ msg.className='msg error'; msg.textContent = 'Password doesn\'t meet the requirements above.'; return; }
  if (pw !== confirm){ msg.className='msg error'; msg.textContent = 'Passwords don\'t match.'; return; }
  const btn = document.getElementById('rpSubmit');
  btn.disabled = true;
  const { error } = await supabase.auth.updateUser({ password: pw });
  if (error){ msg.className='msg error'; msg.textContent = error.message; btn.disabled = false; return; }
  document.getElementById('formArea').style.display = 'none';
  msg.className = 'msg ok';
  msg.textContent = 'Password updated. Redirecting…';
  setTimeout(()=>{ window.location.href = 'index.html'; }, 1800);
});

// If someone lands here without a valid recovery session (e.g. opened the page directly, or the
// link expired), let them know rather than showing a form that will just fail.
supabase.auth.getSession().then(({data:{session}})=>{
  if (!session){
    document.getElementById('formArea').style.display = 'none';
    const msg = document.getElementById('rpMsg');
    msg.className = 'msg error';
    msg.textContent = 'This reset link is invalid or has expired. Request a new one from the sign-in screen.';
  }
});
</script>
</body>
</html>
